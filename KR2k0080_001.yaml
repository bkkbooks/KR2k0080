塘於繞城五百五丈二尺塘腳外鋪砌條石坦水二層裏高外低斜披而下每丈每層寬一丈二尺下用塊石砌高上用條石蓋面每層石口各釘排樁二路每路用樁二二十根以圍圎尺四五六之長木間釘下砌塊石每層牽高三尺計石三方六分每方重一萬四千斤二層共一十萬八百斤上蓋條石每層寬一丈二尺用厚七寸寬一尺二寸條石十路計折正石七丈二層共十四丈或有舊存合式樁石酌量添用草盤頭即挑水壩靠出海中形如半月蓋因其處塘堤原屬平穩一經對岸沙漲或海中沙灘陰積水勢直射受沖平即成險故築草盤頭以挑溜其法下捆掃牛鋪底或以竹簍盛石為腳周圍密釘排樁加鑲柴土并用塊石貼樁填砌以固根腳仍如柴塘按丈簽釘底面腰樁再於頂上用雲梯蜻蜓架釘長樁深貫其底計高三四丈外圍長三四十丈內直長一二十丈不等築法亦不一謹摘大略以備稽考寧邑塘工之患雖在北岸而致患之由則在南岸緣南岸常有沙灘漲起挑溜北趨塘工日加危險江河湖海形勢雖殊而東坍西漲理無二致大學士嵇曽筠創為借水攻沙之法於南岸沙洲用鐵器隨勢挑挖或順溜截根或迎潮挑溝使江水海潮晝夜往來自為沖刷江溜日趨南岸北岸淤沙日漲大工得以告成乾隆九年巡撫常安設法疏濬中小亹引河蜀山一帶仍用切沙之法內則疏挖外則挑切至乾隆十一年春夏間潮汐漸向南趨漲沙日見寬廣十二年中小亹大通未必非切沙法相與有成也雍正十一年內大臣海望直𨽻總督李衛請於海寧迤東尖塔兩山之間築石壩一道分殺水勢俾潮汐南趨北岸護沙可望復漲都統隆升等於潮平時測量應築石壩長一百八十二丈淺處深四五六丈中流深一十二三丈不等調撥滿漢員辨採辦石塊水陸並運編篾為絡裝石沈放又於尖山之西文武菴前築雞嘴壩一座以挑回溜而波濤洶涌難於合龍十三年大學士嵇曽筠奏請停工計堵過石壩四段共長一百二十丈用銀五萬一千五百兩有竒乾隆四年巡撫盧焯閲視未堵口門八十丈巳經積有浮沙最深之處不過丈八九尺與從前測量逈别疏請仍用竹絡裝石乘勢接築一舉合龍於五年二月開工至閏六月告竣用銀一萬七千三百三十一兩有竒木匱之法用徑大五六寸之圓木製成匱形高五六尺長七八尺寬四五尺不等四面為柵其柱木上留七八寸加砌蓋石下留四五寸插入沙土中用塊石填塞緊密加以整株長木聯絡如一遇頂沖險要之處釘樁甃石不及或用實塘底或用為坦水隨宜安放乃聚小石為大石之法潮落後即搶釘關匱排樁加砌蓋匱條石其體既重其坐自穩潮頭洶湧可免捲拔之患回溜汕刷無外淌之虞矣竹絡又名石簍以篾編造內貯塊石外用竹篐有方長二式如纍髙者用方竹絡平鋪者用長竹絡前代修築相沿用之雍正十二年都統隆升於海寧尖山西築雞嘴壩編造方竹絡纍髙兩邊為牆每個髙三四五尺寬六七八尺不等乾隆八年浙閩總督那蘇圖以海寧觀音堂諸處草塘衝刷成險塘外編造長竹絡丁順鋪放以作坦水挑溜挂淤每個髙寬各五尺長一丈四五尺不等絡外密釘長樁關鍵并釘東西裹頭樁迎潮抵溜明成化十三年副使楊瑄修築海鹽縣石塘以意改為坡陀形因名坡陀塘先是塘石皆疊砌勢陡孑瑄以為潮激之生怒易潰乃倣宋王安石居鄞修築定海塘式砌法如斜坡用殺潮勢石底之外俱用木樁以固其基初下石塊用一橫石為枕循次豎砌裏用小石填心外用厚土堅築今鄞縣砌法不可考瑄之坡陀塘具載海鹽圖經坡陀塘嵗久仄壓𢎞治中巡撫侍郎彭韶重築仍疊石如舊法而略倣坡陀意內橫外縱以漸減縮令斜十三年知縣王璽繼之備講縱橫之法其法有一縱一橫二縱二橫下濶上縮內齊而外陂因名樣塘至嘉靖二十一年僉事黃光升築法尤備先去沙塗之浮者四尺許見實土乃入樁與土平仍旁築令實乃置石為層者二是二層者必縱橫各五令廣擁以土使沙塗出於上令深層之三若四則縱五之橫四之層之五若六縱四之橫五之層之七若八縱橫並四之層九十縱三之橫五之層十一層十二縱橫又並三之層十三層十四縱三之橫二之層十五縱二橫三層十六縱橫並二層十七縱二橫一層十八是為塘面以一縱二橫終焉石之長以六尺廣厚以二方琢必方砥必平層表裏必互縱橫作丁字形以彌直罅之水層中橫必稍低昂作幞頭形以彌橫罅之水層相架必跨縫而置作品字形以自相制使不解散層必漸縮而上作階級形使順潮勢無壁立之危又堅築內土培之塘成一丈率用銀三百兩海塘録卷一
