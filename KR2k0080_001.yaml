body:
  text: 海塘録卷一內閣中書翟均廉撰疆域杭州海塘自海寧止然其海非大洋也仁和以西稱江仁和以東稱海江之廣不過十餘里即海寧之海亦不過數十里苐龕赭兩山夾峙於江海之處潮水由廣入隘奔騰衝擊上激塘身下搜塘底其危險較濱臨大海者加甚焉省城多山迤東四十里為仁和之翁家埠向以水流沙活止築草塘抵禦自翁家埠起五十里至海寧城又五十里至尖山舊皆壘土鑲石一線危堤綿亘一萬數千餘丈受朝夕兩潮衝擊此唐宋以來葺治相仍所不廢也國朝列聖訏謨軫念海塘勤恤民隱不惜重帑以成經久之圖皇上纘承祖武旰食宵衣厪念海隅黎庶特以江流未循故道時勤玉輅親歷海壖咨度指示定議加築柴塘增置坦水聖謨廣逺至詳至備行見海若效靈安瀾底績數百里海隄鞏若盤石焉誠萬世無疆之利賴也浙江在杭州東南源發於歙縣入嚴州桐江而衢州水自常山來與江山之水滙流至蘭溪又會金華之水並歸桐江入杭之富陽曰富春江波平而塘易固故隄防猶緩至錢塘則曰錢塘江水激而駛蓋江水從西南來過仁和而入海海潮從東北至趨錢塘以滙江江猶狹而海廣濶沖激時虞不免又近在省城西南稍有潰決則浸入內地故江塘之重與海塘等隄防之設上稽史志自漢華信議築防海大塘而吳越捍江塘繼之暨乎宋明代有修築及我聖朝屢敇大臣營度建塘修護不惜帑金而聖祖仁皇帝臨幸錢塘親灑御書照耀江浦至我皇上丕承祖武省方幸浙遍閲諸塘諦察江溜形勢指示精詳自是三折恬波聖澤之長與江流俱永矣引河即中小亹中間所濬之河也江海之門戶有三在龕赭兩山之間者為南大亹在禪機山之北河莊山之南者為中小亹河莊山之北海寧海塘之南為北大亹水勢南徙賴有紹郡龕常諸山捍衛其患猶輕水勢北徙則直逼仁和海寧塘身為害最劇惟中小亹適當南北兩岸之中江水海潮若由此出入兩岸得資鞏固前總督滿保巡撫朱軾會勘開濬潮過即淤迄無成效雍正十一年副都統隆升等調撥滿漢員辨分段攢挖又設立専員隨時疏濬未幾復塞大學士嵇曽筠因有請停開濬之奏我皇上旰食宵衣厪念海隅黎庶特命大臣詳加閲視準令隨時斟酌相機挑挖兼用切沙之法於蜀山之南開溝引溜以順水勢又於北岸安放竹簍挑溜挂淤至乾隆十二年十一月朔江流直趨大溜全歸衝刷河身通暢此皆我皇上睿慮精詳至誠昭格從此江海效靈南北兩亹漲沙日積濱海生靈永無驚濤駭浪之虞矣海寧舊無土塘雍正十一年內大臣海望總督李衛以魚鱗石塘難以速成請於海寧龜山南至仁和李家村築土備塘一道離外塘或一里半里購買民地按𤱔豁糧塘高一丈二尺每丈需虛土五十五方水三旱七按方給工頂寬二丈四尺底寬五丈又恐外有石塘內有備塘雨水無從㵼泄因於最低之處築涵洞十七座以泄水石閘四座兼通舟楫又於備塘河建木橋二十六座以通行人每石閘一座金門濶八尺高一丈四尺兩邊金剛牆并前後雁翅各長四丈上鋪石為橋砌墊㵼水石閘下釘梅花樁一百十一根背搯砌塊石寬四尺條石二百三十五丈三尺五寸二分塊石二十三方七分六釐計工料銀四百四十兩有竒每涵洞一座長五丈高三尺五寸寬四尺六寸條石六十一丈二尺五寸釘梅花抱石二樁二百九十九根前後雁翅洞身牆背共砌石七十塊計工料銀七十一兩有竒每木橋一座高一丈二尺濶四丈八尺計五空用長三丈五六尺徑六七寸大木十株共計工料銀二十二兩有竒柴塘始康熙六十一年巡撫屠沂於朱軾請築石塘處有土活不能施石之地奏請改用柴塘其法先捆掃牛鋪底上以柴土間層加鑲頂上加培厚土高三四丈寬三四五丈不等每長寬一丈釘底樁二根腰樁二根面樁二根於樁頭削尖簽插柴土若地值頂衝難免抽掣之虞復於內地深釘橛樁用篾纜帶住凡沙土浮活難築石塘之處皆用此法乾隆壬午恭逢皇上親歷海塘周閲形勢聖謨廣運指示精詳誠萬世不易之良法也雍正十年潮勢洶湧加以上遊江水驟長老沙洗刷潮頭直逼內地世宗憲皇帝特命內大臣户部侍郎海望直隸總督李衛赴浙相度機宜議於尖山起至萬家閘統建大石塘疊奉恩綸雖帑金千萬不惜不可因塘外漲沙停止修築煌煌天語務為海隅生民謀久逺乂安之計我皇上御極厪懷民隱屢敕興修廟算精詳神功底定恩至渥也其築法塘身高十八層者每丈用厚一尺寬一尺二寸條石一百一十八丈三尺三寸三分石有厚薄不等以丁順間砌參差壓縫計高一丈八尺為準頂寬四尺五寸底寬一丈二尺內除收頂蓋面石以及鋪底蓋樁石各一層不留收分外自底上第二層至十二層每層外留收分四寸內留收分一寸又自十三層至十七層每層外留收分三寸內留收分一寸共留收分七尺五寸底寬一丈二尺外口釘馬牙樁二路以禦潮刷樁縫中心重石之下擔負全力釘馬牙樁一路及後一路共四路每路用樁二十根共樁八十根尚餘底空釘梅花樁七路每路用樁一十根共樁七十根二共樁一百五十根俱一木一樁馬牙樁用圍圓一尺五寸長一丈九尺之木梅花樁用圍圓一尺四寸長一丈八尺之木塘長九層以下外砌坦水保護不扣錠鋦外自第十層十二層十四層十六層每層每丈扣砌生鐵錠二個熟鐵鋦二個又收頂蓋面石一層前後扣砌生鐵錠一十六個每條石一丈用砌灰五斗每砌灰一石用汁米五升右底樁一十一路共一百五十根內馬牙樁四路計八十根每根用圍圓一尺五寸長一丈九尺梅花樁七路計七十根每根用圍圓一尺四寸長一丈八尺右第一層寬一丈二尺俱丁砌蓋於底樁之上計用折正厚一尺寬一尺二寸條石一十丈外砌做細丁石二丈五尺裏砌做粗丁石七丈五尺