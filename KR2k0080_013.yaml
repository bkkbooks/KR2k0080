body:
  text: 海塘録卷十三內閣中書翟均亷撰奏議一撫臣朱軾請修海寧石塘開濬備塘河疏康熙五十七年寧邑海塘自康熙五十四年前撫臣徐元夢題請修築委鹽驛道裴􅏍度督修該道於五十六年正月內赴工至六月間連日風潮洶涌新工未竣舊工復坍經臣咨明工部督率搶修迄今未完工程二百餘丈現在上緊催修尅期報竣查沿塘俱屬浮沙潮水往來蕩激日侵月削塘腳空虛雖有長樁巨石終難一勞永逸歷考志乘自元明以來屢經修築或一二年或五六年以至十餘年俱係隨坍隨築直待塘外沙漲然後停工臣屢至工所相度情形博採輿論再四商確惟有用前人朩匱之法以松杉宜水之朩為匱長丈餘髙寬四尺橫貼塘底實以碎石以固塘根乃用大石高築塘身附塘另築坦水髙及塘身之半斜豎四丈亦用朩匱貯碎石為幹外砌巨石二三層縱橫合縫以護塘腳如此雖不能永逺保固亦不遽至坍塌再查塘內向有河道名備塘河潮汐往來稍稍漫過塘面猶恃河可稍容不致驟溢自明季居民貪利節節築壩遂淤為陸今河形尚存應去壩疏河即以挑河之土培岸則濬河以備塘培岸以防河是亦有備無患之一法也日前巳成之工無容改築但添修坦水以護塘根未完之工應如法修築嗣後隨坍隨修直至沙漲乃巳但查原題鹽驛道裴􅏍度承修塘上止二千餘丈今石塘三十餘里均須防守不時修築又有東西土塘現在坍塌更宜及時堵禦工程浩大非可計日告竣裴􅏍度一人實難料理應令布政司假志熙督率杭州府知府張為政等協同修築互相查察其採買朩石交發錢糧令糧儲道劉廷琛承辦工部覆督臣覺羅滿保撫臣朱軾題請建築海寧石塘開濬中小亹淤沙議康熙五十九年浙江海塘先經福浙總督覺羅滿保巡撫朱軾以海寧上虞二縣修築工程上請行令勘議確估今稱㑹勘得上虞縣夏蓋山起西至雀子村止一帶沿海土塘多被海潮沖坍無存地與海平且沖開缺口數處其南大亹久巳淤成平陸江海不循故道直沖北大亹而東并海寧之老鹽倉亦皆坍沒入海所有海寧上虞二縣建築開濬需用錢糧數目調委監工修築官員各事宜臚列備陳一議築海寧縣老鹽倉北岸石塘以防海水內灌查老鹽倉一帶正當江海交㑹今土塘隨浪坍頽現在沖開徐家壩一口與內河支港相通巳築石壩堵塞且老鹽倉北岸皆係民田廬舍支河汊港甚多俱與上河通聨東即長安鎮與下河官塘僅隔一壩若不于此急築石塘堵禦萬一土岸坍盡決入上下運河則鹽潮直注嘉湖蘇松列郡關係甚巨今擬於老鹽倉北岸東自浦兒兜起西至姚家堰止共一千三百四十丈砌築石塘方可保護杭嘉湖三府民田水利除現在採買蘆葦乾柯等料於患口先築草壩又就近開採武康縣大石購買巨朩乘此春夏運至工所急築石塘以防潮水泛溢查該督撫既經勘明關係甚巨應如所題購買朩石乘時建築務期堅固一議築石塘之式以防潮水連根搜刷查海寧沿海地方俱係沙土且潮汐往來變遷無定今沿海一帶漲有微沙乘此新漲時急將石塘砌築將來沙能漸聚便可擁護塘根臣與撫臣再四相度商確因地制宜就於塘岸用長五尺濶二尺厚一尺之大石每塘一丈砌作二十層共髙二十尺於石之縱鋪側立兩相交接處上下鑿成槽筍嵌合聨貫使其互相牽制難於動搖又於每石合縫處用油灰抿灌鐵鑻嵌口以免滲漏散裂塘身之內培築土塘計髙一丈寬二丈使潮汐大時不致泛溢塘基根腳密排梅花樁三路用三和土堅築使之穩固總期一朩一石皆得實用不敢浮費錢糧亦不敢草率修築致貽後患應如所題如式建砌以垂永久一議開中小亹淤沙以復江海故道查赭山以北河莊山以南乃江海故道近因淤塞以致江水海潮盡歸北岸今雖砌築石塘然中小亹淤沙不開則回潮沖刷一日兩次土石塘工終難穩固今多雇民夫將中小亹一帶淤沙上緊挑濬計挑過一千九十丈大汛時潮水亦可出入現在將巳挑者開濬深濶未挑者兼工開浚使江海盡歸故道則土塘石塘可免潮勢北沖之患查中小亹挑濬既有成效應行該督撫將巳挑者再加深寬未挑者速行開濬一議築上虞縣夏蓋山石塘以防南岸潮患查上虞縣原有土塘五千四百一十七丈以障蔽民田夏蓋山之南有夏蓋湖周圍一百五里蓄水注䕃上虞餘姚二縣之田並藉土塘捍禦近年夏蓋山對海中流漲有圓沙數十里潮逼南岸今先將患口填塞其潮水稍緩之處上虞之民願捐築土塘惟夏蓋山西邉實為最險要衝非建石塘斷難遮護隨親勘丈量共長一千七百九十丈今用長五尺寬二尺厚一尺大石於羊山及夏蓋山開採運用隨地勢髙下每丈十三層以至三十四層不等縱橫疊砌庶南岸之潮患可禦查夏蓋山潮勢稍緩之處土民既願捐築土塘應令其速行建築其西邉最險之處既經勘明應建石塘應如所題如式建砌一議實需銀數以濟巨工查沿海塘堤實為各郡保障若不及時修築貽患無窮即或茍簡因循亦恐隨成隨毁今海寧縣老鹽倉北岸新築石塘一千三百四十丈所需工料等項約共銀九萬二千兩可以預為估計惟樁朩人工難以預定應俟工完之日查驗另銷上虞縣夏蓋山新築石塘一千七百九十丈共估需用銀五萬八百兩兩處石塘工料共估銀一十四萬二千八百兩除將五十七年海塘捐納案內餘剩銀六萬三千二百九十九兩現在撥用外其不敷銀兩一時難於措處請將浙省各府屬現行常平倉捐監之例暫停統於海塘案內收捐補用俟工竣足額即行停止仍歸常平倉收捐其現在不敷工料銀兩請於藩庫先行動支俟收捐補項可也一議調委經理各官以專責成查藩司為錢糧總滙兩處塘工凡收貯銀兩支領出入之數俱令布政司傅澤淵總理稽核其海寧縣老鹽倉北岸石塘遴委溫處道蔣敷錫親身督修統司稽察再委處州府知府蘇稷督修沿塘草壩船政同知陳良䇿紹協都司孟飛熊等挑濬中小亹淤沙其上虞縣夏蓋山石塘專委紹興府同知閻紹等各員分任督修其雇募夫匠儧運石料等項仍令海寧上虞二縣知縣專管䇿應查調委官員應如所題怠玩侵冒自行嚴參至修築工程係地方官專責無容議叙一議專員嵗修以保永固查沿海潮汐惟浙江為最非有專員經管未見實效請將南岸紹興府之上餘山㑹蕭五縣石塘土塘專交紹興府同知閻紹管理北岸杭州府之海寧仁和錢塘三縣之石土塘專交原任金華府同知劉汝梅管理嘉興府之海鹽平湖二縣石土塘專交嘉興府同知王沛聞管理各員銜內添入海防字樣專任責成小有損壞即時修砌其屬轄之巡檢場員聽其調委分任惟杭郡别無閒員可以經理塘務查金華原非劇郡向設同知一缺請裁去添設杭州府海防同知一員專司其事即將開復候補同知劉汝梅補授任滿之後此三缺即於通省同知通判知縣㨂選調補庶人地相宜於塘工有益至嵗修錢糧現在無項可動查寧邑海塘捐監餘剩銀兩原留藩庫為嵗修之用今動支修築石塘應仍於新工案內照從前餘剩之數捐足還項留貯藩庫為逐年嵗修之用亦如所題可也工部覆督臣滿保撫臣朱軾築草塘議康熙六十一年浙江海塘先經督臣滿保與前撫臣朱軾題稱東自浦兒兜起西至姚家堰止建築石塘今據該撫以海潮遷徙無定修築堤岸必須隨時制宜題請於土浮不能釘樁砌石之處趕築草塘臣部恐草塘不能永久仍令砌築石塘今該撫疏稱海寧縣海塘因潮頭沖激將上年勘定實土處所縱橫實砌石塘其土鬆之處樁石難施者趕築草塘五百四十丈今春因潮勢洶湧急宜搶築隨即築草塘三百丈仍於實土處又築石塘連前共五百丈并將姚家堰西續坍處所亦築草塘二百一十五丈次第完工查老鹽倉等處修築草塘原議石工今於實土處所砌石塘其土浮樁朩難施之處改築草塘工程雖經報竣但草塘究非石塘可比其中恐係督率承修各官希圗草率完結亦未可定應令督修各官保固三年限內如有沖塌責令賠修吏部尚書朱軾請修杭嘉紹等府塘工疏雍正三年臣馳驛至浙㑹同巡撫法海布政使佟吉圗至餘姚東自滸山鎮西至臨山衛六十里舊等土塘三道最內一道為老塘即昔年海岸也今離海三四十里或十餘里不等緣歷年沙塗淤漲百姓陸續開墾報升自築土塘二道是為外塘詢據土人俱云潮水從不到塘若加髙三四尺加厚五六尺即遇風潮亦不致衝決漫溢查歷年內塘係民戶修築外塘係竈戶修築今被災之後民竈無力應令地方官動用公費興修又自臨山衛起至上虞縣交界烏盆村十五里自烏盆村至㑹稽瀝海所四十五里內石塘二千二百餘丈係康熙五十八年題建至今穩固其石塘東西兩頭共土塘七千丈坍塌甚多沿塘雖有沙塗數里但海潮往來無定不得不預為防護擬於塘底開深二尺填築亂石上鋪大石寬六尺髙六尺以固塘基貼石築土寬二丈高一丈三四尺塘內令居民栽種榆栁近塘窪下坑陷一槩築平庶可永固又歷勘杭嘉二府西自仁和縣翁家埠起東至海寧縣城東陳文港七十餘里歷年洪濤衝陷屢經修建石塘題報在案今賴聖主洪福塘外淤沙三四十里不等髙處平塘低處露出塘身三四尺不等毋容議修自陳文港起至尖山二十餘里草塘七十四丈亂石砌邉土塘三千七百二十六丈塘外淤積沙塗尚薄潮水猶注塘下應將土塘加寬一丈五尺髙三尺頂鋪條石厚一尺以防泛溢其草塘七十四丈並照式改修冉塘外原有亂石子塘寬三四尺不等外加排樁因年久欹斜子塘大半零落應修砌完固堤前原無子塘之處亦照式興修如此則海寧塘工可無衝決之患矣又海鹽縣東自秦駐山三澗寨起西至演武場止石塘二千八百丈係明時修建塘身髙濶琢石見方縱橫合縫通塘合為一塊最為堅固因年久水沁塘根樁朩朽壞南頭陸續坍塌八十餘丈今應移就實地修築又去秋風潮衝潰八處共七十丈其附石土塘通身洗刷成坑應照式重修補築自演武場至平湖縣雅山炮臺一帶土塘現在地方官加修月內可以完工以上杭嘉紹等府海塘臣等逐一勘議查估餘姚上虞㑹稽三縣應修塘工共七千丈每丈用長六尺寬二尺厚一尺五寸條石二十四塊并亂石價銀夫匠土方雜費共用銀十四兩通塘共用銀九萬八千兩海寧加修亂石塘每丈蓋頂小條石連價用銀一兩共用銀三千七百二十六兩加寬加髙土方并補修子塘約用銀四千兩共用銀七千七百二十六兩冉海鹽縣坍塘據地方官估計用銀七千六百餘兩但應否增添石料難於懸度將來或可節省亦未可定統俟工完核實造冊題銷撫臣李衛兩浙海塘緣由疏雍正四年臣查勘現在興工之塘堤酌量修理紹興府屬之㑹稽餘姚上虞等縣一路塘工從前升任吏部尚書朱軾㑹同前撫臣法海勘議題明修築石塘共七十丈原議塘底開深二尺填築亂石每丈上鋪條石髙六尺寬六尺貼石築土寬二丈髙一丈三四尺庶可永固部覆允准後經紹興府知府特晉德因㑹稽縣瀝海所西滙嘴應築塘二千七百丈地勢卑下恐亂石起底難以抵禦請改用條石起底將原議之墊底亂石填肚方能堅固當經布政使佟吉圗轉詳前撫法海批准於署撫臣傅敏未到任之先巳築完工石塘一百五十二丈九尺又起底并鋪砌層數不等共一千五百七十七丈八尺雖係變通似亦有理然未經題咨而管工各官因購取條石路逺難運且並無一尺五寸厚者又兼原估錢糧稍有未敷定限過急即於就近之臨山衛夏蓋湖等處本地所産亂石採買搭砌其工已完五六分頗屬草率後經署撫傅敏親往查勘恐不堅固是以一面具奏一面勒令拆毁仍令遵照原題改正用亂石填底二尺上面俱用條石到頂催促完工及臣到時復又改做過半其餘尚有巳完未拆并未曽修齊者然比從前草率完工果屬整齊不同但思江海工程皆當以根腳堅固為主歷來多用朩樁釘底可保永逺若止圗上面整齊恐遇風大潮急根腳不穩臣細加查勘幸此處一帶工程底下俱係生成鐵板沙土性堅固毫無軟硬不同之處即亂石在下不用朩樁亦屬穩固况塘外漲出沙灘離海邉二三十里以至十餘里不等若非秋汛大潮海水不致到塘即從前土功尚能抵當今用石包砌在外自必更堅臣愚昧之見將署撫傅敏巳拆改正之工並前撫法海任內報完石塘擇其堅固者似母庸冉動其巳估未修並攙搭亂石巳修未拆之工揭去浮面蓋板將碎小爛石檢出下存墊底石板每層用大條石釘鈐以原議墊底亂石檢有稜角成塊者牽配搭砌隔一層再用整條石鈐制務須橫豎勾搭壓縫連成一片可保永久其檢出之碎石雖微然棄之可惜應令特晉德等賠修未估在內工程倘不洗心改正修成一勞永逸即遽實題參治罪但限期不便過急務令於秋汛之前趕築告竣此紹興府屬㑹稽餘姚上虞三縣浙東海塘之情形也臣又隨往杭嘉二府屬之海鹽等縣海塘查勘原題現在修築塘工其水勢與東路逈異而海寧海鹽兩縣城郭皆逼海邉塘下亦無漲沙為之遮護緣數十年來海潮不由中小亹涌入但從北大亹往來故此兩縣最稱潮大工險其縣治之外離數里許皆有漲沙不等查舊日所修石塘久經告成雖石塊碎雜根腳俱有朩樁尚屬堅固獨縣西有老鹽倉一處塘工五百丈石大而堅可保永久緣原修價值比各工不同之故其近今題明加幫陳文港至尖山一帶土塘并補修子塘俱經築完而海鹽之秦駐山至演武場石工亦巳告竣下用朩樁釘底石塊亦屬整大臣查驗似可無虞惟近城有老工三四假各長十餘丈不等目今稍覺歪斜因年久根底樁朩朽爛現令拆換修整餘工無恙此浙西海塘一路之情形也總之每年秋汛甚大必須時加防範年年嵗修自然無害若將石土各工冉加築髙更為有益但錢糧過多無項可支容臣續加調劑因時奏請不敢稍懈以祈仰副皇上軫念海塘有關民生至意撫臣李衛請築浦兒兜草壩老鹽倉草塘疏雍正五年海寧縣海塘上年自夏及秋雨水過多有康熙五十九年所建之浦兒兜草壩一座老鹽倉姚家堰草塘一千五十五丈年久草爛塘矬亟宜加鑲填補以禦春潮又姚家堰西至草庵止計長七里從前原係土塘近緣沙洗日削僅存土埂一條必須一律改築草塘方資捍禦浦兒兜草壩四十丈及老鹽倉草塘一千五十五丈需費銀六千五百八十三兩三錢又姚家堰至草菴一帶改建草塘八百二十六丈四尺需費銀九千三百五兩三錢六分四釐通共銀一萬五千八百八十七兩六錢六分零查海寧嵗修塘工例應捐監項下動支但此畨工程需費既繁且土堤改築草塘事同創建應先題明又海鹽縣閏字號石塘一十三丈計一十六層底石欹仄拆底全修現先給銀三百兩辦料興修臣查海塘捐監項下自康熙五十八九等年大工告竣經前升任撫臣朱軾等㑹題請將餘剩銀兩隨捐隨修但浙省各縣襟江濵海自北而南則有平湖海鹽海寧㑹稽上虞餘姚等縣沿海一帶塘堤又海潮由尖山入江自東迤西則有仁和錢塘并紹屬之蕭山山隂等縣沿江近海一帶塘堤其間潮汐沖徙不常若每年隨坍隨補則用費少而保固可久倘因循不修則圮壞漸多工費即巨臣上年到任後屢次親往各塘查勘如海鹽縣拆築收冬藏餘嵗五字號石塘共二十八丈五尺需用工費銀七百兩又朩字號石塘以南除先經接築一百丈外又接築矮塘一百八十丈俱用石砌築方正大石結面估工費銀二千五百六十餘兩又蕭山縣西江塘內堰陡孫槐樹下安義塘孔家埠談家浦等處土塘加樁加土增髙添濶并鎮潮菴王家池聞家堰一帶石塘應拆造添築數處共估工費銀一千五百二十四兩零又錢塘縣午山一帶葛家墳六和塔等處坍塘二十五丈四尺估工費銀一百一十九兩零善利院左側三郎廟老塘沖坍五丈估工費銀八十九兩零轉塘上首汪家池等處坍塘一十四丈柵外二圗小橋地方坍塘六丈估工費銀一百二兩零又仁和縣總管廟前矬坍江塘七丈又應拆卸補築四丈估工費銀六十五兩零以上海鹽等各縣塘工拆卸補等共應需銀五千一百餘兩皆係緊要工程必須及時搶修又錢塘縣轉至橫江埠應築坍塘三百三十三丈零橫江埠至曹家埠等處應築坍塘七十五丈以上共估銀六千三百餘兩自康熙五十七年即據地方勘詳請築因各處塘工浩繁此地秋汛巳過尚可緩圗是以尚未修築然貼近省城民田廬舍所關將來亦不能冉緩似此江海各塘延袤千有餘里此修彼圮歷年皆有接續之工查捐監銀兩從前諸臣因係海寧築塘所餘故止題為寧邑嵗修之用未將通省塘工聲說在內此外各縣之塘每年若有坍損又另于俸工公項等內動支遇有缺乏即多因循茍且之弊今俸工巳經停捐公項亦俱歸出而江海各塘俱關緊要且海鹽石塘更係對面頂衝尤屬危險此時若不陳明將來各縣之塘無項嵗修必致日漸圮損釀成巨工請嗣後凡有江海塘工應行嵗修者照例一體於此項內動給撫臣李衛請修錢家坂塘工疏雍正五年海寧縣沿海塘堤東西綿長潮汐晝夜侵齧前因浦兒兜姚家堰老鹽倉等處塘工嵗修告竣之時臣親往勘驗查有東塘之錢家坂迤西一帶樁板老塘護沙洗去直射塘腳板片年久朽爛欹斜亂石沖卸頽廢應行改砌加築及西塘之馬牧港亂石土塘直至大石塘一帶外沙漸髙於塘身大汛漫溢過塘泥土矬陷應加土石培築庶免泛溢之虞今勘得錢家坂最險工二十四丈又亂石塘內亦有險工六丈應改築堅厚又錢家坂東西各假共樁板塘身一千六十五丈亦應改築亂石塘以固根底又亂石塘西七十五丈應面加條石一層共計應行改築東塘一千一百七十丈再於堤身之下外加坦水一層其西首大石塘五百丈應加培築馬牧港地方有五百丈應上加條石一層并增添亂石培土髙濶有五百丈應止加條石培土闊厚其餘四百八十八丈止須加土足可捍禦共計應修西塘一千九百八十八丈通計東西二塘應築應修塘身三千一百五十八丈共需工料銀二萬九千九百五十五兩九錢三分現在行司將應修各塘動項辦料督工趁此冬季水小潮落之際催儧修築完工再海塘嵗修每年於嵗終報部察核此畨改築工程非尋常嵗修整補可比理合題明督臣李衛請修海寧老鹽倉海塘疏雍正六年浙省江海塘堤歷來北岸俱極險要惟海寧縣東西各塘為尤甚今年正月間春汛潮勢甚猛將老鹽倉迤西三官堂地方草塘沖坍五丈裂縫二三十丈臣隨飭各員晝夜搶修堵禦巳將坍者培築加髙裂縫者鑲釘牢固彼時塘外護沙尚有留至二三丈及十餘丈者塘身猶可藉以捍蔽不意二月十四日至二十二日連朝大汛又兼東南巨颶震撼蕩刷護沙卸陷無存塘身根腳搜空不能存站先後坍裂歪斜共計六百六十餘丈臣以塘工關係重大再三籌畫擬先築迎水壩以分潮勢或於貼塘加築石工為一勞永逸之計隨於三月初四日往海寧地方履勘見該縣塘工從前惟南門外最為險要自築亂石大塘之後俱有護沙包裹雖不甚老而漸次堅實可以捍禦潮汐惟老鹽倉西首一帶塘外沙腳刷盡潮頭之來直射堤身隨後即有軟浪蕩滌及退潮時又因回溜將底沙齧洗一日之間早晚兩次非如黃河水性徑直可以建壩分勢又此地數里俱係活土浮沙若承載巨石即致底陷雖用朩樁加釘而俄頃之間仍復拋起不能施工所以從前督撫諸臣幾經籌酌不得不于緊要患口築草壩草塘以為堵禦之計今臣相度形勢猶幸裏塘民田地土尚屬髙阜不致即有內灌之虞現在動支海塘嵗修銀八千兩委員將現坍之六百六十餘丈搶築塘身上下鋪砌堅實以保坍陷一面多備物料以預防梅雨伏秋二汛搶修工程之用惟是沿塘數里沙腳日見衝洗此外冉有坍裂難以預定止有上緊保護隨坍隨修或於塘內冉築一層以固民田或於小汛時將裏塘挖深數尺幫砌護塘之處容臣因其地勢潮汛情形悉心籌畫另行具題督臣李衛請修海寧海塘及錢塘等縣江塘疏雍正六年海寧縣海塘緣歷年潮汐沖決護沙坍徙靡常必須每嵗續漸補修方能保護臣屢經履勘見南門一帶向有漲沙盡行坍卸潮水照舊直逼塘腳民字阜字二號石塘根腳年久外樁坦水沖洗歪斜塘身傾矬并有倒卸之處又華嶽廟前及平橋西小石塘亦有塘身矬陷坦水外卸巳飭員搶修此假工程除現修外若冬月護沙不能復漲則來嵗俱成險工應即隨坍隨修俟秋汛過後潮落之時再看有無沙起另行酌議又楊家莊一帶亂石塘前經議令加土培闊但塘身原屬低窪本年雖則保固無恙將來再遇夏秋大汛必致漫溢關係非輕應加築髙更有馬牧港一帶樁板亂石土塘一千丈前止加條石一層今潮水平塘大汛皆有漫過之處幸而搶救未滋大害亦應酌量再加築髙又翁家埠一帶原無官塘其臨海月牙灣不能保固亦應酌量地勢接建草塘與舊有之草塘相續當即行司確估去後據布政司高斌詳稱寧邑南門外河安民阜等字號及華嶽廟平橋西楊家莊馬牧港等處各假工程計勘應修築塘共四百五十三丈坦水四千四百六十四丈三尺估需銀二萬三十一百三十八兩此外又有搶修海寧平橋西等處坍壞殘缺塘身一百二十三丈坦水一百六十三丈用銀八十六兩七錢七分五釐零又海鹽縣請修白馬廟等處加髙土塘一千七百三十餘丈估需銀四百九兩九錢零又南岸㑹稽縣請修十三都一四兩圗矬坍石塘四十八丈六尺又拆修三十八丈估需銀二百七十六兩二錢五分零又接築錢塘縣斷塘尾江塘一百六十五丈估需銀三千六百五兩五錢零又諸橋一帶江塘加築塘石一層計長四百一丈拆砌江塘一百六十九丈估需銀一千一百八十三兩一錢二分零查江海塘工原以保護民生而潮汐沖决月異嵗遷若不逐年預為搶修培築瞬息即成大險之工費多勞倍臣以有關緊要隨於捐修海塘銀內動支八十兩給發辦料乘此冬令潮小之候興工儹築委杭嘉湖道王溯維稽察錢糧工料總理其事臣與布政使髙斌不時親督稽察務期堅固以保安瀾所有工料銀兩完竣之日確查報銷督臣李衛請另築石塘并築盤頭草壩疏雍正七年本年九月臣由嘉興府前往海寧查勘海塘情形緣今嵗潮汐夏秋之間較往年更大故先於閏七月初旬預發銀一萬兩著杭嘉湖道等加意搶修設法堵禦臣回籍之後復經性桂蔡仙舢親往查勘又續發銀三萬兩趕辦物料備築凡有沖缺矬裂之處多用柴草樁朩隨時搶護晝夜隄防其潮溜頂沖地面竭力購備土石幫闊培髙以禦漫溢自閏七月以及八月猶可支持惟九月初二日潮勢更大幾至過塘甚屬危險幸遵循聖訓先事預防舊塘土石雖大半沖削而新經幫培之所猶能抵禦狂瀾不致潰決今各處工程有巳經題報搶修甫完而續被沖卸者有原估應須拆砌而題後即值秋潮洶涌不敢開底砌築暫用柴草搶堵者有于秋汛續坍未經題報而現巳修竣者逐假間雜參錯不齊臣隨與性桂蔡仙舢等傳集工員公同確議寧邑沿塘東自尖山西至翁家埠綿亘百里皆臨大海非同從前工假僅止數百餘丈險塘可比若欲盡建巨石大搪為費實屬不資是以向來督撫諸臣俱于不用石工之次險處所議築草塘抵禦彼時塘外尚有護沙攔擋潮水略有到岸不致侵齧根底每年嵗修加鑲猶可恃以保護今則南岸中間突有漲沙阻厄潮頭直射北岸護沙無存岸邉深至二三十丈不等朝沖暮擊一線草塘豈能捍禦全海潮勢若非裏面添砌石工難以保固惟是合式巨石採辦需時且現在于江塘料半向浙山開採出産一時不敷又兼海河閘壩轉運艱難勢必曠日持久豈有聼其沖卸坐待辦料齊全而後動工之理况此時正當冬泛若不急于設法整備轉瞬春潮坍卸堪虞臣等再四籌畫西塘除老鹽倉東原有大石塘五百丈外自此至翁家埠一帶俱係險工內荆煦廟起至草菴止向有先後修築草塘一千九百餘丈此時俱係土塘今就草塘之內收進二三丈開深根腳用大樁排釘深入沙底儧辦巨料砌築石工一面多備柴草樁朩將舊日草塘根腳虛浮加樁簽釘鑲砌髙厚其原無草塘者酌量增添仗此舊有草塘以護其外使內之石工人力可施保至三年之期即草塘或有損壞而石工亦巳告成沿海民生永保安瀾之慶矣至東塘潮頭自尖山直趨而來勢猛溜急在在危險今於陳文港小墳前薛家壩及念里亭等處分築挑水盤頭大草壩五座周圍簽釘排樁中填塊石竹簍深入軟泥之下作為底腳上加掃料壓蓋堵禦頂衝使水勢稍緩可引漲沙漸聚一面將東西兩塘夏秋坍損等處竭力修補其逺年塊石各塘有不能抵禦者酌量改砌加髙培厚其一切號假工程現在勘估確實造冊另報督臣李衛請添築盤頭大壩增設兵辨疏雍正八年臣於雍正六年查勘海寧城外東西一帶漲沙盡卸潮汐改流誠恐次年更加危險隨將應修石土谷塘共估銀二萬三千餘兩題請修築彼時不過先事預防豈意果於七年春間南首海中漸亘巨沙潮逼北岸夏月沖擊更甚坦水坍卸塘身震撼日有矬陷及臣聞訃丁憂在浙候㫖之時正值秋潮更大塘工危於呼吸署撫臣蔡仙舢雖經發銀備料搶修而東西兩塘道里遼闊實有不敷臣尚在地方何敢坐視將鹽務公項銀一萬兩發貯縣庫交杭嘉湖道王斂福等支領辦料先將各處塘身積土加培髙厚暫禦漫溢一面施工隨時搶修以為急則治標之計逮臣回任先經順途親往查勘於九月初旬潮勢猛急前題之外又多續坍當飭各工員隨坍隨築上緊搶修㑹同司道啇酌先將草塘加厚增築以護其外再於草塘之內砌築石工以備後患又相形勢潮流湍急于近塘往來汕刷潮退露出低窪之處儼若河形非築排水大草壩以分其勢則晝夜搜根塘腳空虛難以存立不敢膠執前見因於陳文港等處議建草盤頭五座堵禦頂衝一面將塊石各塘酌量改砌條石塘坦以期堅固亦於十一月十五日彚疏具題本年四月初一等日臣親往寧邑沿塘履勘查東塘盤頭五座內除白牆門念里亭巳先建大者二座并錢家坂添一小座外其餘三座今春築完并於小墳前之頂大一座盤頭兩旁增築雁翅使潮水得以兩面順勢掃出不致壅遏沖激前之近塘低窪河形亦得漸平現在頗見成效而西塘一帶塘身太直以致溜水往來搜刷如故春汛又多坍損亦應照東塘之例於老鹽倉戴家石橋楊家莊三處添築草盤頭大壩三座抵禦黴夏秋汛所有前題草塘內請建大工石塘之處目今貼岸雖有漸漲微沙聚散無定皆係必不可巳之工但一時難以並興不得不暫為寬期陸續帶辦其東塘自普濟菴至尖山塘身共二千二百餘丈原係逺年碎石疊砌塘外坦水僅止一層從前尚有漲沙擁護得以無恙今嵗春初潮汛所至直掃塘身報坍數段目今東南二處㑹合倒捲潮頭雖息中沙漸徙惟有東潮往來誠恐將來伏秋大汛又有衝激頓成險工通塘逼近海邉一時難以搶救現在裏塘酌量簽釘樁朩幫闊塘面五六尺窄處幫闊一丈塘外坦水逐段修砌完備其塘身石塊有鬆浮殘缺并現在坍卸者亦加拆築堅固以防秋汛此外有本年春汛東西兩塘陸續坍卸矬裂各塘身及潑動坦水樁石刻不容緩現在一面飭修一面催造估冊及西塘添築盤頭大草壩普濟菴以東修築塘身西新倉加築土堤草壩并上年秋汛續坍議改條石塘坦又前題草塘內石工各項工程確切估冊另咨送部其去嵗秋汛搶修并東塘先後建築大盤頭草壩又上年秋汛本年春汛兩次趕築續坍無腳草塘及西草塘等工俱巳完竣當同本年正月內咨送原估續估以及秋汛增添各工料另於題修嵗修搶護各案內分别報銷又海塘所設專官止海防同知一員即使往來奔走而百里之遙東坍西卸晝夜靡寧難以兼顧且做工之際人夫俱從鄉民雇覔來則一時烏合去則四散歸農或值民間蠶農兩忙或值昏暮風潮猝至雇募不前耽延時日均足貽誤緊工若多設别員勢必另籌經費即外屬遙制亦恐呼應不靈請將杭州捕盜同知管糧通判二員𣲖令分管東西兩塘平時輪流赴工稽查夏秋之時親駐工所督率仍帶辦本等事務再設千把總二員兵二百名分于東西兩塘常川做工則寒暑晝夜可以不致暫離於海塘實有裨益或亦善後之一策也督臣李衛續修海寧等四縣塘工疏雍正九年浙省濵海各邑海寧潮水橫過患在搜刷沙土根腳空虛海鹽潮來對衝患在因風助勢撼擊難禦所以兩縣塘堤時有東修西塌之虞而錢塘大江直接海寧潮頭阻遏江水逆回衝突堤岸亦與别處不同若非逐年隨時相度修補保護稍有因循即成巨工今詳細履勘見海寧縣鎮海塔前等處塘身低狹俱應幫闊增髙又念里亭等處潮勢甚猛往回汕刷塘腳必須加築坦水以護塘身又普濟菴等處有應修塘坦其海鹽縣南首三澗寨一帶為石塘盡頭當海中韭黃門潮汐對衝最稱險汛雍正四年捐築矮石塘一百丈稍為抵禦今大塘腳下沙土被潮洗刷一空樁朩露出竟成􅌑瓏之象危險異常惟有仍照原基接建四十丈方可保此一方民田廬舍又捐築之矯石塘及附石土塘底而窄狹必須因地加濶其北首天字號塘盡頭處海潮直逼土塘每遇東北風髙波浪洶涌土塘潰決可慮急應酌量頂次衝險加築石工此外閏餘二號夏汛裂縫石塘井劉王廟起朱公寨止及珠稱等號低狹坍壞土塘俱應搶修培護又平湖縣獨山東西石土各塘上年毛竹寨等處巳經衝坍三百五千餘丈隨飭搶修幸不蔓延今各塘低陷窄狹之處若不早為培修必致又費大工勘明情形不敢因循貽悮隨查寧邑海塘寧西草塘盤頭矬坍塘身一千三十一丈八尺備料儧修外其餘鎮海塔前等處幫闊培髙塘身共一千四十三丈又念里亭草盤頭等處一百五十五丈應加築大條石坦水一層并舊塊石坦水三十五丈應築大條石坦水二層東塘七里廟等處五百餘丈議將中條石築塘身大條石築坦水內有頂險之處塘身亦用大條石砌築又普濟菴迤東梁家地等處塘身二百二十餘丈并西塘唐子千門前五丈仍用塊石修築海鹽縣南首三澗寨改築舊石塘八十丈矮石塘一百丈接建新石塘四十丈北首天字號塘盡頭一帶建築石塘共一千三百六十五丈并小陡門一座搶修閏餘二號舊石塘一十一丈又三澗寨塘盡頭各附石土塘共四百五十丈搶修珠稱珍李等號附石土塘四百一十八丈加髙幫闊劉王廟等處老塘一千三十丈平湖縣獨山東西折修石塘九十丈一尺加髙幫濶培厚土塘共一千二百九十一丈八尺并乍浦城西石街等處加髙土塘一千一百四十丈及錢塘縣徐村梵村等處修築坍裂江塘三百五十三丈六尺均屬勘明確核應修應築工程除飭取工料細冊送部一面動項給發工員速行辦料乘此冬令潮小之候預為興工儧辦統於完竣日同上年嵗修巳完鹽邑之洪荒等字號報坍附石土塘九百一十五丈平邑之茅竹寨黃姑坊沖坍土塘三百五十餘丈等各工一併分别造冊請銷海塘録卷十三
