莫呉兒幾白頭被髪祗誇迎駭浪側身寧解障奔流江吹碧瓦人聲曉雲閃朱旗海氣秋後夜月明天在水有誰能此試登樓題觀海圖元黄溍昔年解䌫岑江上初日團團水底紅鼉吼忽摇千尺浪鷁飛仍挾半帆風遥看島嶼如星散祗謂神仙有路通及此棲身萬人海舊逰却在畫圖中和顧仁甫觀潮元朱徳潤候潮翻雪響瀧瀧砥柱中流勢激撞豈有明璫遺洛浦欲投圓璧誓長江雲濤雜㳫蜃樓起海嶠微茫雁字雙莫訝伍胥遺恨在越山南去未成降客杭九日别栁道傳黄晋卿出飲江頭陳氏樓客雜甚元呉師道黄菊開時酒價廉晚聲沙市簇青帘不堪衣袂猶為客偶上樓頭試巻簾良友相逢還易别老兵對飲且無嫌西風放棹龍山去何必䟱狂脱㡌簷錢塘懐古率堵無傲同賦元楊維楨天山乳鳯飛來小南渡衣冠又六朝刼火自焚楊璉塔箭鋒猶抵伍胥潮燐光夜附山精出龍氣秋隨海霧消惟有宫人斜畔月多情還自照吹簫發舟錢塘元李孝光五年羈客留荆楚今日江頭把繡衣鴻雁夜飛天氣白蛟龍畫蟄水妖微彈冠終坐王陽起敝褐何年季子歸一舸南逰真勝事幽期未與故人違次韻段推官觀潮元張雨雲濤捲入白螺杯雲夢吞將灔澦堆陳馬直從天漢落颶風先自海門來青山一向開銀壁黄繖中央立露臺好在畫圖留壯觀江頭白首不堪回錢塘潮元馬祖常石橋西畔竹棚斜閒日浮舟閲歳華金鑿懸崖開佛國玉分飛瀑過人家風枝鸛下春鳴垤雨樹猿啼暝蹋花欲賃茭田來此住東南更望赤城霞渡錢塘江元周棐日出長江煙霧開越山呉樹抱江迴霸圖縱跡空今古天塹東南有刼灰山郭雨昏雲似墨海門潮急浪如雷舟師省柁須看客不數瞿塘灔澦堆錢塘觀潮元仇遠一痕初見海門生頃刻長驅作怒聲萬馬突圍天鼓碎六鼇翻背雪山傾遠朝魏闕心猶在直上嚴灘勢始平寄語呉兒休踏浪天吴象罔正縱横已夘冬書江頭段家樓元何景福問酒江頭解黒貂朔風吹靣冷蕭蕭雲黏海樹天浮雨土屑鹽花水不潮錢氏箭埋金鏃壯張侯祠鎮石塘遥吟邊多少興亡事猛拍闌干恨未消登子胥廟因觀錢塘江潮元方行呉越中分兩岸開怒濤千古響奔雷子胥不作忠臣死勾踐終非霸主才歳月消磨人自老江山壯麗我重來鴟夷鉄箭俱安在目斷洪波萬里回東海朝暾元凌雲翰紺霧彤霞爛不收海門東望浪花浮超騰渤澥三千里照耀閻浮四百州𤾉谷飛烏看翕赩高岡鳴鳯自優㳺近來誰作賓王句試與重吟鷲嶺樓八月望日登樓觀潮元錢惟善白馬濤頭駕素車至今猶是詫靈胥千年元氣淋漓後八月長風震盪初顧兎盈虚端不爽神龍變化竟如何須臾落日明江練東逝滔滔泄尾閭錢塘懷古次高則誠韻元張天英錢塘潮上海門深千古靈胥恨未平北斗文星常黯黯内園宫樹尚隂隂承華殿冷西人語太乙壇空上帝臨月黒鄂王祠下路風吹青火出山林呉山觀濤次劉本中韻元釋守仁誰扶砥柱障狂瀾謾向江亭酹酒看風力拔山鼉鼓振雨聲摇海蜃樓寒尋常鷗鳥知何在多少龍魚不自安獨愛劉义詞賦好伍王祠下更凭欄觀潮次貝廷琚韻元張昱世代銷沈在此聲幾回東下復西傾翻騰日月迷朝夕簸蕩魚龍定死生銜石毎憐精衛小投膠未見濁河清眼前波浪猶如此莫説蓬萊頂上行晚泊海寧州明劉基春霧今朝氣稍清空江一舸客心驚東流濁浪衝山動西望長庚似月明不有龔黄為郡縣空教耒耜化戈兵普天何處非王土無地安身懷此生送李使君鎮海寧明高啓海風千里巻雙旌按轡初聞属部清民雜島夷爭午市潮隨山雨入秋城鳴狐不近睢陽廟突騎猶屯廣利營肯掃帳中容我醉夜深燃燭卧談兵舟過錢塘有感明陳汝言錢塘江上水悠悠落日扁舟送客愁雲氣欲含千嶂雨潮聲遠帶大江流征帆且復停洲渚晚飯應須上柁樓見説西湖載歌舞春風不似舊時逰送王景方歸杭州明顧潤闔閭城外送歸航流水何如客思長已遣停杯傾别酒還教攜手上河梁白蘋漁浦迷秋色紅樹官亭帶夕陽最是不堪凝望處青山無數隔錢塘浙江亭觀潮明貝瓊山推岸坼晝暝暝勍地西風帶蜃腥滄海倒流吞日月青天中立走雷霆欲招白馬今無跡莫信神魚尚有靈一氣虚空自升降乾坤與我亦浮萍望海明俞安期積氣茫茫九水都望來空濶盡東隅雲霞午夜浮光動雷雨中流片影孤日有靈烏棲析木時無㳺馬繫秦蒲島夷向識滄波道烽燧防春亦遠圖同汪魯二將軍登寶山看海明錢允治地軸東虧接混茫空明何處是扶桑青山一㸃孤城黒碧月半輪殘照黄橫海樓船天漠漠隔沙烟樹水蒼蒼野夫却喜狼烽息醉飲將軍寶纛旁錢塘懷古明徐繼思胥邱西郭水連天慶忌孤墳落照偏夜夜海潮飛白馬年年江月度烏鳶越王臺榭愁荒草呉苑笙歌泣斷烟七十二峯零亂後只今依舊采蓮船晚渡錢塘明陳子龍呉山越岫隔中流簫鼓平明青翰舟萬里晴江開曉郭千帆春草送芳洲桃花欲落潮先至鶯語初聞露未收何事西陵常問渡不堪獨上望京樓錢塘東望有感明陳子龍清溪東下大江迴立馬層厓極望哀曉日四明霞氣重春潮三浙浪花開禹陵風雨思王㑹越國山川出霸才依舊謝公攜屐處紅泉碧樹待人來觀潮明李宗表江上秋風八月潮浪花吹雪過山椒雄吞越儌聲喧襍高蹴呉天影動摇鉄箭事聞今尚在鴟夷魂逺有誰招滔滔無限朝宗意夜久魚龍漫寂寥浙江秋濤明高得𤾉秋滿湖天八月中潮頭萬丈駕西風雲驅蛟蜃雷霆鬭水激鵾鵬渤澥空自古江山誇壯麗至今父老説英雄諸溪近海徒相應氣勢安能與此同浙江秋濤明無名氏怒挾西風勢未休滔滔何處覔安流青山隔岸分呉越白浪排空過斗牛鐡箭有靈來昨日素車遺恨已千秋晚來試倚樟亭立楓葉蘆花一望愁錢塘明栁雲霄天隨望落低低鳥海欲潮生細細風裘戀客邉春夜冷夢依天末翠微空雲深碧樹渾經濕日落清江半染紅愁倚西樓芳草合呉山越水暮烟中望潮明孫一元獨倚危岑岸接䍦晚潮初上練痕齊亂撾鼉鼓妖蛟舞倒捲銀山海日低弓弩千年人去後帆檣萬里望中迷憑誰喚起眉山老為誦錢王廟裏題錢塘夜泊明王穉登孤舟三日雨淙淙夜泊錢家舊建邦桑過石門青拂枕水經檇李黛含窻六橋花盡休攜酒五月潮平好渡江此去報恩慚烈士匣中龍劍氣難降國朝錢塘觀潮沈謙開襟遙睇大江皋八月秋風正怒號蜃氣南生漁浦暗潮聲西上釣臺高猶憐古塹沈飛弩誰向寒沙洒濁膠浪泊迢迢銅柱起烟塵此日愧吾曹夜泊錢塘周茂源津亭極望海門遙水國輕寒夜泬㵳隔岸青山神禹廟中流白浪伍胥潮春星萬㸃連漁火宿雨兼旬變栁條咫只桐江圖畫裏牽舟無奈石尤驕江潮丁文煥羅刹江頭八月潮吞山挾海勢雄豪六鼇倒捲銀河濶萬里横奔雪嶂高自是乾坤通氣脈無非神物作波濤呉兒弄險須臾事坐看平流濟萬艘呉山望浙江朱彛尊一峯高出萬松寒磴道虚疑十八盤近海魚龍吹宿霧中天日月轉浮瀾風帆岸壓明珠舶仙樹花濃白石壇舊是錦衣行樂地江山真作霸圖看自漁浦挂席至富陽同初白聨句朱彛尊艑郎唱櫓雨初消查慎行突起東風送客舠百里晴山低似屋彛尊一江新水健於潮得攜老伴無拘束慎行縱是貪㳺未寂寥况有月波春罋在彜尊隔船不乏酒人招慎行江山小舡急浪衝彜尊疾若鷙鳥凌霜寒慎行灣環忽轉赤亭岸彛尊俄頃不見南高峯慎行鰣魚出網白尾尾彛尊烏栖夾路青茸茸慎行井西道人畫不得彛尊暖翠浮嵐如此濃慎行雪後從西興晚渡錢塘江查慎行牛車沒轂水何渾暗長春潮二尺痕萬竈鋪煙沈海戌兩山銜雪束江亹船開渡口愁將晚月到圓時過上元莫負承平好風景河塘燈火閙黄昏宋時沙河塘燈火最盛東坡詩繁星閙河塘海塘告成次中丞屠艾山原韻查嗣瑮重將斥鹵作陂田敷土神工豈偶然黒水無波疑縮地黄星不騁竟回天明經特借經臣力砥柱應資柱石賢可但海隅歌袵席百年四郡慶安全傳將佳句叶州閭涸轍何須顧鮒魚賦就馬銜先避地圖成海若巳潛驅迴潮不用三千弩灑浚虚傳十二渠永與東南紀成績朝宗絡繹走舟車日月浮天互吐吞紛紛鮫鰐起㳺魂心慚負石功難補目駭囊沙蹟尚存永為坤輿窮沃汜重教元化返胚渾夕雲宿霧俱收斂龕赭依然舊海亹手障狂瀾直欲東嵬然碕岸與天通憑將當代濟川楫幻作虚空駕海虹澤國千年成息土晴天萬里見仙篷漉沙増灶人無恙笑指平成百世功春江毛竒齡湛湛春江覆緑波夕陽江上奈愁何人家菰菜新晴少浦口楊花薄暮多野霧行舟迷遠渡晚寒歸鳥聚高柯到來三載隨漁父不道還為澤畔歌登呉山蘭若同張孝亷毛竒齡岧嶤紺闕快同登直上呉山第一層柑杪寒濤翻北郭帆來古渡是西陵中天化雨迷香象落日秋風對季鷹我欲遠尋蓬島去何年東望海雲蒸西陵渡即事毛竒齡望京門外舊樟亭驛路臨江蔽遠坰風轉一帆沙嶼白天低兩岸海潮青通闗賈舳摇旌斾下瀨軍書綴羽翎叢笛幾行相望隔有人垂釣在滄溟錢塘西路固陵舠十里平沙官渡遙鎮海舊樓飛紫教兵新堞散紅椒希軻曰越絶書有敕兵城今又名教兵有新壘平原兎暖看馳獵曲港鰍高欲上潮白馬素車長在望哀魂千載竟誰招登江上樓王錫書劍頻年事遠逰聊扶殘醉上危樓飄零季子裘空敝慷慨班生筆未收日色遙含千樹晚濤聲近薄一江秋此身去就渾無定毎向登臨動旅愁西陵返棹劉正誼高低市火映寒流入夜西陵獨放舟復見芳烟迷客路曽聽疎雨卧僧樓水連樹碧砧聲寂霜染林紅鳥夢幽明月河梁回望處隔江雲物尚勾留輕風簇浪細如花百里清江夜色賖心惜峰巒偏易别身躭鷗鷺喜還家山鐘野寺參差吼譙鼓嚴城歴亂撾認得村西賣酒店紅闌杆曲小旗义秋渡錢塘陸舜越絶山川半似呉錢塘東渡片帆孤滿空雲物弄秋色兩岸江城入畫圖水落萬峯看樹小風高九月聽潮無追思呉越當年事故壘西邊呌鴣八月十八日觀潮厲鶚西風吹客出重城乘興聊為江上行買酒旗亭望山逺焚香野廟拜潮生喧呼兒女秋誇雪浩蕩龜魚晚弄晴欲學盧郎無賦筆老夫胷次尚崢嶸海塘錄巻二十四
