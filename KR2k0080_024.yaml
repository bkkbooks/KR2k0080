body:
  text: 海塘録巻二十四内閣中書翟均廉撰藝文七五言律詩與顔錢塘登樟樓一作樟亭望潮作唐孟浩然百里聞雷震鳴弦暫輟彈府中連騎出江上待潮觀照日秋雲迥浮天渤澥寛驚濤來似雪一望凜生寒與白明府逰江唐孟浩然故人來自遠邑宰復初臨執手恨為别同舟無異心沿洄洲渚趣演漾弦歌音誰識躬耕者年年梁甫吟秋登張明府海亭唐孟浩然海亭秋日望委曲見江山染翰聊題壁傾壺一解顔歌逢彭澤令歸賞故園間予亦將琹史棲遲共取閒送金昌宗歸錢塘唐劉長卿新家浙江上獨泛落潮歸秋水照華髪凉風生褐衣柴門嘶馬少藜杖拜人稀惟有陶潛栁蕭條對掩扉酬張夏别後道中見寄唐劉長卿離羣方歳晏謫宦在天涯暮雪同行少寒潮欲上遲海鷗知更傲沙鶴見人衰只畏生秋草西歸亦未期賦得海邊樹唐皇甫冉歴歴縁荒岸溟溟入遠天每同沙草發長共水雲連摇落潮風早離披海雨偏故傷遊子意多在客舟前酬王侍御西陵渡見寄唐嚴維前年萬里别昨日一封書郢曲西陵渡秦官使者車栁塘薫晝日花水溢春渠若不嫌雞黍先令掃敝廬富陽南樓望浙江風起唐張南史南樓渚風起樹杪見滄波稍覺征帆上蕭蕭暮雨多沙洲殊未極雲水更相和欲問任公子垂綸意若何江城夜泊寄所思唐權徳輿客程殊未極艤櫂泊廻塘水宿知寒早愁眠覺夜長遠鐘和暗杵曙月照晴霜此夕相思意摇摇不暫忘經杭州唐顧非熊郡郭遶江濆人家近白雲晚濤臨檻看夜艣隔城聞浦轉山初盡虹斜雨未分有誰知我意心緒逐鷗羣送杭州姚員外唐顧非熊浙江江上郡楊栁到時春塹起背城雁㠶分向海人嶠雲侵寺吐汀月隔樓新靜裏更何事還應詠白蘋晚秋江上作唐張祐萬里窮秋客蕭條對落暉煙霞山鳥散風雨廟神歸地遠蛩聲切天長雁影稀那堪正枮杵幽思想寒衣江城晚眺唐張祜重檻構雲端江城四鬱盤河流出郭靜山色對樓寒浪草侵天白霜林映日丹悠然此江思樹杪幾檣竿看潮唐朱慶餘不知來遠近但見白峩峩風雨驅寒玉魚龍迸上波聲長勢未盡曉去夕還過要路横天塹其如造化何送姚合郎中任杭州唐許渾水陸中分程看花一月行㑹稽山隔浪天竺樹連城候吏齎魚印迎船載斾旌渡江春始半列嶼草初生送姚杭州唐賈島白雲峰下城日夕白雲生人老江波釣田侵海樹耕吳山鐘入越蓮葉吹摇旌詩異石門思濤來向越迎送顧陶校書歸錢塘唐儲嗣宗清苦月偏知南歸瘦馬遲槖輕縁換酒髪白為唫詩水色西陵渡松聲伍相祠聖朝思直諫不是掛冠時發浙江唐喻坦之島嶼遍含烟烟中濟大川山城猶轉漏沙浦已摇船海曙霞浮日江遥水合天此時空濶思翻想渉窮邊渡浙江唐陳適越一輕艘凌兢截鷺濤曙光金海近晴雪玉峰高靜冦思投筆傷時欲釣鼇壯心殊未展登涉漫勞勞秋過錢塘江唐僧貫休巨浸東隅極山吞大野平因知呉相恨不盡海濤聲黒氣騰蛟窟秋雲入戰城逰人千萬里過此白髭生秋日錢塘作唐僧齊已秋光臨水國逰子倚長亭海浸全呉白山澄百越青英雄貴黎庶封土絶精靈勾踐魂如在應懸戰血腥浙江晚渡唐僧齊己去年曽到此久立滯前程岐路時難處風濤晚未平汀蟬含老韻岸荻簇枯聲莫泥闗河險多逰自遠行酬皇甫冉西陵渡見寄唐釋靈一西陵潮信滿島嶼入中流越客依風水相思南渡頭寒光生極浦暮雨映滄洲何事揚帆去空驚江上鷗江樓晴望宋魯交江干一雨收霽色染新愁遠水碧千里夕陽紅半樓笛寒漁浦晚山翠海門秋更待牛津月袁宏欲泛舟錢塘江上宋楊蟠一氣連江色寥寥萬古清客心兼浪湧時事與潮生路轉青山出沙空白鳥行幾年滄海夢唫罷獨含情三月晦城門晚景宋張九成雨漲春江浪沄沄日夜奔羣山落雲裏萬壑吼巖根沙際人呼渡烟中牧入村蕭然何處士終日揜柴門三月二十四日出城宋張九成數日雨不止今晨晴已還江頭看濁浪窻外見青山白鷺投前浦輕舟漾遠灘罇中有餘酒一酌注頽顔浙江十六夜對月宋鄭克已急槳寒天濶長江得月遲最憐新缺後全勝未圓時夜雪潮千丈秋風桂一枝潛蛟易翻動怨笛莫驚吹江上宋王庭珪倚杖江風起呼船水靣開人從洲觜渡帆破浪頭來月色共千里天恩徧九垓當年送客處待看客車回登浙江樓宋趙輿滂兩岸共明月闌干霄漢間風波浙江水砥柱海門山晝夜潮消長利名人徃還不如沙上鷺玉立一身閒錢塘江宋朱繼芳極浦無高樹滄茫只遠空潮來江水黒日出海門紅兩岸東西浙千帆來去風中原山色外殘夢逐歸鴻渡錢塘宋高九萬山立晴江上潮生落照邊晚花低映水春草暗迷烟燕子飛官驛鷗羣引客船闗情南浦别相對獨依然秋日錢塘紀事元方瀾呉越南去遠萬峰青照杭江流拍岸濶海氣入城涼落日菰蒲暗行人禾黍香天開地闢後知歴幾興亡觀潮元張志道山從天目下潮到富陽回此地扁舟去吾生幾度來林紅晚日落江白曉雲開明日須停棹呼兒看釣臺鎮海亭元仇遠海塘三十里此屋獨巍然有浪方知水無雲總是天苔痕封户柱㠶影下樓船閒憶童男女悠悠去幾年浙江曉渡元金涓片帆風力飽涼氣碧颼颼江濶欲沉雁天空惟見秋漁歌聞四起人影在中流隔望秦峰出東南第一洲早發錢塘元趙志皋曉霧兼天白秋風一葦輕湖吞漁浦濶沙湧固陵平隔座吳山送揚帆越嶠迎蒼茫思無限天外忽鐘聲還浙夜泊江口明陳束越嶂宜春望江舠入夜乘潮移諸島出雲卷數峰層近郭翻多戀還家獨未能北堂今夕夢先已渡西陵錢塘雨泊明郭第一片迎潮雨錢塘拍岸逢煙明六和塔雲暗兩髙峰茶熟篷窻火香殘野寺鐘湖頭舊逰路濕翠想高松江村晚眺明高應冕荒村沈夕照煙樹幾人家野渡迎潮急寒山帶月斜漁歸無遠市雁下有平沙寂寂秋江晚芙蓉自落花江上别黎惟敬明卓明卿執手河橋上遥天起片雲仙帆千里發客路一江分桂嶺先秋色樟亭半夕曛家山到何日兩地惜離羣晚霽與客登浩然樓眺錢塘江明戎玠晴色開村樹危樓俯大江潮聲翻絶岸帆影落虚窻水與遥天合人同夕鳥雙茫茫百端集形影若為降同朱文寧庶常觀海明潘大復烟波杳無極縱目喜同君雲外千峯出潮平各浦分競探蝴蝶窟驚起鷺鴛羣浮白宜兹地蕭蕭日就曛十五夜至江上作明胡介夜是中秋夜船隨估客船塔凌青漢迥月湧大江圓節序消行旅闗山入暮年故園猶在望獨立轉茫然初過錢塘明張宇越上曽逰地年深感寂寥山光隨浦盡海色共天遥古刹藏秋樹寒江送暮潮故人渾不見愁緒酒難消題鎮海樓明釋徳祥斯樓屢易名一上一傷情白屋多為戍青山半作城雨中春樹出風裏晚潮生亦有歸鴉早閒啼四五聲錢塘江遇雨明劉理順微雨來江上濛濛曉未收故園千里隔客夢一身浮烏桕家家樹魚榔岸岸舟觀濤無不可須上幾重樓江潮明張瀚江盡遙連海東來白浪生雪移天際色雷撼地中聲射弩功非偶浮鴟恨未平風波一過眼徒有濟川情鹽官望海明黄巖出自東門望茫茫渤澥空三山盡縹緲一氣總鴻濛潮影連雲白波光射日紅獨憐浮海客吾道豈終窮錢塘樓宴坐觀濤明鄭善夫錢王此開濟旋入宋山河潮汐秋來壯雷霆水上多尚傳江有怒翻恨海無波颯颯攢陵樹悲風日夜過國朝西陵夜渡何維楨日落潮聲遠微明兩岸燈隂雲迷北極風雨渡西陵綠水漁舟泛青山蠟屐登惠連詩句好今日更誰能江雨沈寧一望知何處茫茫咫尺愁烟深迷遠樹波細浴輕鷗孤嶼連雲濕長天接水浮明朝風日好酬酒别江頭錢塘江行雜詩周茂源塵夢空江浄天風不厭喧櫓柔輕白浪山妙領黄昏多難扁舟得當心畫角屯倦飛真一笑歸鳥遍遥村霸業消烟水潮荒萬弩風片颿殘照下孤月亂流中歸馬方嘶北征鴻日向東喜聞金革定丹壑縱衰翁客路逢霜䧏離愁入夜紛人還呉苑雪夢駐越溪雲燈火衣香見江山戍柝聞何時操作罷同釣五湖濆江上詠李炳錢塘風色好迢逓縱登臨潮怒蛟龍起峰高烏雀深青山隨客路碧水照人心莫為悲行役詩懷自不禁題宋人江泊圖李肇亨愛見江邊樹蕭疎落照前遠峰分霽色小塢共寒烟雁跡留沙渚猿聲到客船十年湖海夢今日倍依然江行龔翰江上舟偏小山隨左右看樹根棲怒石帆影壓危灘水勢天逾濶風聲人未寒可知篙櫓外今古一波瀾舟發錢塘看嚴陵一帶山水楊思聖泛泛嚴陵棹無山不水源行人聽石瀨舟子報潮痕岸斷深藏路峯廻遠認村挂檣風正利漁唱不聞喧雨發江干查慎行皛皛江光去昏昏海氣連雲沈離岸樹風漲落潮天熟路便孤客輕裝稱小船十年逰跡在重檢舊詩篇錢江晚望王錫我愛錢塘晚逰行興未闌雲帆歸浦外海月吐林端木落蟬聲苦江空雁陣寒采菱何處女唱出荻花灘觀潮王錫風激滄溟立驚濤拍翠巒朝昏存大信天地豁竒觀皦日雷頻作秋江雪早寒賈帆收欲盡千里水瀰漫錢塘觀潮王錫江皋雨初霽遥見海門開乍喜羣鷗泛俄驚萬馬來秋聲連遠樹雪片灑層臺願遣狂瀾息長懷砥柱才渡錢塘劉正誼逰子辭鄉邑晴江穏放舟布帆雙櫓健落日大江浮雲樹牽新恨波濤壯古愁回頭莫漫看呉越判中流登呉山望錢塘江宋至不淺登臨興春烟喜乍收山川總佳麗竹樹亦清幽紅寺隨風轉青尊盡日留只今吳越恨同作一江流海門望海劉廷璣極目浩無際風潮頻徃回乾坤何處盡日月此中來美玉文魮孕明珠老蚌胎太平傳盛事重譯到天台晚發江干厲鶚落日挂帆去背人飛鸛鵞風烟秋半淨江水晚來波漁浦山爭出樟亭樹忽過尋源意飄蕩一聽越鄉歌江皋夜宿張芳夜宿江皋寺天寒尚有霜林空生海日髙枕夢羲皇有恨花重發無人草獨芳不如漁父好終老在滄浪登呉山伍公臺望江張芳空翠渺無際潮聲下百川樓臺分井邑鐘磬出諸天雉堞層巒迥江雲斷岸連丁仙遺跡在相與説桑田七言律詩九日宴浙江西亭唐錢起詩人九日憐芳菊延客高齋宴浙江漁浦浪花摇素壁西陵樹色入秋窻木奴向熟懸金實桑落新開㵼玉缸四子醉時爭講習笑論黄霸舊為邦送章孝標校書歸杭州因寄白舍人唐楊巨源曽過靈隠江邊寺獨宿東樓看海門潮色銀河鋪碧落日光金柱出紅盆不妨公事資高卧無限詩情要細論若訪郡人徐孺子應須騎馬到沙邨重夸州宅旦暮景色兼酬前篇末句唐元稹仙都難畫亦難書暫合登臨不合居繞郭烟嵐新雨後滿山樓閣上燈初人聲曉動山門闢湖色宵涵萬象虚為問西州羅刹岸濤頭衝突近何如微之重夸州居其落句有西州羅刹之謔因嘲兹石聊以寄懷唐白居易君問西州城下事醉中叠紙為君書嵌空石靣標羅刹壓捺潮頭敵子胥神鬼曽鞭猶不動波濤雖打欲何如誰知太守心相似抵滯堅頑兩有餘杭州春望唐白居易望海樓明照曙霞城東名樓望海樓䕶江堤白蹋晴沙濤聲夜入伍員廟栁色春藏蘇小家紅袖織綾誇柿蔕青旗沽酒趂梨花誰開湖市西南路草緑帬腰一道斜江樓夕望招客唐白居易海天東望夕茫茫山勢川形濶復長燈火萬家城四畔星河一道水中央風吹古木晴天雨月照平沙夏夜霜能就江樓銷暑否比君茒舍較清涼江樓晚眺景物鮮竒吟翫成篇寄水部張員外唐白居易澹烟疎雨間斜陽江色澄鮮海氣涼蜃散雲收破樓閣虹殘水照斷橋梁風翻白浪花千片雁㸃青天字一行好著丹青圖畫取題詩寄與水曹郎元微之除浙東觀察使喜得杭越鄰州先贈長句唐白居易稽山鏡水歡逰地犀帶金章榮貴身官職比君雖校小封疆與我且為鄰郡樓對翫千峯月江界平分兩岸春杭越風光詩酒主相看更合與何人欲到西陵寄王行周唐李紳西陵沙岸回流急西陵渡在蕭山縣西二十里錢王以陵非吉語改