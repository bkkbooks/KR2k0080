body:
  text: 海塘錄地理𩔖四河渠之屬提要臣等謹案海塘錄二十六巻國朝翟均亷撰均亷有周易章句証異已著錄浙江海塘在海寧縣南漢唐以來遞有修築至國朝軫念民依講求尤備聖祖仁皇帝暨我皇上均親臨相度用建萬年保障之基是編綜括形勢統叙源流恭錄詔諭聖製冠於巻首次為圖説一巻疆域一巻建築四巻名勝三巻古蹟二巻祠祀二巻奏議五巻藝文八巻雜志一巻徴引各史紀志及玉海乾道咸淳臨安志四朝聞見錄明各朝實錄諸書考訂徴引頗為該洽如訂正鹽官海塘長百二十四里唐開元時所築舊志作二百二十四里者誤引泊宅編載宋制有鐵符鎮海皆史傳所未載他如海寧之隄築於沈讓諸又志乗所未備考浙江通志雖有海塘事宜一門然僅止雍正十一年而止是編詳叙至乾隆二十九年凡聖謨指示睿慮周詳以及臣工奏議皆謹為詮叙尤足以昭示後來其中如建築門叙述宋制而不及引咸淳臨安志所載林大鼐之議明安然之築石隄明實録載於洪武十年而書中誤作十一年間有脱畧然不足累其全書也乾隆四十六年九月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀欽定四庫全書海塘錄巻首一詔諭聖祖仁皇帝康熙四十六年十二月十四日工部奉上諭朕宵旰勤民視如赤子無一時一事不思為閭閻圖經久之計江南浙江生齒殷繁地不加增而仰食者日衆其風土陰時燥濕及種植所宜逈與西北有異朕屢經巡省察之甚悉大抵民恃田畝為生田資灌溉為急雖東南名稱水鄉而水溢易泄旱熯難支夏秋之間經旬不雨則土坼而苗傷矣濱河低田猶可戽水濟用高仰之地力無所施往往三農坐困朕兹為民生再三籌畫非修治水利建立閘座使蓄水以灌輸田疇無以為農事緩急之備江南省蘇州松江常州鎮江浙江省杭州嘉興湖州各府屬州縣或近太湖或通潮汐宜於所有河渠水口度地建閘隨時啟閉水有餘則宣洩之水不足則瀦蓄以備用其有支河港蕩淤淺者宜并加疏濬使引水四達仍行建閘多蓄一二尺之水即田高一二尺者資以灌溉矣多蓄四五尺之水即田高四五尺者資以灌溉矣行之永久可俾高下田畝無憂旱潦此于運河無涉而于民生實大有裨益今漕運總督與江浙督撫方料理截漕散賑爾部速移文該督撫等令將各州縣河渠應建閘蓄水之處並應建若干座通行確察明晰具奏爾部即遵諭行特諭世宗憲皇帝雍正元年九月十七日王大臣等欽奉上諭錢鏐時所築塘隄中間雖被沖壞至今尚有存者數年來督撫等所修塘隄俱虛冒錢糧於不當修築處修築以致隨修隨瓌又聞得赭山有三處海口今一處淤沙壅塞水不通流若濬治疏通使潮汐不致留沙壅塞則海寧一帶塘工方可保固有言之者雖未必稔知不可不留意抑或地方大臣恐糜費錢糧將此等處雖明知而不顧也爾等傳諭該督撫知之欽此雍正二年八月十四日欽奉上諭朕思天地之間惟此五行之理人得之以生全物得之以長養而主宰五行者不外夫陰陽陰陽者即鬼神之謂也孔子言鬼神之徳體物而不可遺豈神道設敎哉葢以鬼神之事即天地之理故不可以偶忽也凡小而邱陵大而川嶽莫不有神焉主之故皆當敬信而尊事況海為四瀆之歸宿乎使以為不足敬則堯舜之君何以柴望秩于山川文武之君何以懷柔百神及河喬嶽今愚民昧於此理往往信淫祀而不信神明傲慢䙝瀆致干天譴夫善人多而不善人少則天降之福即稍有不善者亦䝉其庇不善人多而善人少則天降之罰雖善者亦被其殃近者江南報上海崇明諸處海水泛溢浙江又報海寜海鹽平湖㑹稽等處海水沖決隄防致傷田禾朕痛切民隱憂心孔殷水患雖闗乎天數或亦由近海居民平日享安瀾之福絶不念神明庇䕶之力傲慢䙝瀆者有之夫敬神固理所當然而趨福避禍之道即在乎此能敬則謂之順天不敬則謂之褻天䙝天之人顧可望綏寧之福乎詩曰敬天之怒無敢戲豫又曰畏天之威于時保之朕固當朝乾夕惕不遑寜處以敬承天意亦願爾百姓共凜此言内盡其心外盡其禮敬神如神在實以至誠昭事而不徒尚乎虛文人意即神意一念之感格自足以致休祥豈獨一鄉一家之被其澤哉爾百姓果能人人心存敬畏必獲永慶安瀾著該督撫將此諭㫖令地方官家諭戸曉俾沿海居民一體知悉特諭雍正二年八月二十四日户部欽奉上諭前因江浙督撫等摺奏七月十八十九等日驟雨大風海潮泛溢衝決隄岸沿海州縣近海村莊居民田廬多被漂沒朕即密諭速行具本奏聞賑恤但思被災小民望賑孔迫若待奏請方行賑恤恐時日耽延災民不能即沾實恵朕心深為憫惻著該督撫委遣大員踏勘被災小民即動倉庫錢糧速行賑濟務使災黎不致失所其應免錢糧田畝即詳細察明請蠲凡海潮未至之村莊不得混行濫冒至於𦂳要隄岸衝決之處務須速行修築無使鹹水流入田畝朕念切痌瘝務令早沾實恵該地方官各宜實心奉行加意撫綏俾凋瘵得蘇生全速遂以副朕勤恤民隱至意爾部即行文各該督撫遵奉速行特諭雍正二年九月二十一日欽奉上諭今歲七月中􅄓風海潮泛溢江南浙江沿海州縣衛所隄岸多被衝塌居民田廬漂沒朕軫念深切已降諭㫖令江浙地方官亟行賑濟撫綏毋使災黎失所今被衝海塘若不及時修築恐鹹水灌入内河有礙耕種爾督撫等著即查明各處損壞塘工料估價值動正項錢糧作速興工至沿海失業居民度日艱難藉此傭役俾日得工價以資餬口是拯救窮民之法即寓其中矣將此再行飭諭務期實心遵㫖速行以副朕憂恤元元至意倘有不肖地方官扣尅工銀及怠緩不力者該督撫嚴查即行題㕘從重治罪特諭雍正二年九月二十二日諭湖廣總督楊宗仁江西巡撫裴􅏍度今歲各省秋成大有惟浙江江南沿海地方七月十八九等日海潮泛溢近海田禾不無損壞朕軫念災黎惟恐失所業經嚴飭各省督撫發倉賑濟多方撫恤但蘇松杭嘉等府人稠地狹向來出米無多雖豐年亦仰給於湖廣江西等省今沿海被災恐將來米價騰貴小民艱食湖廣江西地居上流今歲豐收爾可速動司庫銀兩湖廣買米十萬石江西買米六萬石運交浙江巡撫平糶所糶之銀仍移還補庫其米應於何處交卸爾即咨會浙江巡撫酌議速行務於浙民有益毋得怠緩遲悞特諭雍正二年十月二十五日欽奉上諭江浙兩省沿海地方於七月十八十九兩日皆被潮水漂沒居民廬舍雖經頒㫖加意賑恤然朕憫惻之念至今尚未能釋惟有朝夕警惕以答天意但海為衆水所歸無不容納今乃狂潮泛溢水不循軌或者海洋潛藏匪𩔖亦未可定稽諸前事往往有之沿海各省督撫提鎮務須實心愛養小民整理營伍俾閭閻各安其業汛防有備無虞毋令海洋别生事端庶不負朕委任之意特諭雍正二年十二月初四日吏部尚書朱軾面奉上諭浙江沿海塘工最為𦂳要署巡撫石文焯前奏必須通用石塊修築後又奏稱不必用石全無定見誠恐貽悞塘工朕已諭令法海佟吉圖作速詳議具奏矣但恐法海等初任不諳練地方情形爾曾為浙江巡撫必知海塘緣由著馳驛前往浙江將作何修築之處會同法海佟吉圖詳查定議交與法海等修築爾即回京朕思海塘闗係民生必須一勞永逸務要工程堅固不得吝惜錢糧江南海塘亦為𦂳要爾浙江事竣即至蘇州會同何天培鄂爾泰將查勘蘇松塘工如何修築之處亦定議具奏欽此雍正三年五月十六日内閣奉上諭江南浙江海塘已差尚書朱軾會同江浙巡撫查勘估議具奏但沿海黎庶全賴堅築海塘捍禦潮汐得以保全生聚事闗民瘼朕時刻在念若塘工遲悞則海濱之人未能安居樂業所派効力人員雖經赴工惟恐遷延時日驟難告竣亦未可定著巡撫張楷法海等星速遴委幹員動支司庫錢糧立限堅築尅期報完務使永保安瀾毋得因循延緩亦不得草率塞責貽悞民生欽此雍正三年十一月署浙江巡撫傅敏因紹興府知府特晉徳於條石塘内填用亂石飭令改築據實題奏奉㫖據奏紹興府海塘工程原議皆用條石後以條石不易購致限期已迫遂用條石托外亂石填中今恐日後坍塌仍改用條石請寛限期等語海塘工程闗係民生最為𦂳要必須一勞永逸若因條石一時難以購致從前便當聲明縁由奏請展限何得草率從事和順係隆科多結納私人特晉徳曽經隆科多在朕前薦舉此必特晉徳受隆科多之囑託照看和順是以聽其茍且塞責傅敏不早行查奏亦屬徇情著交與新任巡撫李衛悉心查勘指示更改修理務期永逺堅固張楷在江南修理塘工用木樁密釘似為有益可否倣行並令李衛酌量該部知道欽此雍正七年八月二十四日欽奉上諭朕惟古聖人之制祭祀也凡山川嶽瀆之神有功徳於生民能為之禦災捍患者皆載在祀典蓋所以薦歆昭格崇徳報功而并以動斯人敬畏祗肅之心使之毋敢慢易而為非也雍正二年浙江海塘潮水沖決朕特發帑金命大臣察勘修築并念居民平日不知敬畏明神多有褻慢切諭以䖍誠修省之道令地方官家喻戸曉警覺衆庶比年以來塘工完整災沴不作居民安業蓋巳黙叨神祐矣今年潮汛盛長幾至泛溢官民震恐幸而水勢漸退隄防無恙此皆神明黙垂䕶佑恵我烝民者也兹特發内帑十萬兩於海寜縣地方勅建海神之廟以崇報享著該督遴委賢員度地鳩工敬謹修建務期制度恢宏規模壯麗崇奉祀事用答明神庇民禦患之休烈且令逺近人民奔走瞻仰興起感動庶莫不盡消其慢易之私而益振其恪恭之志相與服教畏神遷善改過永荷休祥則於國家事神治人之道均有賴焉其應行事宜著該督等詳悉定議具奏特諭雍正十一年正月大學士鄂爾泰等遵㫖議奏請欽簡大臣前往詳細查勘再行定議奉㫖依議著内大臣海望總督李衛馳驛前往浙江㑹同總督程元章將海塘工程通盤相度形勢籌畫事宜應作何修築以垂久逺之處詳細查勘悉心定議具奏其修築工程著大理寺卿汪漋原任内閣學士張坦麟前往承辦仍照舊令程元章總統料理張坦麟即於本籍前往直隸總督印務著署刑部尚書唐執玉暫行署理營田觀察使顧琮協辦欽此雍正十一年正月内大臣海望總督李衛等陛辭赴浙查勘海塘面奉諭㫖爾等到浙詳細踏勘如果工程永固可保民生即帑金千萬不必惜費欽此雍正十一年三月内大臣海望等奏請於尖塔兩山之間建立石壩以堵水勢又請漸次改建大石塘等因四月初一日欽奉㫖此所議俱屬妥協著交部照所奏行朕思尖塔兩山之間建立石壩以堵水勢似𩔖挑水壩之意所見固是若再於中小亹開挖引河一道分江流入海以減水勢似更有益從前雖經開挖旋復壅塞者皆因惜費省工之故今若倍加工力開挖兩工並舉更覺妥備石壩建後即有漲沙而石塘亦當漸次改建以為永久之利其開挖引河之處著程元章會同汪漋張坦麟等相度地勢酌量辦理該部知道欽此雍正十一年十二月二十三日欽奉上諭朕因浙省海塘闗係𦂳要是以特命大臣前往會同該督等相度形勢定議興修又恐在工人員或怠緩稽遲不能即時建築特令將軍阿里衮副都統隆昇會同該督等督催辦理近聞堵塞尖山開挖引河己經該督等查勘數次尚欲再勘再商但以行文閩省調取善水之人試探為辭議論紛紜終無定議全不思海水潮汐有時若遲至潮水長盛之時如何施工且採辦石料又互相推諉舍近求逺致稽時日該督等既不努力辦工而阿里衮隆昇亦俱袖手旁觀不上𦂳催辦若各工内實有難以施工應奏聞請㫖之事亦應及早奏明何得半年以來尚無頭緒著傳諭程元章阿里衮隆昇張坦麟汪漋穆克登額等速將各項工程及時修築毋得仍前怠忽欽此雍正十二年二月浙江總督程元章奏稱尖塔兩山之間難以築壩中小亹難以開挖奉㫖大學士鄂爾泰會同海望閲看欽此隨經大學士鄂等議駁覆奏奉㫖依議浙省海塘闗係重大固須詳慎尤戒遲疑若總理者不肯擔承將分任者愈多瞻顧則因循草率迄無逺圖其何以謀奠安而垂永久看程元章毫無確見今將海塘一應工程著隆昇總理令偏武前往協辦所需文武官員俱聽揀調其運辦物料預備人夫及給發錢糧等項仍著程元章料理應付毋得推諉毋得稽遲欽此雍正十二年五月總理海塘副都統隆昇恭報兩河工竣奉㫖覽奏深為嘉悦但觀圖畫情形惟恐復淤向後可將暢流疏刷深廣情形不時訪問隨便奏聞欽此雍正十二年十二月二十九日欽奉上諭朕聞浙江海塘工程現在修理尖山巳堵築三分之一人心甚是踊躍但尖山夫役毎日給工銀三分六釐稍覺不足今當初春之月水淺潮平正趲築工程之候著照引河挑夫之例毎日加銀一分四釐六毫今運送多資人力毎方增銀六分俾夫役等工食寛裕努力修築早告成功以慰朕念欽此雍正十三年七月初八日欽奉上諭朕聞浙省海塘於本年六月初二日風潮偶作沖決之處甚多朕心深為軫念巳降㫖詢問緣由並令速行搶修以防秋汛至於僱幕人夫採辦物料務須公平給價聽從民便俾閭閻踊躍從事不得涉於勉强或繩以官法刑驅勢迫擾累地方致辜朕愛養民生至意欽此雍正十三年七月十一日欽奉上諭前聞浙省海塘於本年六月初二日風潮偶作衝決之處甚多朕心甚為軫念已降㫖詢問情由並令速行搶修以防秋汛今朕訪聞得今歲風潮不過風大水涌並非昔年海嘯可比且為時不久未有連日震撼衝汕情形若平日隨時補苴防䕶謹密自不致潰決如此之多總因數年來經理官員將舊日工程視同膜外並不隨時修補且將原題准其在於歲修案内報銷之工不許修築以致根脚空虛處處危險不能捍禦風浪又海防兵備道乃特設専司之員責任綦重從前隆昇程元章等請將同知成貴題補朕因其平日不曾經厯河工誠恐未必勝任且陞用太驟是以姑令署理試看今聞伊於工程並未諳練兼之患瘧經年不能辦事東塘同知張偉為人軟弱安坐海寜西塘同知李飛鯤存心狡猾日在省城奔競俱非實心任事之員而隆昇與程元章等意見又不相同汪漋張坦麟但知隨聲附和不顧國家公事前因虐使民夫尅減工料經朕降㫖申飭畧知收斂然毎石萬觔尚折減六七折不等欲符原估六萬兩之數一任宕匠包賠逃亡悞工平時人事廢弛若此何以抵禦狂瀾況朕不惜數百萬帑金冀以保全一方民生而各官懷挾私意不知為國為民宜乎上天垂象以示儆也兵備道係𦂳要之員今成貴患病溺職如此隆昇程元章汪漋張坦麟總理協辦所司何事郝玉麟既在浙江豈無見聞何以俱不題㕘著伊明白回奏兵備道員缺即著伊等在於知府中揀選題委目今秋汛正大搶修保䕶最為急務一切事宜俱交與隆昇程元章汪漋張坦麟等悉心料理倘仍蹈前轍再有疏虞致傷田廬民命必將伊等從重治罪不稍寛貸郝玉麟既不據實奏聞亦不能置身事外至於僱募人夫採辦物料務須公平給值聽從民便俾閭閻踴躍從事不得涉於勉强或繩以官法刑驅勢迫擾累地方致辜朕愛養民生之至意特諭雍正十三年七月十五日欽奉上諭浙江海塘工程原在平日隨時補苴防䕶謹密始可禦猝然之風浪乃近年以來經理官員將舊日工程以為非巳身經手者視同膜外不加修補以致今年六月初二日風大水湧遂潰決塘工如此之多此朕訪聞最確者朕為浙省海塘宵旰焦勞無時或釋且不惜多費帑金登斯民於袵席年來所降諭㫖不下數十百次矣隆昇程元章汪漋張坦麟皆朕特簡之大員委以防川之重任且訓諭諄諄望其實力奉行勉以和衷共濟豈料伊等私心蔽錮意見參差但分彼此之形全無公忠之念安有身在地方目覩隄岸空虛而不督率屬員先事預防急為修補者隆昇程元章汪漋張坦麟俱著交部嚴察議奏目今江南塘工告竣王柔著補授浙江海防兵備道速赴新任欽此雍正十三年七月十九日内閣欽奉上諭浙江海塘工程闗係民生最為𦂳要朕宵旰焦勞不惜多費帑金為億萬生靈謀久逺乂安之計所以告誡在事臣工者已至再至三矣不料經理諸臣各懷私意彼此參差以致乖戾之氣上干天和有今年六月風浪潰隄之事今雖勉力搶修尚不知能捍禦秋潮否至於建築石塘工程浩大若諸臣陋習不改仍似從前則大工何所倚賴朕再四思維大學士朱軾廉慎持躬昔曾巡撫浙江諳練塘工今雖年逾七旬精神不逮而董率指示似尚能為朕以此詢問之伊自稱情願効力著由水路乘船前往令該部給與水程勘合並令沿途撥兵䕶送伊子朱必楷著隨伊父去朱軾到浙之日稽查指授總理大綱至一切工程事務仍著隆昇程元章汪漋張坦麟等照前辦理俱聽朱軾節制若大臣中有懷私齟齬者著朱軾據實㕘奏朕必嚴加處分若文武官員有營私作弊或怠玩因循者朱軾即行糾㕘從重治罪朱軾未到之先所有應辦工程物料著隆昇程元章等上𦂳辦理毋得藉口等候欽差徘徊觀望以致稽遲欽此雍正十三年八月初八日大學士朱軾面奉上諭浙江海塘闗係民生最為𦂳要因隆昇與程元章意見不合以致遲悞工程特差爾前往督率之隆昇等聴爾節制如何修築之處爾做過浙江巡撫自必諳練但工程浩大需用錢糧㫁㫁不可吝惜舊塘先須修築完固以資捍禦切不可因塘身臨水那動尺寸那移一步即衝塌一步何時是巳至修建魚鱗大石塘乃一勞永逸之計不可因塘外沙漲停止修築縱使沙漲數十百里民人居處耕種亦不可恃必須大工完竣方可垂之久逺於地方有益其石料夫工價值照時給發若扣尅留難則利民之事反以病民如有此等情弊務嚴㕘重處毋得姑容欽此今上皇帝雍正十三年十二月初八日大學士總理海塘事務嵇曾筠敬籌海塘章程事宜奉㫖以上數條可謂措置咸宜朕實慶海疆得人從此永永寜謐安瀾底績卿功可垂諸竹帛矣欽此雍正十三年十二月二十一日總理事務王大臣欽奉上諭隆昇剛愎自用怙過不悛若仍留浙江於塘工無益著解任來京其副都統織造二缺候朕另降諭㫖程元章身為巡撫不能和衷共濟乃懷挾私心貽悞公事亦不應留於浙省著解任來京其巡撫印務即著大學士嵇曾筠兼管俾地方管轄與海塘工程併歸一手自無掣肘牽制之患張坦麟汪漋俱照司道例聽嵇曾筠節制委用隆昇所管闗税事務著嵇曾筠委員暫行管理嵇曾筠摺内所㕘驍騎校常祿巡檢黄國標蔣文暹通判葉齊俱著革職黄國標蔣文暹葉齊仍著留工効力倘怠忽貼悮著嵇曾筠即行嚴㕘治罪江南總督趙𢎞恩駐劄江寜難以兼管河務江南總河員缺著高斌補授其管理兩淮鹽政候朕另降諭㫖欽此乾隆元年三月初五日工部欽奉上諭朕聞浙江紹興府屬山陰會稽蕭山餘姚上虞五縣有沿江沿海堤岸工程向係附近里民按照田畝派費修築而地棍衙役於中包攬分肥用少報多甚為民累嗣經督臣李衛檄行府縣定議毎畝捐錢二文至五文不等合計五縣共捐錢二千九百六十餘千值銀三千餘兩民累較前減輕而胥吏等仍不免有借端苛索之事朕以愛養百姓為心欲使閭閻毫無科擾著將按畝派錢之例即行停止其堤岸工程遇有應修段落著地方大員委員確估於存公項内動支銀兩興修報部核銷永著為例特諭乾隆元年六月二十一日欽奉上諭朕聞濱海之鄉土地坍漲不常田無定址於是豪强得恣侵占而爭端日興其責在地方有司熟悉土宜按制定法弭釁於未然而平其爭於初發則可謂良吏矣夫州縣有司非盡不知愛民者特以田土情形未能稔悉不得不寄耳目於吏胥而猾吏奸胥又往往與土豪交通變亂成法予奪任意弱肉强食為厲無窮獄訟繁興端由於此至若沿海新漲之沙鄰邑互爭有司又各袒所屬益滋紛攘此皆徇私而未識大體者朕以天下為一家而州縣官各膺子民之責亦當體朕之心以為心又焉忍伸此屈彼長其奸而導之攘奪哉前此海濱要地增設大員彈壓果其秉公查看經理得宜應即令界址劃然各歸其産不當遷延歲月仍假奸民之便而使窮黎久致失業也夫奸豪不懲則無以安良善經界不正則無以杜爭端該督撫應飭所屬親民之員毋以姑息怠緩從事庶令民業各正而爭訟亦自是少息矣特諭乾隆元年九月初九日欽奉上諭今年伏秋交會之際南方雨多水勢甚大朕深為黄運海塘等處工程繫念昨據江南河道總督高斌摺奏時過白露黄運湖河各處工程在在保䕶平穏且毛城鋪北岸於六月間有天開引河一道不費人力自然化險為平人民莫不歡忭等語又據大學士嵇曾筠摺奏今年伏秋海塘水勢雖大因先期修整坦水建築土戧得以保䕶平安且江海形勢潮向南趨海寜東西兩塘日夕漲沙將來易於施工比較上年情形巳不啻逕庭之别等語又據河東總河白鍾山摺奏秋汛已過河東兩省南北兩岸一切堤壩工程均屬穏固等語南北河工與浙江海塘闗係國計民生最為𦂳要且當朕即位元年仰荷神明黙佑數處重大工程俱各循流順軌共慶安瀾朕心不勝感慶理宜䖍修祀典以答神貺所有應行禮儀該部察例具奏此三處總理之大臣督率有方在事各員殫心防䕶俱屬可嘉著分别議敘具奏欽此乾隆五年閠六月二十三日欽奉上諭據浙江巡撫盧焯奏稱海寜尖山壩工實係全塘鎖鑰臣率同兵備道相度指示自開工以來未及五閲月而全工已竣此係跨海填築不比内地工程所有承辦各員弁俱能實心實力克著勤勞謹分别等次繕摺進呈可否仰懇天恩勅部議敘至悉心贊勷稽覈錢糧工料之布政使張若震往來督工之按察使完顔偉與督催運石之鹽驛道趙侗斆係大員未敢列入等次相應聲明等語尖山壩工辦事人員俱著照盧焯所請交部議敘至盧焯董率有方張若震完顔偉趙侗斆協辦盡力著一併議敘具奏欽此乾隆十五年十月二十二日奉上諭浙閩總督喀爾吉善署理浙江巡撫永貴奏請臨幸浙江閲視海塘一摺前因江南督撫等奏請南巡特命大學士九卿會議詢謀僉同業經降㫖俞允江浙隣封接壤均係聖祖屢經臨幸之地且海塘亦重務也今既據該省士民感恩望幸羣情踴躍督撫合詞代奏宜允所請於辛未春南巡便道前至浙省臨視海塘工慰黎庶瞻依之意所至不煩供億勿興尚華靡已詳具前㫖其共喻焉欽此乾隆十五年十二月初八日奉上諭浙江海塘為捍衛民生要務朕明春巡幸浙省意欲親臨閲視著尚書舒赫徳于江南審訊事畢之日即赴浙江會同該督撫等查看預備奏聞欽此乾隆二十五年八月初九日軍機處抄出奉上諭獻歲恭逢皇太后七旬萬夀擬于新春敬奉安輿時巡南服俯􅇺士民顒祝之忱並順道閲視徐州石隄及海寜塘工因降㫖令該省地方官修整道路橋梁照例預備今歲大江以南在在豐收惟夏間雨水稍多河湖盛漲高寶興泉一帶低窪處所頗有漫溢前因河臣等先後摺奏特傳諭尹繼善查明下㳺被水之區預籌撫綏復恐地方有司承辦南巡差務轉于賑恤事宜不能盡心經理是以諭令該督將實在情形確查具奏候朕降㫖酌改巡幸今據奏到高寶等處被水較重該處既現巳成災亟宜以賑務為切要南巡一事不妨酌量改期該督身任封疆自當權其緩急早為奏請何必待朕詢及始行入告耶所有南巡應辦差務暫行停撤改于壬午春恭奉慈輦以慰輿情仍可攬民風而昭盛典大差既經停止自可專心辦理賑務該督等務宜仰體朕懷董率僚屬確按災地情形實力妥辦勿使窮黎稍有失所以副朕痌瘝在抱至意該部即遵諭行欽此乾隆二十七年三月初三日内閣奉上諭尖山塔山之間舊有石壩朕今親臨閲視見其横截海中直逼大溜猶河工之挑水大壩實海塘扼要闗鍵波濤衝激保䕶匪易但就目下形勢而論或多用竹簍加鑲或改用木櫃排砌固宜隨時經理加意防修如将來漲沙漸逺宜即改築條石壩工俾屹然成砥柱之形勢庶於北岸海塘永資保障該督撫等其善體朕意於可興工時一面奏請一面動帑儹辦併勒石塔山以誌永久欽此乾隆二十七年三月初三日内閣奉上諭朕稽典時巡念海塘為越中第一保障比歲潮勢漸趨北大亹實闗海寜錢塘諸邑利害計於老鹽倉一帶柴塘改建石工即多費帑金為民間永逺禦災捍患良所弗惜而議者率以施工難易彼此所見紛岐昨于行在先命大學士劉統勲河道總督高晉巡撫莊有恭前往工所簽試樁朩朕抵浙次日簡從臨勘則柴塘沙性澁汕一樁甫下始多扞格卒復動搖石工斷難措手若舊塘迤内數十丈許土即宜樁而地皆田廬聚落將移換石工毁拆必多思衛民而先殃民其病甚於醫瘡剜肉矣朕心不忍且併外塘棄之乎抑兩存而贅疣可乎以兹蒿目熟籌所可為吾民善後者惟有力繕柴塘得補偏救弊之䇿耳地方大吏其明體朕意悉心經理定歲修以固塘根增坦水石簍以資擁䕶庶幾盡人事而荷神庥是朕所宵旰廑懷不能刻置者至繕工欲固購料不得不周現在採辦柴薪非河工秫葦之比向為額定官價所限未免拮据應酌量議加俾民樂運售而官易集事其令行在戸部會同該督撫詳加定議以聞朕為浙省往後咨度之苦心其詳具見誌事一詩督撫等並將此㫖于工次勒石一通永志遵守毋忽欽此乾隆二十七年三月十九日奉上諭朕奉皇太后安輿莅兹南服所以省方觀民勤求治理其各處舊有行宫清蹕所駐為期不過數日但須埽除潔淨以供憩宿足矣固無取乎靡麗飾觀也而名山勝蹟尤以存其舊規為各得自然之趣從前屢降諭㫖至為明晰乃今自渡淮而南凡所經過悉多重加修建意存競勝即如浙江之龍井山水自佳何必更興土朩雖成事不說而似此踵事增華伊於何底轉非朕稽古時巡本意且河工海塘為東南民生攸繫朕廑懷宵旰時切紆籌地方大吏果加意修防永資捍禦則兹之親臨閲視其欣慰當何如者而田疇豐潤井里熙恬即所以博朕愜覽不在彼而在此也嗣後毎届巡幸之年江浙等處行宫及名勝處所均無庸再事增葺徒滋縻費即圬墁裱飾不致年久剝落亦可悉仍其舊此實不僅為愛惜物力起見也該督撫等其各善體朕諭敬相遵守欽此乾隆二十七年十月初三日奉上諭浙江海寜一帶塘工最為𦂳要今春巡幸抵杭之次日即赴老鹽倉尖山等處相度情形飭令修築柴塘並建設竹簍坦水各工以資保䕶今據莊有恭奏查勘工程俱巳陸續完竣諸工並皆穏固等語該督撫率各員儧辦蕆工甚屬盡心深可嘉予莊有恭著交部議敘所有在工勷事各員並著查明分别咨部議敘以示奬勵欽此乾隆二十八年十二月十七日奉上諭兩江總督尹繼善等合詞具奏請于乾隆乙酉再舉南巡之典以慰臣民顒望一摺朕惟江浙地廣民殷一切吏治農功均闗要計且襟江帶河濵湖邊海之區籌䕶澤國田廬無一不重縈宵旰前以壬午嵗恭奉安輿時巡周覽凡淮河水誌節空挿壩啟閉以及杭屬塘工勘建柴石料段諸事宜曾與封疆大吏目撃手畫以期利濟羣生年來叠經督撫等疏報下河郡邑汛水恬流並無漫溢惟是浙中海潮漲沙雖有起機大溜尚未趨赴中亹是深所厪念而新修柴石諸塘亦當親閲其工以便隨時指示又近日特遣大臣督修水利如睢河荆山橋等處亦為數省灌輸吃緊闗鍵所以騐前功承成效正惟其時矧東南嵗頻告豐登恭惟聖母皇太后福履康寧彌臻純嘏于是承歡行慶答士民望幸之忱稽典實為允協著照請准於乙酉之春諏吉南巡其河工海塘應親厯省視者即行先期預備至前次燈綵繁文暨扈從人員僱覔巨舟籖佔公館諸禁已屢頒諭㫖即朕所過行宫道路距上届為日匪遙祇須洒掃潔蠲足供頓憇不得稍事増華勞費副朕仰承慈諭俯順輿情之至意將此通諭各衙門知之摺併發欽此謹案均㢘原書恭載諭㫖至乾隆二十八年而止伏念我皇工眷念海壖屢勤清蹕不惜帑工特命増築石坦加鞏鱗塘並范公塘亦予一律甃石訓諭周詳尤為海塘經法謹續載乾隆三十年四十五年四十九年節奉諭㫖於左庶於海塘大備之模有所考云乾隆三十年閏二月初五日奉上諭海寧石塘工程民生攸繫深厪朕懐連年潮汛安瀾各工俱屬穏固兹入疆伊始即日就近親臨相度先行閲視遶城石塘五百三十餘丈實為全城保障而塘下坦水尤所以捍衛石塘但向來止建兩層今潮勢似覺頂衝外沙漸有汕刷二層之外應須預籌保䕶該撫等上年所奏加建三層坦水六十餘丈止就尤險要處而言於全城形勢尚未通盤籌畫若一例普築三層石坦則於䕶城保塘尤資裨益著將應建之四百六十餘丈均即一例添建其二層舊坦内有樁殘石缺者亦著查明補換該督撫等其董率所屬悉心籌辦動帑興修務期工堅料足無濫無浮以收實濟副朕為民先事預籌之至意欽此乾隆四十五年三月初三日内閣奉上諭海寜州石塘工程所以保衛沿海城郭田廬民生攸繫從前四次親臨指授機宜築塘保䕶連年潮汛安瀾各工俱為穏固今朕廵幸浙江入疆伊始即親往閱視石塘工程尚多完好惟遶海寧城之魚鱗石塘内有工二十餘丈外係條石作牆内填塊石厯年久逺為潮汐沖刷底樁霉朽兼有裂縫蹲矬之處又城東八里之將字號至陳文港密字號止有石塘工七段約共長一百五六十丈地當險要塘身單薄亦微有裂縫此塘為全城保障塘下坦水所以捍䕶塘工皆不可不預為籌辦著將兩處塘工均改建魚鱗石工一律堅穏并添建坦水以垂永久該督撫即派妥員確勘估計具奏又石塘迤上前經築有柴塘四千二百餘丈現尚完整究不如石塘之鞏固雖老鹽倉有不可下樁為石塘之處經朕親見然不可下樁處未必四千餘丈皆然朕於民瘼所繫從不惜帑省工俾資保䕶著該督撫即將該工内柴塘可以改建石塘之處一并派委誠妥大員據實逐段勘估奏聞辦理如計今嵗秋間可以辦竣即撥帑趕𦂳興修若秋間不能完竣則竟俟秋後辦理該督撫其董率所屬悉心經畫以期工堅料實無濫無浮務期濱海羣黎永享安恬之福以副朕先事預籌至意欽此乾隆四十五年四月初七日奉上諭朕廵幸浙江由海寧閲視塘工至杭州老鹽倉一帶有柴塘四千二百餘丈雖因其處不可下樁為石塘然柴塘究不如石塘之堅固業經降㫖将可以建築石塘之處一律改建石塘以資永乆保障兹忽憶及該地方官及沿塘居民見該處欲建石塘或視柴塘為可廢之工不但不加防䕶甚或任聴居民拆毁竊用致有損壊則石塘未蕆工之前於該處城郭田廬甚有闗係且改建石塘原為保衛地方之計若留此柴塘以為重闗保障俾石塘愈資鞏固豈不更為有益况當石工未竣以前設使潮水大至而柴塘損壊無可抵禦不㡬為開門揖盗乎著該督撫即嚴飭地方文武官将現有柴塘仍照前加意保固勿任居民拆損竊用將來石工告竣遲之數年或親臨閲視爾時柴工倘有損壊惟該督撫是問欽此乾隆四十九年三月十六日奉上諭浙江建築石塘所以保障民生闗係甚重前庚子南廵時朕親臨閲視指示機宜於老鹽倉舊有柴塘後一律添建石塘四千二百餘丈次第興修於上年七月間告竣因其砌築堅整如期蕆工原欲将該督撫及承辦文武官員交部分别議叙今抵浙後親臨閲看乃所辦工程不惟不應邀叙並多未協之處盖朕於老鹽倉添建石塘固以衛護民生亦因浙省柴薪日益昻貴嵗修柴塘採辦薪芻致小民日用維艱是以建築石工為一勞永逸之計庶於閭閻生計有益然石塘既建自應砌築坦水保䕶塘根乃陳輝祖王亶望並未籌畫及此而後之督撫亦皆置之不論惟云柴塘必不可廢此乃受工員慫恿為日後嵗修冒銷地步况朕添建石塘原留柴塘為重門保障並未令拆去柴塘前降諭㫖甚明也若如該督撫所言復加嵗修又安用費此數百萬帑金添築石塘為耶又石塘之前柴塘之後見有溝槽一道現有積水並無去路將來日積日甚石塘根脚勢必淹浸滲漏該督撫亦並未慮及又石塘上有堆積土牛甚屬無謂不過為適觀起見無當實際設果遇異漲又豈㡬尺浮土所能抵禦耶所有塘上土牛即著填入積水溝漕之内仍將柴塘後之土順坡斜做祗需露石塘三四層為度並於其上栽種栁樹俾根株蟠結塘工益資鞏固如此則石柴連為一勢即以柴塘為石塘之坦水且今柴塘亦時見有坦水也總之現在柴塘不加嵗修二三十年可保安然無事即如范公塘尚厯多年况此厯年添建工程更為堅實耶至范公塘一帶亦必需一律接建石工方於省城足資永逺鞏䕶著自新築石塘工止處之現做柴塘及挑水段落起接築至硃筆圈記處止再接築至烏龍廟止亦照老鹽倉一帶做法於舊有柴塘土塘後一體添築石塘将溝漕填實種栁並著撥給部庫銀五百萬兩連從前發交各項帑銀交該督撫據實核算分限分年董率承辦工員實力堅築仍予限五年分段從東而西陸續修築俟工程全竣後朕另行簡派親信大臣閱看收工以期海疆永慶安恬民生益資樂利該部即遵諭行欽此欽定四庫全書海塘錄巻首二聖製聖祖仁皇帝詩渡錢塘江康熙二十八年雪後春烟漠漠浮揚舲擊楫向中流江通潮汐分呉地路入溪山隱越州振武戈矛皆駐馬憶用武時大兵屯駐江干省方斿葆此乘舟風帆沙鳥看何限逺近雲霞望裏收望錢塘江康熙三十八年江流幾折勢灣環指㸃遙岑是越山南朔東西無一事春風浩蕩奉慈顔錢塘江潮康熙四十二年相傳冰岸雪崖勢滚滚掀翻湧怒濤風靜不聞千里浪三臨越地識江臯復由江上幸雲栖舟中康熙四十六年鳥道沿江問信潮石尤恬靜有歸橈轉移至險看洄洑盡得人防莫失調世宗憲皇帝文海神廟碑文雍正十年國家䖍修祀典以承上下神祗嶽瀆海鎮之神秩祀惟謹視前代為加隆朕臨御以來夙夜以敬天勤民為念明神之受職于天而功徳被于生民者昭格薦歆敬禮尤至其為民禦大災捍大患合于祭法所載則尊崇廟貌以昭徳報功葢所以遂斯民瞻仰之願而動其敬畏祇肅之心使無敢慢易為非以得永荷明神之嘉貺意至逺也皇輿東南際大海而浙江海寜居瀕海之衝龕山赭山列峙其南􅄓風怒濤潮汐震蕩縣治去海不數百步資石塘以為捍蔽雍正二年潮湧隄潰有司以聞朕立遣大臣察視修築且念小民居恒罔知敬畏慢神褻天召灾有自爰切諭以修省感應之道令所司家喻户曉警覺衆庶比年以來徼明神庥佑塘工完固長瀾不驚民樂其生閭井蕃息越七年七月秋汛盛長幾至泛溢吏民震恐己而風息波恬隄防無恙逺近懽呼相慶謂惟大海之神昭靈黙佑恵我烝黎以克濟此朕惟滄海含納百川際天無極功用盛大神實司之海寜為海壖劇邑障衛呉越諸大郡海潮内溢則昏墊斥鹵咸有可虞神之禦患捍災莫此為大特發内帑白金十萬兩勅督臣李衛度地鳩工建立海神之廟以崇報享經始于雍正八年春三月洎雍正九年冬十有一月告成門廡整秩殿宇深嚴丹雘輝煌宏壯鉅麗時展明禋典禮斯稱爰允督臣之請勒文穹碑垂示久逺俾斯民忻悚瞻誦共喻朕欽崇天道祇迓神庥懷保兆民之至意相與嚮道遷善服教畏神則神明之日監在兹顧荅歆饗其炳靈協順保䕶羣生奠安疆宇與造物相為終始有永勿替朕實嘉賴焉雍正十年六月初一日祭海神廟文雍正十年維雍正十一年歲次癸丑二月朔越日皇帝遣内大臣海望直隸總督李衛等致祭于寜民顯佑浙海之神曰明神受職于天恩覃澤國禦災捍患利賴宏深凡兹東南黎庶所得保室家而安耕鑿者神之賜也朕恭膺天命撫馭寰區夙夜敬共以承上下神祗之祀所期海宇蒼生永䝉庇佑惟兹浙西郡邑實為瀕海要衝比年以來仰荷神靈嘉貺頻昭安瀾共慶迺者風潮鼓盪衝潰隄防近逼居民吏人震恐朕痌瘝在念軫惻維殷遄遣重臣周行相度涓日鳩工為海疆圖久逺奠安之計用是潔誠致禱䖍命在工大臣敬展祀事昭告悃忱惟明神俯念海壖億萬生靈城郭田廬於兹託命隄工木石皆出脂膏力役所需民衆勞苦伏冀洪昭福佑黙相大工綏靜百靈風恬波息俾功作得施長隄孔固克底厥績䕶衛烝民保聚生全安享樂利則東南列郡溥被庥祥朕實拜明神之功徳於無疆矣謹告今上皇帝文尖山觀音殿碑文乾隆二年我皇考世宗憲皇帝廑念浙江海塘為瀕海諸郡保障先後遣大臣相度形勢鳩工庀材動發帑金二百餘萬繕舊葺新俾居民有所依恃尖山者海隅之一山也以石為址矗立滄濤朝潮夕汐必經其麓因即其上建大士廟用以棲神靈來景貺經始於雍正十二年冬十月越乾隆元年八月告成所司以勒石記事上請朕惟海天地間為物最鉅非有神靈黙相人力將無所施工而佛法不可思議恒能贊助造化庇佑蒼黎有感必通捷于影響釋氏所稱觀音大士者以慈悲為心救度為縁普濟衆生隨聲應規其功用大矣我皇考為民祈福之心無乎不致神之能為民禦大災捍大患者敬而禮之浙中名山若普陀若天竺皆大士道塲靈應夙著尖山之名雖未顯于古而與靈鷲落伽逺近相望層巖嶻嶫近接潮音實為神明之宅寶坊既建將見風檣琛舶出入于烟波浩渺之中雲旗翠旓往來擁䕶而馮夷息警􅄓風不興並海之民安居樂業熙熙然耕田鑿井以詠歌皇考之聖澤于無疆者神之庥也爰鐫之貞珉以誌塔山壩工告竣碑文乾隆五年浙之海寜縣東南濱海之境有尖塔二山相去百有餘丈臨流聳峙根基毗連為江海門户海潮之自三亹入者為最大二山其首沖也舊有石壩捍禦洪潮積久漸毁我皇考世宗憲皇帝廑念瀕海生靈特命重加修築厥後以湍激暫停朕仰承先世勤恤民依諄諭封疆大吏盡心籌畫邇年以來沙之坍者日以漲潮之北者日以南度可興工爰命撫臣及時完整兹乾隆五年夏撫臣奏自二月間庀徒興役子來雲集踴躍爭先兼以風日晴和程功倍速届今閠月之初工巳告竣一望崇墉屹如磐石向之惴惴恐懼慮為波臣者安耕作而符平成恭請勒石紀載垂諸無窮夫禦灾捍患貴先事而為之防海波浩瀚際天潮汐出入高如連山疾如風霆瞬息數百千里非人倉卒所可禦居民恃石塘以為安石塘恃二山以為障而聨絡二山之勢延袤横亘若户之有閾闗之有鍵繄壩工是繫今者隄岸堅完沙塗高阜藩籬既固石塘可保無虞廬舍桑麻綺分繡錯東南七郡咸登袵席之安非特寜邑偏隅而巳是役也施力于烟濤不測之區奏功速而民力不勞良用嘉慰繼自今守土之臣其益恪勤奉職共體此事事有備之意以保吾烝黎海疆其永有賴諸登開化寺六和塔記乾隆十六年杭州月輪峯六和塔宋開寶中創建以鎮江潮開化寺其塔院也自宋以來屢燬屢復燬則有驚浪之虞復則有安瀾之慶是以雍正十三年我皇考世宗憲皇帝特發帑金命有司鳩工庀材是輪是奐越二年而告成又十有四年而朕以南巡之便親涉其頂且為之記焉盖浙之潮人所共知為雄鉅浙之塘人所共知為要害然非目擊終為耳食且沿江以來亦不辨其曲折之形也造塔顛而後審其所以稱浙江者溯流東晞又悉其亹龕赭逕溟渤頓挫渟蓄迭蕩掀激斯所以為廣陵之潮者我皇考居九重之穆清運萬㝢于几席留意海塘福被蒼赤葺斯穹塔資厥佑相予小子景仰前烈深惟愛民之心既誠故為民之慮無所不至而必中其綮夫必待身患而後圖之斯不已遲乎是皇考之聖神而予小子瞠乎其後者也故勒貞珉以識之乾隆十有六年嵗在辛未三月之吉御製并書浙海神廟碑文乾隆二十三年浙西地瀕海扼其衝者先海寜次錢塘錢塘距海門尚一舍而逺然天下言觀潮之竒者獨惟廣陵之􅇧母盖徽歙衆山之水自新安江下至富陽而金衢嚴處數郡千巖萬壑復滙入錢塘出海必得海潮逆之坌涌抝怒軋盤盪矞然後流益急而軌益順故江之歸壑非濤不為功然其北擊南蕩生民農桑之命繫焉斯時塘堰為保障漢書注始紀郡議曹華信作塘捍潮唐書捍海隄凡二百二十四里宋元二史並誌袁花諸塘之修築及石囤朩櫃之防禦如世所傳斛土千錢之諺其勤且囏如此雍正八年我皇考世宗憲皇帝以海塘告成維神效靈助順特勅建廟海寜褒封秩祀用申昭報近海州縣不知有水患者二十餘年於兹然其時潮尚循北亹也乾隆辛未丁丑朕兩巡浙水登觀潮樓乃悉所為趨北亹而有軼則仁錢迤西害不可言趨南亹則蕭㑹諸邑之戴山者藩㰚畧具猶間有陊囓之虞比年來大溜直趨中亹兩岸沙潬鱗起如左右引從民居其間川原膏沃可耕可桑曾不知白馬胥濤足以動心而駴目夫人之情久則忘而逸則淫今之居樂土安作息者非昔之日夜怵惕懼為魚之民也耶則我皇考之深宫宵旰謀建塘以衛生靈與明神之肸蠁垂釐嘉佑是邦其何可以弗紀觀潮樓當錢塘都會之地東瞻中亹為尤悉爰視海寜祠宇之例命守臣鳩工庀材崇像設而展時事夫元氣灌輸端委相成無感弗假又何一二之可區分哉因為迎神送神歌俾肄之工祝以掲䖍妥靈其辭曰赭龕閉兮翼戸睋紫瀾兮滄嶼冰夷導兮江婓扈兩旍毿㲚兮金支中樹神之來兮按部迴水犀兮萬弩虹隄一綫兮安堵福我民兮於昭揚詡傳芭兮鼚鼓紛配藜兮神靈雨右迎神擥若朩兮留暉櫩雲解駮兮赬霞罨幃罇蠲滌兮爼腯肥聆繁會兮叶呼豨神之去兮載祈波恬羅刹兮石平磯潤千里兮涵郊圻引晦濁兮歸墟是歸式歆饗兮庶幾朝潮夕汐兮長無違右送神乾隆二十三年嵗在戊寅季春御製并書祭海神廟文乾隆二十三年維乾隆二十三年歲次月朔越日皇帝遣致祭于浙江海神曰滄海為百川之長淛河受三折之趨潤注惟功基防是力當皇考懷柔之治妥以馨香惟明神感格之心恬兹潮汐既勅祀鹽官之邑遂鞏成玉帶之堤沃壤敷滋豐年賴慶朕再臨呉越兩報牲牢爰規勢于錢塘雄開離位特庀材于將作敬妥坎靈永冀嘉庥載崇新構陽侯率職森羅衛從之儀水伯承風申布指揮之義門外東瞻萬里朗雲靄于赭龕樓前西轉一江肅濤瀾于子午翠旗初展全收鯷壑清光蘭橑高騫靜擁鳳山正色從此恵我稼穡康予人民地近鐵幢簫鼓奏送迎之曲天臨貝闕春秋䖍香火之司兹以落成選辰専告神其昭貺實用鑒歆閲海塘記乾隆二十七年隆古以來治水者必應以神禹為準神禹乘四載隨山濬川其大者導河導江胥入于海禹之蹟至于會稽會稽者即今浙海之區所謂南北互為坍漲遷徙靡常地神禹親厯其間何以未治豈古今異勢爾時可以不治治之乎抑海之為物最巨不可與江河同人力有所難施乎河之患既以隄防海之患亦以塘壩然既有之莫能已之己之而其患更烈仁人君子所弗忍為也故每補偏救弊亦云盡人事而已施隄防于河已難而況措塘壩于海乎海之有塘壩李唐以前不可考可考者葢自太宗貞觀間始厯宋元明屢修而屢壞南岸紹興有山為之禦故其患常輕北岸海寜無山為之禦故其患常重乾隆乙丑以後丁丑以前海趨中亹浙人所謂最吉而最難獲者辛未丁丑兩度臨觀為之慶幸而不敢必其久如是也無何而戊寅之秋雷山北首有漲沙痕巳卯之春遂全趨北大亹而北岸䕶沙以漸次被刷是柴塘石塘之保䕶于斯時為刻不可緩者易柴以石費雖巨而經久去害為民者所弗惜也然有云柴塘之下皆活沙不能易石者有云移内數十丈則可施工者督撫以斯事體大不敢定議夫朕之巡方問俗非為展義制宜措斯民于袵席之安乎數郡民生休戚之闗孰有大于此者可以沮洳海濱地險辭而不為之悉心相度以期乂安吾赤子乎故于至杭之翌日即減從䟎程䇿馬隄上一一履視測度然後深悉夫柴塘之下不可施工以其實係活沙樁橛弗牢訖不可以擎石也柴塘之内可施工而倉卒不可為以其拆人廬墓桑麻填坑塹未受害而先驚吾民也即云成大利者不顧小害然使石塘成而廢柴塘是棄石塘以外之人矣如仍保柴塘則徒費帑項為此無益而有害之舉滋弗當也于是定議修柴塘增坦水加柴價一經指示而海塘大端己具守土之臣有所遵循即隨時入告亦巳成竹素具便于進止也議者或曰所損者少而全者衆柴固不如石堅何為是姑息之論然吾聞古人云井田善政行于亂之後是求治行于治之時是求亂吾將以是為折中而不肯冒昧以舉者此也踏勘尖山之日守塘者以漲沙聞後數日沙漲又增命御前大臣誌石簍以騐之果然自初三日親臨閲塘後即命都統努三額駙福隆安立標于石簍之上以騐增長今復遣往視回奏云十日以來沙漲至三尺餘土人以為神佑斯誠海神之佑耶但丁丑以前己趨中亹者尚不可保而況今數尺之漲沙乎然此誠轉旋之機是吾所以黙識靈貺益勵敬天勤民之心也是吾所以望神禹而怵然以懼慚無奠定之良䇿也至海寜日即䖍謁海神廟皇考御製文在焉因書此記于碑陰以識吾閲塘咨度者如是固不敢以巳見為必當也詩開化寺乾隆十六年高嶺度南屏澗谷遵曲折出峽倐開豁川雲景復别蘭若枕石磯葱蒨扶屼􅝝佛宇既莊嚴精廬亦清潔結習未能忘隨喜試禪悦憑軒俯江濤以演廣長舌開化寺再作乾隆十六年春事日以佳春遊興無斁蘇隄桃栁芳所玩近几席度嶺尋梵宫畧取幽趣適穹塔鎮呉江隔岸越山碧顧步挹清芳騁懷寄寥寂境亦安能窮樂亦胡可極明當整歸轡留詩勒蒼壁登六和塔作歌乾隆十六年我遊西湖率三日樂矣慮非凜無逸會稽南望舉精禋宣命明當發清蹕穹塔鎮江久所聞到此不登孤良因振衣拾級陟其頂耳飫天籟衣濕雲海眼龍宫寂寥鎖江邊雁堵香花妥之字長流寫向東月峯朝靄攬于左壯觀至是真空前那更息心安四禪杜甫添憂我添喜境移所遇理則然錢塘江潮歌乾隆十六年向聞錢塘潮最竒江樓憑几今觀之更聞秋壯春弗壯弗壯巳匪夷所思兩山夾江龕與赭亹束長流逼東瀉海潮應月向西來恰與江波風牛馬江波畢竟讓海波迴瀾退舍如求和洪濤拗怒猶未巳却數百里時無何于今信識海無敵苞乾括坤浴淵魄何處無潮此處雄雄在奔騰旋盪激蓂茁三葉及落三昏最勝日期無淹我來正值上巳節晴明遙見尖山尖須㬰黯黮雲容作似是豐隆助海若天水遙連色暗昏倐見空際横練索旁人道是潮應來一彈指頃堆銀堆疾于風檣白于雪寒勝冰山響勝雷砰硡礌硠礴磅􅐀紞紞啍啍吼噦噦流離頓挫無不兼迴斡旁噴極滂沛地維天軸震撼掀天呉陽侯挾飛亷蛟龍鼓勢魚蠏遯長鯨昂首噓其髯榜人弄潮偏得意金支翠旂簫鼓沸忽出忽入安其危但過潮頭寂無事因悟萬理在人為持志不定顛患隨遲疑避禍反遭禍多應見笑于舟師渡錢塘江乾隆十六年斛土千錢詭就塘風恬日暖綵舟方一江呉越分疆界三月烟花正艷陽航葦誰曾見神異射潮未免話荒唐漲沙南徙民居奠海潮向逼北岸海寜仁和二邑塘工頗以為患近年來北岸漲沙潮汐南徙遂慶安瀾永賴神庥敬倍常自紹興一日渡江至聖因行宫乾隆十六年朝辭餘暨暮錢塘片刻長江穏渡航未免情殷戀西子不殊風便送滕王快晴乍覺烘山翠弦月遙疑釣水光十畝行宫遊不足憩閒命筆玉蘭堂開化寺乾隆二十二年蕭寺倚江干江天暢逺觀慧燈傳浩刼寶塔鎮洪瀾庭籟涼生竹山春香噴蘭坐欣諸品淨何處覔心安登六和塔作乾隆二十二年初地詣堅固信心登窣堵二諦此俱融空色本無所三明真淨域可以泯今古四天垂寶網落落聞鈴語五雲糺扶葢擁䕶龍象旅六鼇永負戴萬刼奠江漵七寶勝莊嚴如是瓣香炷層層標實銓七層皆辛未年所題扁額厯厯頻證取江山識重巡歡喜生八部颺以細細風霏以纖纖雨造極朱欄扶曠覽供仰俯于巳可忘憂于民那忘苦迴首禮釋迦徒羨曾何補閲海塘作乾隆二十二年騎度錢塘閲海塘閭閻本計聖謨長雍正年間海潮直逼北岸大為杭嘉湖郡縣之患皇考特命大臣鳩工築塘以捍之潮頭遂漸徙南岸海寜一帶沙漲數十里迄今二十餘年錢塘永固民安其業長江已輯風兮浪萬戸都安耕與桑南北由中賴神佑生靈永奠為民慶漲沙百里誠無事莫頌惟增敬不遑觀江潮作歌乾隆二十二年樓名望潮江岸傍既到弗登有底忙登矣不俟潮一望殺風景事誠何當哉生魄為潮盛候因緣恰值聊相徉是日未刻潮應至厯申那見濤乘江駕山張葢徒想像詩消醮退真荒唐江山小船迎潮慣船名出江山縣地方吏備迎潮者用之解嘲畧仿羯鼓腔金支翠旂光錯落摐金擊革聲鏗鏜俄頃江面潮亦至恬風輯浪非礌硠惟覺兩岸隱增溜賈舶好趂輕颿揚陽侯靜斂滄波細一霎依舊天水蒼昔聞庢沓戰藉藉欺人慣是文人長或云乘輿百靈䕶伍胥文種心早降王人謂潮頭奮振者為伍胥潮其後如綿絮而少弱者為文種潮云或云江走中亹後潮汐非比曩時强其然豈然付一笑漲沙惟喜資耕桑壬午三月朔恭依皇祖巡幸杭州詩三疊韻乾隆二十七年三度南巡侍大安江山介祉奉徽觀風輕日麗臨雄郡踵接肩摩迓御鑾蹕館暫居幾有勅海塘言念志難寛修防要欲籌全善那覺西湖景助歡題開化寺乾隆二十七年六和寶塔矗岧嶤古寺咸傳開寶朝隔岸越山拖畫􅖵列屏呉嶺入雲標已敎息慮栖禪悦但未忘言答景撩頗訝考功悞靈隱試看門對浙江潮壬午暮春瞻禮六和塔作乾隆二十七年寶塔岧嶤聳七層恐妨泥汚不須登鎮江厯刼安瀾慶凌漢單提向上乘立久波光如欲徹望來烟意亦將澄漫言造極今孤約興已軒飛絶頂憑觀潮樓紀事乾隆二十七年跋馬萬松嶺言尋觀潮樓樓祀江潮神繄吾禋典修前兩度臨兹江從樓下流今畨乃漲沙郡咸頌神庥然吾别有思無非為民謀迤東利沙漲庶望桑麻稠迤西本弗藉石塘鞏金甌從古樓臨江濤觀八月秋觀濤固非要況昨暢吟眸利者乃致敗柴石捍禦籌弗藉者反然泥塗艱行舟試看西來薪轉運以車牛合郡供爨薪弗屬寜免愁謂此為昭假實益吾懷羞題土備塘乾隆二十七年土備塘云海望修意存未雨早綢繆石柴誠賴斯重障是謂忘脣守齒謀觀海潮作歌乾隆二十七年辛未觀潮潮巳竒杭人猶稱其力微丁丑觀潮潮未至作歌高樓聊記事似神而非者曰三逮兹三度潮真酣卻非江樓觀約畧剏得乃在柴塘尖我閲柴塘籌禦海詎圖快覽驚濤駭因緣大汛三月三洪瀾有若將予待跋馬指東向鹽官一條銀線天際看捲江倒海須㬰至迎來底藉江山船江山船迎潮見前詩色猶未覩先聞聲礌硠磅􅐀輷匉訇徐行按轡攬其狀大哉觀矣誰與京胥母弭節倐奔瀉並驅素車而白馬淋淋汨汨浩湯湯踰跇配藜白鷺下一空前此初遇竒既欣漸復生愁思長茭厚石弗預固秋來轉瞬奚當之觀海塘誌事示總督楊廷璋巡撫莊有恭乾隆二十七年明發出慶春駕言指海寜海寜往何為要欲觀塘形浙海沙無常南北屢變更北坍危海寜南坍危紹興惟趨中小亹南北兩獲平然苦中亹窄其勢難必恒紹興故有山為害猶差輕海寜陸且低所恃塘為屏先是常趨南漲沙率可耕兩度曾未臨額首謝神靈庚辰忽轉北海近石塘行接石為柴塘易石自久經費帑所弗惜無非為民生或云下活沙石隄艱致擎或云量移内接築庶可能切忌道旁論不如目擊憑活沙説信然尺寸不可爭塘邊試下朩樁始苦沙澀用二百餘觔之硪一築率不及寸許待樁下既深又苦沙散不能齧朩樁搖搖無著也移内似可為閭閻櫛比并柴塘向内數十丈其土似宜樁可以即工然所在皆田廬此處為塘必致毁棄田廬患未至而先殃民心復有所不忍其無室廬處又復多池阬固云舉大事弗顧小害應然以衛民心忍先使民驚且如内石建寜聽外柴傾是將兩隄間生靈蠲滄瀛如仍䕶外當去聲奚必勞内營以此吾意決致力柴塘成坦水簍石置可固隄根撐柴艱酌加價毋俾司農程命行在户部及該督撫詳議加柴價補苴示大端推行宜殫誠塘上四首乾隆二十七年西塘尚有沙塗䕶既至東塘沙總無石不能為柴欲朽防秋要計可徐圖鹽官從不曉迎鑾古朴民風致可觀卻勝杭嘉多飾禮綵棚鼓樂滿河干葦廬灶户日煎鹽辛苦蠅頭覓潤霑噓􅦈胼胝耐燥濕厚資原是富商兼隄栁青青畦菜黄村梅遮塢逺聞香徐行咨度周防計懶惰無心問景光閲海塘疊舊作韻乾隆二十七年今日海塘殊昔塘丁丑南巡時海塘大溜尚走中亹已夘以來潮勢復趨北亹現飭大吏相度修繕以為民衛補偏而巳䇿無良北坍南漲嗟燒草水占田區竟變桑父老常談寜可諉土人以三亹海潮之行不南即北此因任之論與河徙天數語同非治水者所宜出也明神顯佑詎孤慶雍正七年崇飾勅建海神廟近復命錢塘祠宇以昭靈貺尖山跋馬非探勝萬井安全慮不遑登尖山觀海作乾隆二十七年輿圖早巳識尖山地設天開障海闗東北岡巒捍猶易西南柴石禦為艱䖍心所祝資坍漲蒿目無方計剔鬟大吏載咨補偏䇿盡吾誠耳敢云閒視塔山誌事乾隆二十七年尖山實捍海塔山舒右翼翟邨當兜灣賴此雄潮逼條石未可築塊石先救急其下有石簍射溜圖根立䇿馬視簍痕云沙漲數尺浙撫臣言竹簍貯石下䕶琪基數日來沙漲掩簍四尺許遂命立標以驗增漲尺寸是為轉旋機其然談何易叶詎當恃天佑而弗盡予責丁寜示方伯吾意知應悉斯時工難施沙逺當易石魚鱗一例接方為經久䇿海神廟瞻禮有作乾隆二十七年鹽官駐馬先䖍謁廟貌枚枚皇考修捍患禦災宜祀典恬風靜浪賴神庥即今南漲方坍北尚此春逢況值秋黍稷非馨在明徳是吾所愧敢忘愁尖山禮大士乾隆二十七年秋水精神滿月相峯巔妙演海潮音普陀天竺何遙近無礙隨緣應感心駐陳氏安瀾園即為雜咏六首名園陳氏業題額曰安瀾至此緣觀海居停暫解鞍金隄築籌固沙渚漲希寛縂厪萬民戚非尋一巳歡兩世鳳池邊高樓睿藻懸樓中恭懸原大皇考林泉耆碩邦直之乆學士陳元龍于御書是編修陳告時所賜渥恩賚耆碩適性愜林泉是日亭臺景春遊角徴絃觀瀾遂反駕供帳漫求妍隅園舊有名以是園為暫憩之所因賜今額隅園其舊名也巖壑窈而清城市山林趣春風花鳥情溪堂擅東海古樹識前明世守猶陳氏休因擬奉誠别業千年古喬松徑路尋梅香聞不厭竹靜望偏深瑞鶴舞清影時禽歌好音最嘉泉石處撫帖玩懸針元臣娯老地内翰肯堂年賭墅棋聲罷朩天甎影捐竹堂致瀟洒月閣挹清娟竹堂月閣皆園内名勝信宿當迴蹕池邊坐少延天朗惠風柔臨溪褉可修是日上已趣真如谷口姓不讓岡頭意以延清永步因覔句留安瀾祝同郡寧為暢巡遊謹案均廉原書所載聖製至乾隆二十七年而止今依前巻續載諭㫖之例恭録三十年四十五年四十九年御製詩章續載於左自石門縣跋馬度城易輕舟至陳氏安瀾園即景雜詠乾隆三十年艤舟跋馬度由拳心喜觀民緩著鞭更有閲塘予正務遂循溪路易輕船夾溪萬姓喜迎鑾桑柘盈郊入畫看廿四槳過風帆去聲片時新壩到長安即壩名壩隔髙低換綵舟綵舟致重櫓聲柔仍圖迅利䇿予馬蓄眼韶光面面酬鹽官三載重經臨兩字安瀾實厪心駐輦春風棄清暇果然城市有山林駐陳氏安瀾園疊舊作即事雜詠六首韻乾隆三十年如杭第一要籌奠海塘瀾水路便方舸前廵抵杭城由陸路赴海寧閲塘今年舟次石門即從别港水道前進先駐是園取便程急先務也江城此稅鞍汐潮仍似舊宵旰那能寛増我因心懼慙其載道歡隅園城角邊新額與重懸意在安江海心非耽石泉喬柯皆入畫好鳥自調絃有暇詩言志雕蟲不尚妍鹽官誰最名陳氏世傳清詎以簮纓嚇惟敦孝友情春朝尋勝重去聲聖藻賜褒明原任大學士陳元龍請老時奉園皇考書腸林泉耆碩額以寵其行今恭樓正中来日尖山詣祈庥盡我誠書堂橋那畔熟路宛知尋既曲越延趣惟幽不礙深風翻花動影泉出峽留音古栝無榮謝森森青玉針園以梅稱絶盤根數百年古風度逈别時世態都捐春入香惟净月來影亦娟閒吟将對寫消得意為延溪泛櫓聲柔溪涯有竹脩獺時看伏翼是園水中有獺魚並育槎頭似此真佳處無過信宿留觀塘吾本意詎可恣遨遊謁海神廟瞻禮疊舊作韻乾隆三十年庚辰之嵗潮趨北柴石塘工重去聲事脩亟籲施仁斯益切不更平聲為患仰貽庥漲沙雖縱聞増渚汛水無過幸晏秋廟貌欽崇緬皇考中亹未復祗懐愁命添建海寧縣城石塘前坦水石詩以誌事乾隆三十年柴石兩塘工前巡大端定前廵閲視海塘時有以老鹽倉一帶柴塘恐難經久請易柴為石者及親臨度試刖塘内沙活不可下樁再移内數十丈雖工作可施勢必毁棄田廬未弭患而先殃民又豈保衛之道因决意修築柴塘勅部議増薪值俾採購裕足並命添置坦水簍石捍䕶隄根兹來重相視事無不用敬念兹古縣城萬民所託命城南即石塘魚鱗固綿亘但潮今北趨己近塘根迎坦水縱兩層潮來惟一賸設使久盪激塘根将致病去嵗雖添建六十丈而竟尚欠久安策俾増一律稱去嵗撫臣請建坦水六十餘丈止就險要而言於全塘形勢尚未籌及因命増建四百六十餘丈並視二層舊坦之樁殘石缺者令補益繕完使䕶塘根永資鞏固殺去聲勢護石工費帑吾寧聽何當復中亹額手斯誠慶塘上三首乾隆三十年尖山将往閲潮淤塘上清晨發步輿一帶隄根皆囓水撫斯安得暫心紓魚鱗誠頼此重隄隄裏人家屋脊齊土備却稱守重障土備塘海望所修欲以為重闗保陣夫石塘外如果可為重障尚可今為之塘内且置人家于外豈有土更堅于石之理譬之防盗者舍牆門而扄屋扉甚無足取也一行遥見栁烟底竈户資生釡海存刮沙煎滷事牢盆茒棚蓽竇何妨覽欲悉吾民衣食源登尖山觀海乾隆三十年岧嶤净土普門憑觀海因之棧道登愧我敢云希績底奠兹惟是頼仁能臺臨上下空無際舟織往来波不興俯視塔山資射浪漫言沙漲有明徵視塔山誌事疊舊作韻並示地方督撫及司事者乾隆三十年壬午視塘後沙漲仲如翼不久復致坍溜仍塘根逼自兹月據報壩基下有䕶根石簍前廵臨閲時沙漲掩簍痕四尺許因命標誌其處驗增漲尺寸浙撫毎月奏報時緩亦時急即今石簍下又見漲沙立較之昔立標乃更増五尺沙漲時有嬴縮兹親臨看騐較舊誌復增五尺大吏皆謂江海效靈然坍漲靡常實不敢即以為慰也效靈謾致頌安保無更易夫惟君與臣均有安民責為民籌保障可弗此心悉何時沙坂堅魚鱗易條石惟俟天黙佑斯實乏良䇿閲海塘再疊舊作韻乾隆三十年依舊潮頭近逼塘貽謨昔日計深良自乾隆戊寅後潮勢復漸趨北亹恃魚鱗大石塘及坦水竹絡壩為鞏䕶益仰實為皇考定制萬世永頼成規敬守脩柴石先是建議者擬易柴塘為石工壬午親臨相度塘下活沙既汕澁不受椿而内徙又妨田廬因命専修柴塘且増料值其條石各工隨宜加甃俾資捍禦古語誠符變海桑南坍北漲北坍南漲惟浙省為然盖無百年不易之事思復中亹亦過平聲望便由故道敢私慶盡人事俟神庥耳蒿目一勞念未遑觀潮四首乾隆三十年鎮海塔傍白石臺觀潮那可負斯来塔山濤信須臾至羅刹江流為去聲倒迴槖籥堪輿呼吸隨混茫太古合如斯伍胥文種誠司是之二人前更屬誰候來底藉鳴雞伺朔望六時定不差斫陣萬軍馳快馬飛空無轍轉雷車當前也覺有竒訝閙後本来無事仍我甫廣陵辨方域枚乗七發觀濤廣陵之曲江注未詳其所在後世乃指浙江為曲江以浙江濤廣陵濤溷而為一盖未深考漢書地理志餘杭屬㑹稽而不屬廣陵相習𫝊譌耳且如篇内伍子之山胥母之埸並在吳境于楊于杭皆風馬牛不相及尤難强為比附因作廣陵濤疆域辨以正之漫重七發述枚乗觀潮樓乾隆三十年前度沙平漲樓原陸地陵壬午登眺時樓前漲沙頗逺江船不能近岸多以牛車挽運今來刖江水近在隄下舟可泊塘盖逺刖衝齧無虞而艱于估舶近則帆檣稱便而潮溜或侵塘根似兹遷漲靡常益為全塘厪念今來江又近舟可跨欄乗變幻有如此晏清竟底憑水師呈技藝總督蘇昌攜閩省水師於樓前呈演水操諸技頗為嫻熟因行賞以奨之行賞命旌能謁海神廟瞻禮再疊舊作韻乾隆四十五年閱十六年重巡狩䖍瞻廟貌潔禋脩况逢坍北方南漲益切竭誠仰籲庥遍地耕桑艱讓水禦潮堤堰願安秋御碑拱讀增欽慕一例勤民不解愁駐蹕安瀾園再疊前韻六首乾隆四十五年觀海較前異石塘貼近瀾州臨因繫舫城入更乗鞍熟路原相識名園頗覺寛就曕任民便雷動夾塗歡沙坍逮北邊數嵗為心懸塘外漲沙南北坍漲靡常北漲刖塘工鞏固壬午閲視簍誌情形命撫臣每月勘驗具圗奏報自壬辰春以來沙痕漸覺北坍實為厪念不置到此蒿増目慙其言湧泉急籌塘與堰懶聽管和絃對景惟􅅥息摛辭那復妍安瀾易舊名舊名隅園重駐蹕之清御苑近傳蹟圓明園曽仿此為之即以安瀾名之并有記海疆遥繫情来觀自親切指示慙去聲分明行水緬神禹惟云盡我誠石逕雖詰曲歩来那用尋無花不具野有竹與之深磵户開生面泉紳振舊音御書樓好在垂露䕶韋鍼溪上三間閣棲遲似昔年非圗燕寝適頗覺犀塵捐老栝詩中畫古梅静裏娟别來十六載可不意為延拂岸栁絲柔出簷竹个脩重来亦儻耳昔事憶從頭南北漲坍屢自乾隆戊寅後潮勢漸趨北亹恃魚鱗大石塘及坦水竹絡壩為之鞏䕶丁丑南廵時值南坍北漲大溜巳向南已夘以後潮復趨北壬午乙酉兩經親閲溜勢或南或北遷改不常隨時指示大吏添用坦水竹簍防䕶並有詩紀事愁欣詩句留北漲則為之欣南坍則為之愁亦經屢矣即今值愁際那得惬情逰觀潮四首疊乙酉韻乾隆四十五年穹塔依然峙迴臺十餘年别此重来海潮欲問似神者㡬度東西兹往迴雷鼓雲車聲應隨自宜神物式憑斯設非之二人司是乙酉詩云伍胥文種誠司是之二人前更屬誰見雖髙而語似慢其後北坍南漲至今潮勢乃逼近石塘意甚悔之故反前句意如是雄威更合誰石塘上略肩輿駐報道未時潮不差是日潮以未時至枚客賦成擬閣筆周郎宿寄唤推車流光瞥眼誠云速潮信兹来試攬仍審至竒中至静在一時得句興堪乗登尖山觀海乾隆四十五年尖山更在塔山北潮所弗到勢猶逺以之觀海斯則近鐵板沙䕶東成堰尖山北至乍浦一帶向無塘堰因其地係鐵板沙不畏潮勢冲齧無庸防䕶山頂舊有大士宫竭誠瞻禮登雲棧所祝安瀾佑萬民寧圗玩景供逰眼亭臺㸃綴夫何為􅍀然為之意不滿觀塔山誌事再疊舊韻乾隆四十五年塔山塘入江竹簍以為翼壬午視之次沙漲畧弗逼乙酉詩誌幸其後勢漸急兹閲三層簍一層已露立壬午閲視塔山壩工有竹簍貯石下䕶壩基其時沙漲掩簍四尺許遂命立標以驗増漲尺寸諭撫臣按月繪圗奏報乙酉臨閲沙漲増至五尺衆皆欣頌但坍漲靡常實不敢即以為慰並有詩紀事兹復親臨相視不但所増之五尺漲沙盡坍且三層竹簍之上層已經顯露因竹蔑年久朽敝撫藩諸臣另籌換砌于保䕶雖屬有益然切望漲沙之漸増長耳其何禦三秋不啻減五尺前廵所慶幸兹番頓變易扼腕民之艱撫膺吾之責於無可如何敢不籌詳悉欲圗安墊居遑吝増鞏石補偏救弊耳愧無永逸策閱海塘三疊舊作韻乾隆四十五年乙酉潮頭纔逼塘退潮沙尚䕶塘良乙酉臨閲時潮頭雖漸有趨北之勢而潮退後塘外沙漲較壬午所閲標誌頗覺増長然亦未敢以為慰也即今坍盡一江水切巳愁厪萬井桑何日中亹復故道爾時合郡祝同慶神祠咫尺申瞻拜祈佑不遑慙不遑命老鹽倉上下相地仍建石塘詩以誌事乾隆四十五年壬午視海塘長言曽誌事爾時雖北坍塘外尚沙地未若此時甚水竟塘根至老鹽倉一帶惟頼柴塘峙向亦經親臨下樁目所視沙散弗齧樁條石艱鱗砌海寧恃塘工為屏蔽因潮近石塘復接石為柴塘然柴不如石之完固壬午親臨老鹽倉一帶擬易以石試下木樁苦沙活不能齧木樁難于砌石其柴塘向内數十丈似可下樁又皆民田弗忍毁棄因罷石塘之議移内又弗可遂罷石塘議兹來細周閲未可前言必叶柴塘四千丈豈盡活沙寄不無受樁處石塘終可恃石塘迤上柴塘四千二百餘丈未必概係活沙難以受樁因復飭該督撫派委誠妥大員據實逐段勘估凡柴塘可以改建石塘之處悉令易石毋惜工費俾濱海羣黎永享安恬之福申命重相去聲勘莫慮國帑費庶㡬永安瀾為民籲天庇觀潮樓疊乙酉詩韻乾隆四十五年南坍與北漲幻若谷和陵江尚岸之近樓如舫以乗暢懐忘景問厪念在欄憑遥指中亹陸通流何日能謁海神廟瞻禮三疊舊作韻乾隆四十九年庚子重来厪宴奠石工一律命堅修庚子南廵親臨閲視海塘飭該督撫于老鹽倉一帶将舊有柴塘一律改建魚鱗石塘毋惜工費仍留舊有柴塘為重門保障嗣據該督撫等于辛丑壬寅等年陸續採辦石料派委誠妥大員勘估建築至癸夘年八月内㩀富勒渾福崧奏将原辦續辦魚鱗石塘共三千九百四十大督率司道實力稽查于七月二十四日面石均已砌竣通工一律全完該督撫前往詳勘均屬如法砌築整齊堅實可以水慶安瀾矣勤劬雖曰不遺力䕶佑仍惟頼賜庥神廟載瞻申九叩御碑欽仰示千秋敢云塘固民安枕未翕中亹未解愁駐蹕安瀾園三疊前韻六首乾隆四十九年北坍今次永塘尚近洪瀾海塘沙北漲南坍則塘工鞏固今自壬辰春以來沙痕漸覺北坍至庚子前巡親閲則北岸漲沙盡坍海潮直逼塘根今尚如此實為厪念春月来觀海古稀仍據鞍每于城邑或乗馬便民曕就也魚鱗期越固庚子命改柴塘為石工飭該督撫等于老鹽倉一帶建築魚鱗石塘凡三千九百四十丈仍留柴塘為重門保障于癸夘七月全功告竣矣蠶市較蘇寛蘇州街市頗窄兹海寜衢市較寬鄉語分疆異民心一例歡塔山近海邊踏勘慰心懸竹簍喜増漲塔山壩工當潮汐頂冲向藉竹簍貯碎石三層擁䕶壩根昨秋據富勒渾等奏䕶壩竹簍上中兩層現俱露出今自二月後漲沙増長全掩三層竹簍為之稍慰蟻坯惕漏泉隅園且停憇比户有歌絃自是文章邑然當戒藻妍舊家原有述熟路不須尋世業傳來久國恩受巳深翰林兹挂籍書囿勉繩音海寧陳氏向多為翰林者今乃寥寥庚子臨此陳善慶以家藏蔡襄茶録真蹟呈進念為陳氏家傳墨寳因還之并為題句俾得世守勉紹前聲也重展蔡襄蹟依然懸古鍼蔡襄茶録筆意秀勁有晉唐懸鍼遺法其自記云草木之微處之得地則能盡其材頗能即小見大故庚子題詩有頌不忘規應著眼處之得地盡其材之句即襄自叙意也安瀾詎祗名永祝宴而清明日觀形勢一宵厪慮情前吟廵壁舊聖藻額檐明載語世臣者承家在敬誠是園有紫竹不計嵗和年畫格應為創吟情詎可捐松非自稱直梅亦捨其娟三益于斯盍都因静以延一溪春水柔溪閣向曽修月鏡懸簷角古芸披案頭去来三日駐新舊五言留六度南廵止他年夢寐逰登尖山觀海乾隆四十九年尖山迤北弗資塘鐵板沙比石猶固尖山迤西乃頼塘閭閻必藉石為䕶天時地利自古然人事弗和斯致誤所謂和亦匪云同盡心籌民保障故我登兹山亦己屢不為觀瀾暢神遇漲沙靡定不可恃每因蒿目乏良慮視塔山誌事三疊舊作韻乾隆四十九年兩山尖山塔山接石壩恃竹簍外翼條石未可築潮汐日夜逼乙酉沙䕶簍尖山塔山之間向有壩工正當潮汐頂沖條石難施惟藉竹簍貯碎石三層䕶根壬午閱視時沙漲掩簍四尺因命該督撫標記尺寸案月奏報至乙酉嵗親莅勘驗䕶簍沙漲較舊誌増至五尺時咸為壩工稱幸然坍漲無定未可恃也庚子坍漸急今幸䕶以全並無簍露立庚子前廵閲視塔山塘工不惟乙酉所見掩簍之漲沙五尺盡坍並三層竹簍己露上一層至癸夘八月上中兩層俱露今甲辰二月以來漲沙増長上中下竹簍三層復全行掩䕶北漲期難望遑此論寸尺乙酉即有言安保無更易乙酉塔山沙漲増長尺寸大吏皆謂江海效靈然海沙變易無常豈可深恃是以乙酉視塔山詩即有效靈漫致頌安保無更易之句籲佑未蒙庥誠弗假予責毎閲海塘必詣漸祠䖍籲而神佑今沙漲已見增長向稱難以施工老鹽倉之活沙兩年間接築魚鱗石塘籌辦江蘇及紹興等處所運石料均能及時應用亦頼惟有天佑誠神助益勉敬耳接築魚鱗塘工料籌詳悉兹更有後議欲擬将范公隄一帶土塘接至省城者都易以石庶乎可恃費帑非所惜也欲接築堅石此次南廵閲視議自搶塘柴工尾料向西南接至范公塘而于柴塘後添築石塘即留柴塘為重門保障更添建挑水壩兩道以資保䕶帑項非所靳然斯亦下策觀潮四首再疊乙酉韻乾隆四十九年鎮海寺傍臨海臺行春觀處正潮來逮今三度詩十二不擬石塘重去聲往迴詠事酉年信筆隨悔愆子嵗亦于斯乙酉觀潮詩有子胥文種誠司是之二人前更屬誰之句其後北坍南漲潮勢漸逼石塘因悔前詩之見雖髙而語似慢故庚子詩反其意云設非之二人司是如是雄威更屬誰誰當鑒我漲沙矣仍看北坍更籲誰李嵩妙蹟攜行笈相證雄觀信弗差詩讀張仁近楊基刺南宋風霜二帝忘行車石渠寳笈藏李嵩錢塘觀潮圗真蹟有張仁近題云雕欄玉檻照東海貪看秋潮忘黍離又楊基題句潮水信可定日夕来朝宗人心獨不如而不思兩宫兩宫未雪恥屢下班師㫖云云盖深譏宋髙宗之耽宴安而忘國恥也一帶石塘工巳就庚子閲海塘命于老鹽倉一帶柴塘為石塘昨嵗癸夘八月據富勒渾等奏報石塘三千九百四十丈大工已全行告竣魚鱗擬築向西仍老鹽倉一帶石塘雖己全竣而章家庵以西惟藉范公土塘衛䕶形勢單薄恐不足資捍禦兹與該督等悉心籌勘欲一律堅築石塘使闔郡黔黎永資樂利費帑所不惜也亦惟此日盡人力敢兾他年㡬可乗海沙南北坍漲原無常自已夘以後潮勢近塘沙痕漸覺北坍今己二十餘年循環往復理之自然當有北漲南坍之㡬然朕惟盡人事以待之其時㡬可乗固不可必耳老鹽倉一帶魚鱗石塘成命修海神廟謝貺并成是什誌慰用壬午觀海塘誌事詩韻乾隆四十九年壬午觀海塘無非求民寧並攜督撫臣時總督楊廷璋廵撫荘有恭疇咨閲情形憶自庚辰年沙勢己漸更然尚去塘逺未致大工興壬午至庚子北坍水鋪平畧無漲沙意日夕縈念恒長此其奚窮民生闗非輕戴家橋迤東猶有魚鱗屛迤西惟柴塘安足䕶桑耕庚子我重来崇祠籲佑靈憑輿厯厯觀既觀慮且行其間老鹽倉下樁我所經活沙旋吐樁海塘自戴家橋迤西皆柴塘不足資保衛因擬改築石塘司事者輒稱老鹽倉一帶活沙難于下樁若移内接築又有碍田廬壬午親臨試下木樁始苦沙澁用二百餘斤之硪一築率不及寸許樁下既深又苦沙散不能齧朩樁摇摇無著是活沙之説信然彼時既未能即築石塘因藉坦水石簍為固迨庚子南廵沙坍簍露始决計接建魚鱗石塘云蒿目乏計生申命築魚鱗切念樁難擎然事在人為未可謝不能老鹽倉一帶活沙難以訂樁然事在人為未可遽謝不能庚子南廵復申命改建魚鱗塘初開工時仍有己訂復起之患旋有老翁指㸃云用大竹探試俟扞定沙窝再下木樁加以夯築入土甚易因依法扞築又梅花樁以五木攅作一處同時齊下方能堅𦂳不致己釘復起試之果有成效迨後跟尋老翁己無踪跡現據富勒渾福崧等奏詢之盛住及在工員弁兵役等皆稱老人指㸃傳為並神助請勅修該處潮神廟以荅靈貺因俞所請賦詩以紀其事月月具圖報心懸如目憑大小吏胥勤民夫盡力争老鹽倉一帶石塘竟築并外仍䕶柴塘内無害溪阬却聞夯樁時老翁言信應竹扞試沙窩成效免變驚因下梅花樁堅𦂳無欹傾魚鱗屹如峙潮汐通江瀛功成翁不見詎非神所縈贊天福萬民竟得鉅功成臨塘新祠宇榱棟煥支撑肅拜致䖍謝五言得行程迤西更易為仍欲殫吾誠老鹽倉石塘三千九百四十丈鉅工已竣而章家庵迤西僅有范公土隄一道難資衛䕶因令該督等悉心籌勘一律改築石塘較之老鹽倉一帶更易施工亦惟殚吾愛民之誠不惜再費數百萬帑金俾闔郡黔黎永慶安枕耳閱海塘四疊舊作韻乾隆四十九年已夘以来潮近塘廿餘年未漲沙良丁丑嵗南廵閱視海塘其時海潮大溜尚趨中亹自已夘以後潮漸趨北亹至庚子南廵親臨相度則北岸漲沙盡坍海潮直至塘根矣雖然救弊柴易石先是建議者請易柴塘為石工又有謂老鹽倉一帶為活沙不可下樁而内徙更恐有妨田廬壬午親視之果然彼時惟命増添料值専修柴塘其舊有條石各工仍令隨宜加甃以備捍衛亦一時補偏救敝不得已之䇿耳尚未獲安海變桑縱看魚鱗一律鞏慙聽額手萬民慶庚子親臨閲視以柴塘究不若石塘之鞏固因不惜工費飭該督撫等于老鹽倉一帶一律改建魚鱗石塘凡三千九百四十丈其舊有柴塘留為重門保障昨癸夘秋八月據該督撫奏報石塘工已全竣浙省永慶安瀾等語今來廵視該處士民歡抃拜舞出于至誠然予宵旰憂勤有加無已之意尚欿然未足也范公塘更應籌固老鹽倉一帶改築石塘業經告竣惟章家庵以西僅藉范公土塘䕶衛形勢單薄曽諭富勒渾等悉心籌勘一體改建石塘以資捍衛㨿富勒渾等奏該處淤沙土性浮鬆即添築柴塘一遇潮汛頂沖亦不足抵禦等語因思柴塘自不及石工之堅固事在人為不可惜費即多費帑金數百萬使闔郡黔黎永慶安枕何樂如之遂命降諭㫖一律堅築石塘矣暇食民艱厪弗遑命於新建石塘尾柴塘内接築石塘越范公塘直抵烏龍廟即以范公塘為外䕶之土塘詩以紀事乾隆四十九年江南范公堤久傳仲淹義浙省范公塘乃自承謨置范公土塘乃本朝閩浙總督范承謨所建承謨即仲淹後裔也一家兩大工先後勤民事在浙斯言浙石堅土易潰邇年沙北坍廻瀾噭齧恣范塘東北尾内奰己有事昨嵗癸夘四月據福崧奏范公塘原築埽工自二月己來因迴溜汕刷致有間段矬蟄現用船沈石以䕶塘根尚屬稳固等語朕以該處既是潮水頂冲且迴溜汕刷即用石沈船亦係暫時防䕶非一勞永逸之計因傳諭富勒渾福崧通盤熟籌是否應照老鹽倉之例一例添築石塘詳悉繪圗貼説具奏並諭令于所呈圗内硃筆圈處添築挑水石壩以期挑溜南趨仍俟今嵗南廵時親臨閲視指示機宜再行定奪沈舟下石簍幸保目前計鹽倉石塘建繼此誠當議柴塘補范公率以允大吏該督撫等請于新築石塘工止處之現做埽工柴塘之尾接築柴塘八百餘丈直抵范公塘以為外䕶即允所請兹來細斟酌建石難再遲發帑五百萬分年物料備兹親臨閲視所建柴塘及范公塘一帶亦必須一律接建石工方于省城足資永逺鞏䕶因諭令自新建石塘尾起越范公塘直抵烏龍廟止范公塘盡處一體添築石塘撥給部庫銀五百萬兩并予限五年自東而西分段陸續修築並諭先行備辦工料擇日興工一如章庵東外柴内石暨柴即代坦水庚子南廵論今將章家庵以東柴塘内普建築石工兹来親閲見石塘之前柴塘之後有溝漕一道現存積水並無去路恐致淹滲塘根又石塘堆積土牛無俾實際令将土牛填入積水溝漕之内仍将柴塘後之土順坡斜做並于其上栽種栁樹俾根株蟠結益資鞏固且令外柴内石連為一勢即以柴塘為石塘之坦水且令柴塘亦時見本有坦水也柴接土塘比即范公塘土内石相倚烏龍廟齊至柴塘石塘中間将土牛填實種栁互相倚恃聫絡鞏䕶最為得力兹范公土塘後接築石塘直扺烏龍廟范公塘盡處均令照式修築堅固俾海疆永慶安恬民生亦資樂利永矣保杭城千年安晏遂六廵塘事畢五字始終誌恭依皇祖廵幸杭州詩六疊韻乾隆四十九年石塘接築俾民安為報工成此厯觀庚子廵視海塘命于老鹽倉上下接築魚鱗石塘為永逺安瀾之計其舊有柴塘仍命留為重門保障昨嵗癸夘八月内據該督撫奏報魚鱗石塘三千九百四十丈一律工竣今来躬親厯視所砌石工整齊堅實洵可永資保障云窮尾溯源暫紆蹕尖山在塔山之北自此北至乍浦一帶向無塘堰以其地係鐵板沙不畏潮勢冲齧而西自海寧沿塘觀海窮尾溯源一切塘工形勢可以一覽而得故自壬午乙酉庚子及今甲辰皆紆蹕登尖山頂觀海觀塘而返杭州衢歌巷舞此迎鑾欲尋南宋宫庭冺究是偏都街道寛杭州街道較蘇州甚寛知為南宋偏安之都會也敬仰奎章六依韻悵然思昔侍逰歡賦得南坍北漲得心字八韻乾隆四十九年紹興海寧對相峙江潮自古今中亹城􅆟美兩界幻難諶坍漲事無定北南勢有斟興猶山作禦寧祇岸虞侵紹興在浙省迤南諸山聫絡海潮南注可資抵禦若海寧一帶地本平衍正當北岸之衝潮水毎虞侵齧必沙勢南坍北漲始保萬全也壬午溜遷後甲辰水尚深丁丑南廵時見海潮大溜尚趨中亹已夘以後漸遷北亹壬午親臨閲視漲沙猶擁䕶隄根竹簍因命督撫標記尺寸按月奏報至庚子南廵往視塔山塘工漲沙盡坍至癸夘八月三層竹簍俱露今甲辰閲視幸沙漲復将三層竹簍工下全行掩䕶漸有南坍北漲之機然水勢尚未改趨中亹石塘經久之計不容緩耳築塘圗久計庚子南廵閲視塘工飭督撫等于老鹽倉舊有柴塘後一律添建石塘四千二百餘丈上年七月間告竣兹親臨閲視范公塘一帶亦必需接建石工方于省城足兹鞏䕶因再降㫖自新築石塘工尾起于范公塘内至烏龍廟止一體添建石塘仍留柴塘為重門保障于柴塘後石塘前溝漕内填土種栁俾柴石連為一勢即以柴塘為坦水撥給部庫銀五百萬兩予限五年陸續修築以期海疆永慶安恬射弩罷雄心無往思不復斯升謂北漲祝彼沈謂南坍神祠躬致拜籲佑愧為欽
