body:
  text: 海塘録卷七內閣中書翟均亷撰名勝一廟山咸淳臨安志在錢塘縣去城五十里突出江心潮勢至此方殺詩主同祖廟山道中蕭蕭疏雨㸃孤篷舟子招呼語順風小麥青青春怯半一犁江上看田翁楊萬里曉泊舟廟山平水長先曉無風也自濤烟昏山易逺岸濶樹難髙去雁鳴相報游魚冷總逃輕寒客可忍清眺得辭勞大湖山萬厯錢塘縣志茱萸尖之支東南行為大湖山山頂平廣五十六畝可耕有洞曰錢王洞洞門二皆丈許中廣二三畝不見日泉乳所結有長一二丈者紆回二十餘洞底有小窟窟下大潭深不可測取石投之聲如洪鐘山下有風洞立夏風生立秋風止有水洞水極清徹咸淳臨安志楊村慈嚴院舊名恩德有洞極大流水不竭頂上又一洞名風洞中多石子紅㸃如丹持出即隱置於內如故江月松風集洞在定山南葛洪常煉丹於此東坡與李節推唱和見集中方里英許郢州林和靖皆有詩詩白居易余以長慶二年冬十月到杭州明年秋九月始與范陽盧賈汝南周元範蘭陵蕭恱清河崔求東萊劉方興同遊恩德寺泉洞竹石藉甚久矣兹目擊果愜心期因自嗟云到郡周嵗方來入寺半日復去俯視朱綬仰睇白雲有愧於心遂留絶句雲水埋藏恩德洞簮裾束縛使君身暫來不宿歸州去應被山呼作俗人林逋風水洞平昔嘗聞風水洞重山復水去無窮因緣偶入雲泉路林下先聞接客鐘趙抃風水洞風穴有聲連水洞聽風觀水暫閒身杭州未入從容甚且與南山作主人蘇軾往富陽新城李節推先行三日留風水洞見待春山磔磔鳴春禽此間不可無我吟路長漫漫傍江浦此間不可無君語金鯽池邉不見君追君直過定山村路人皆言君未逺騎馬少年清且婉風巖水穴舊聞名只隔山溪夜不行溪橋曉溜浮梅蕚知君繫馬巖花落出城三日尚逶遲妻孥怪罵歸何時世上小兒誇疾走如君相待今安有蘇軾和李節推二首山前乳水洗塵凡山下清風舞檜杉細細龍鱗鋪亂石團團羊角轉空岩馮夷窟宅非梁棟禦冦車輿謝轡銜世事漸艱吾欲去永隨二子脫譏讒風轉鳴空穴泉幽㵼石門虛心聞地籟妄意覔桃源過客詩難好居僧語不繁歸瓶得氷雪清冷慰文園蘇轍和子瞻風水洞風送江湖滿洞天洞門可聽入無緣土囊鬱怒聲初散石齒聱牙勢未前樂奏洞庭真跌宕歌傳帝所亦清便何人隱几觀遺韻重使顔成問嗒然張無盡風水洞巔頭松竹自生寒雨穴茫茫徹鬼關風竊虎威時弄草泉欺龍睡故離山不嫌淅瀝驚塵耳聊挹清泠洗病顔窗外月髙湘簟冷更無閒夢到人間司馬才仲風水洞藤梢幕荒寒蘚花䕃空清窈窕石竇中兩耳風雨并初聞聲蕭騷活火急銅瓶再聽逗餘響習習起寒汀我疑此山空石腳連滄溟中有蛟龍蟄鼻息隱雷霆又疑仙翁却丹竈留岩扄至今爐鼎中水火不曽停山前老比邱霜眉眼如螢能傳古者語濯我耳聽醒便欲謝塵凡脫鞿隨爽靈元居中風水洞二洞標竒古連岩葺宇新涼生清桂曉暖漲碧桃春閒擁東方騎來尋北隴人破雲拖蠟屐琢句掃霜㕙談劇頻飛屑歌長自落塵為探瓊巘勝不記玉觴巡下客慚毛頴髙筵飲德醇追峯到峯頂疑化九霄身元居中風水洞上祖無擇洞蔽深雲逺俗塵山中曾未識朱輪自從白傅來遊後五百年間又二人張先和韻水色風光近使君浥塵輕雨逐車輪暫來不宿宜無恨多少行春不到人許遵風水洞水洞連風洞精藍兩洞前山髙易藏日樹老不知年板有華宗刻名留少傅篇烟波門外境寂寞變桑田范仲淹風水洞神仙一去幾千年自遣秦人不得還春盡桃花無處覔空餘流水到人間許元祐風水洞野寺依山立松橋避石斜壞梁飛白蟻枯木掛元蛇道路悲蓬轉功名惜鬢華聊將洞中水試洗眼前花錢惟善風水二洞空穴風來自吸噓垂岩出水廣渠渠天門此際通閶闔海眼何年泄尾閭隱者難招應化鶴飛仙可挾更乘魚留題太守懷蘇白好事今無五馬車壜山咸淳臨安志在錢塘縣去城五十里近廟山在楊村有慈嚴院萬厯錢塘縣志石龍之支東南行為壜山四圍皆石玲瓏秀巧有仙人洞洞門石闕一石從空駕其上洞內空明有石鼓傍有小窟竒石空洞浮山神州古史考在府城西南四十里髙二十丈峙於江中與漁浦諸山相望潮水回伏激射若神馮焉咸淳臨安志在錢塘縣東坡守杭日開河奏云潮水自海門來勢若雷霆而浮山峙於江中與漁浦諸山相望犬牙錯入以亂潮水洄洑激射其怒百倍沙磧轉移狀若神鬼雖舟師漁人不能前知其淺深坐視舟船覆溺無如之何今號浮山最險處江月松風集浮嶼山在定山側浮江磐石有潭聚魚玲瓏可觀潮出海門中分為兩𣲖東𣲖沿城岸向富春西𣲖直抵慈山而回諺謂之回頭浪詩錢惟善浮峙藏魚潭色空澄島影孤潜鱗時出迓天吳浪吞泗磬秋浮玉月照驪龍夜吐珠萬騎西來疑灔澦扁舟東去想陶朱沒淵每笑窮魚者何處烟波覔釣徒定山咸淳臨安志在錢塘江上髙七十五丈周回七里一百二步太平寰宇記定山突出浙江數百丈西湖遊覽志一名獅子山文選注吳郡緣海四縣記錢塘西南五十里有定山去冨春又七十里橫出江中波濤迅邁以避山難水經注錢塘縣東有定巳疑作包諸山皆西臨浙江水流於兩山之間江水急迅兼濤水晝夜再來至二月八月最髙峨峨二丈餘吳越春秋以為子胥文種之神也上有可避濤處行者賴之云是海神婦家郡國志江濤至是輒抑聲過此則雷吼霆怒江月松風集謝靈運富春渚詩有曰定山杳雲霧即此也神州古史考在府城西南四十里江回漁浦之潭山枕赤亭之野謝康樂之所曽賦沈隱侯之所嘗遊蓋波濤衝激之地行旅棲遲之所也詩沈休文早發定山夙齡愛逺壑晚涖見竒山標峯綵虹外置嶺白雲間傾壁忽斜豎絶頂復孤圓歸海流漫漫出浦水濺濺野棠開未落山櫻發欲然忘歸屬蘭杜懷祿寄芳荃眷言採三秀徘徊望九仙錢惟善定山曉行前峯月吐五更初空翠沾衣積雨餘溪火夜明經略彴澗雲秋重負籧篨篠林虎與人爭鬬茅屋雞催客趂虛不似關山行役者勞勞服賈逺牽車臣謹案錢惟善有定山十咏曰定山曉行曰朱梁夜泊曰六和觀月曰五雲賞雪曰龍門曉雨曰漁浦春潮曰風水二洞曰鳯凰雙髻曰浮峙藏魚曰浙江耀武殷雲霄夜登定山朝泛桐江水夜躡定山石延蘿踞虎豹噓波動潮汐俯闞馮夷宮疑入羽人宅林靜江有聲雲昏岸無迹懷哉坐哀聽戚矣闕逺覿風勢依峰峻月色連江白飛鴻鳴逺浦潜蛟舞深澤飄飄千里身脈脈獨遊客乘桴嗟有志棲岩悲失策薄宦竟何有幽期誰與適覺迷道有獲含欲情無逆眷言咏白駒聊以慰今夕排山咸淳臨安志排山在錢塘縣定山之北鄉排山嶺在定山南而鄉屬仁和縣徐村嶺夢粱録俗名薑擦子嶺在錢塘定山北鄊龍門山咸淳臨安志在錢塘縣西溪之欽賢鄉地髙峻上有龍池寺江月松風集龍門在定山西兩峰壁立有龍潭能興雲雨旱禱之輒應詩錢惟善龍門曉雨神劖峭壁聳雙扉雨挾腥風下翠微黑入太隂迷爽氣白翻叢薄散朝霏螺橫雜樹應藏景蛟吐癡雲未霽威回首他山新似沐登樓時攬女蘿衣五雲山咸淳臨安志在錢塘縣約髙百丈周回二十五里陳善志作髙千丈周四十五里神州古史考在府治西南二十里宏祩雲棲寺記山有五色雲故名巳而五雲飛集山塢中因號雲棲塢西湖遊覽志五峰森列盤曲而上凡七十二灣俯視南北峰若雙髻萬厯錢塘縣志江上之山為天門山支南行者曰五雲髙百丈俯瞰大江之三浙當其前其西北遡上為雲棲塢溪水經朱橋入江干萬厯杭州府志山半有伏虎亭梯以石墄以便往來江月松風集五雲山在定山北梁普覺禪師道場宋故事每嵗臘前土僧必奉雪表進黎明城中霰猶未集蓋其地特髙寒云詩錢惟善五雲賞雪獻瑞名山自昔聞化人臺殿雜金銀樹靈尚吐三花秀雲凍全消五色文鳥絶空江知棹泊鹿迷深徑待樵分興來更上髙寒處此境應無蕭使君錢惟善登五雲山善覺遺衣久不傳五雲故色尚蒼然斷崖蘿薜三千丈喬木風霜四百年龍井雨深泉獨響漁村潮上月初圓寶坊金碧紅塵聚何似兹山更絶緣余知閣五雲山三首幾年魂繞浙城西十里荷花漾錦陂踏遍兩峰三竺路又隨青嶂入雲棲千里旗旗擁六飛投簪欲上釣魚磯無端忽被閒雲引回耀峰前掩竹扉洛邑名園歌舞沈亂鴉啼破幾黃昏何人學得香山老千載精廬有梵音林景初金日新會宿五雲山山氣清如沐林扉夜不扄月明苔徑白林暗水螢青幽蕙臨風辨孤泉過石聽何當凌絶頂萬里極滄溟許穀登五雲山名山髙擁五雲層危磴重重躡屐登西望諸天應咫尺東來疊嶂總邱陵海門遙指三山樹梵殿常懸七寶燈便掃蒼苔題短句乾坤髙覽記吾曾沈嘉則五雲山偶凌吳岫恍蓬壺直駕長風上帝都石割鴻濛秋色重路盤霄漢鳥飛無白雲東盡天連海青嶂西來日滿湖信有胡麻堪飯客荷鋤於此作潜夫秦望山咸淳臨安志兩朝國史志錢塘有秦望山舊志云在錢塘縣舊志之南一十二里一百步髙一百六十丈周回一百步晏元獻公輿地志秦始皇東遊登此山欲渡㑹稽史記始皇至錢塘臨浙江見水波之惡不能渡乃西北從狹中渡後唐同光中錢氏於秦望山建上清宮有巨石二十餘株自然成行名曰金洞門近東南有羅剎石吳越史唐咸亨中望氣者言錢塘有王氣命侍御史許渾等賫壁瘞此詩薛據登秦望山南登秦望山目極大海空朝陽半蕩漾晃朗天水紅溪壑爭噴薄江湖遞交通而多漁商客不悟嵗月窮振緡迎早潮弭櫂候逺風余本萍泛者乘流任西東茫茫天際帆棲泊何時同將尋㑹稽迹從此訪任公馬湘登杭州秦望山太乙初分何處尋空留厯數變人心九天日月移朝暮萬里山川換古今風動水光吞逺嶠雨添嵐氣泣髙林秦皇誤作驅山計滄海茫茫轉更深月輪山咸淳臨安志在龍山左右形圓如月故名萬厯錢塘縣志山峙江右江月松風集在定山北其山名月輪有寺臨江遇月尤佳舊傳張君房曽宿寺中月中桂子下塔上咀之無味中有金魚池詩余弼月輪山慧悟禪師上方孤峯牢落幾何年臺殿於今半插天巳是精藍誇絶徼更將寶塔在危巔烟霞色任隂晴變鐘磬聲隨上下傳珍重老僧無别境一生幽趣只山川白塔嶺萬厯錢塘縣志嶺峙江上仲秋十八日邑令酹江於此詩范仲淹白塔駐軒亭登臨江上寺遷客特依依逺水欲無際孤舟曽未歸前峰藏好處幽鷺得閒飛多少天真趣遙心結翠微錢惟善晚雨過白塔宋宮傳是唐朝寺白塔崔嵬寢殿前夏雨染成千樹緑暮嵐散作一江烟蒼苔門外金鋪暗細栁營中畫角傳寂寞葫蘆宮井畔野人拾得舊金鈿龍山咸淳臨安志在嘉㑹門外去城十里一名卧龍山萬厯錢塘縣志育王山俗稱鍋子山去城十里而近壁立尖聳特異諸山有臺曰登雲錢王建郊天地之所也又名拜郊臺有洞曰靈化在臺側武肅王勒壁存焉洞深百步濶十餘丈曰陽明有池曰洗馬曰鴻鴈有天龍寺唐天龍和尚開山有勳賢祠舊名天真精舍薛侃等建以祀王守仁玉津園宋建講宴射禮之所梅花巖宋時易安齊有梅巖前有龜疇田宋郊壇也明邑令聶心湯建太極亭即其處錢塘縣志育王山即龍山舊志作龍華山誤神州古史考龍山一名卧龍山又名龍華山與上下石龍相接天目分支沿江而東結撰於此蜿蜒若遊龍然郭璞所謂龍飛鳯舞者即此山腰為天真寺亦稱天真山山巔有玉皇廟俗稱玉皇山亦云育王山蓋龍山者錢氏郊天處釋老之談或云阿育王或云玉皇皆祀天帝遺意也詩蘇軾曽元恕遊龍山吕穆仲不至青春不覺老朱顔彊半消磨簿領間愁客倦吟花似酒佳人休唱日銜山共知寒食明朝過且赴僧窗半日閒命駕呂安邀不至浴沂曾㸃暮方還王銍九月二十七日與客遊龍山野服芒鞋步步同天寒酒薄客情濃身如萍水同千里路入烟蘿更幾重滄海清江共今古黃花紅葉雜秋冬瞑雲自與千峰合送我歸鞍寺寺鐘余士吉題天龍寺龍飛鳯舞兩峰回旺氣才銷梵宇開卓錫地侵迎輦地雨花臺近拜郊臺草分緑色緣城去風送江聲入寺來三百年來如昨日老禪猶說舊蓬萊朱德潤拜郊臺晚渡風揚松花落澗濵荻芽洲渚水鱗鱗莫教行到崇臺上忘却山前唤渡人周密郊丘紀事二首黃道官羅瑞腦香衮龍升降佩鏘鏘大安輦奏乾安曲萬㸃明星簇紫皇髙騎雲從簇錦圍內官排立馬如飛九重閶闔開清曉太母登樓望駕歸徐清叟梅巖二首千年奎畫照蒼霞酬唱官梅竹外斜恭想皇靈天闕上歸時猶惜洛陽花偶因紀事訪丹霞寺古山深石徑斜衝冷細尋梅信息枝頭喜見狀元花洪邁車駕幸玉津園命下大雨已而天宇豁然進詩歌咏其實五雲猶自雨如麻無限都人仰翠華翻手作雲方悵望舉頭見日共驚嗟天公的有施生妙帝力堪同造物誇上苑春光無盡藏可須羯鼓更催花曹勛從駕玉津園二首天子行春御六龍五雲回暖泛晴風和鸞寶苑梅花路賸有香傳玉座中花梢糝糝動朱欄萱草侵苔雪已乾行闕風光隨處樂春臺人物不知寒王守仁西安雨中寄德洪汝中并示書院諸生幾度西安道江聲暮雨時機關鷗鳥破踪跡水雲疑仗鉞非吾事傳經愧爾師天真泉石秀新有鹿門期王世貞謁勳賢祠杖䇿尋幽巘叩祠薦清蘋木落羣姿盡爛然見天真輕風飄鬚眉蕭蕭若有神三字抉靈機萬古意忽新六籍遂糟粕千聖歸經綸媚川在懷中舍楫問鮫人笑彼愚公山老昧襄成津重恐魚目多冥然驕自珍所以老氏嘆聖作大道湮下學而上達吾意書諸紳許應亨别業在江干鴻雁池西湖山庒在林逋宅畔浮玉潭寶蓮山又鳯凰山分派三處皆杭勝地暇日漫賦名山處處有微緣暫向明時一避喧鴻雁引江流别圃鳯凰分麓到家園越王臺畔寒潮急和靖祠前古木繁桑柘在田書在篋聊同擊壤答皇恩包家山咸淳臨安志在城南近郊壇冷水峪多桃花為春日遊覽之勝名桃花關關上舊有蒸霞二字成化杭州府志今上置山川風雲雷雨壇據江山之勝詩樓鑰包山訪客包家山相與登層巔嶙峋巨石中屈曲扶闌干夜來雨初過石潭時涓涓輕輿列岡頭大江橫吾前亭午潮方盛千艘散平川道人第三間花木羅後先朅來舊京塵曠望為洗煎山斷塔層層西陵渺蒼烟此道走邯鄲歸心更翩翩董嗣杲包家山綺霞蒸日透林梢一簇南山尚姓包冷水峪邉苔色老冲雲樓下樹隂髙園鄰古道傳耕籍臺倚青城想拜郊欲趁桃花尋隱者關門無鑰不須􅒱胡仲參包山觀桃花因訪桃花到嶺根御林春色此平分千株未數栽唐觀一幅猶堪畫晉源仙在雲間無處覔人行風外有香聞笙簫隱隱宮城隔立盡黃昏更斷魂張翥清明遊包家山二首逺近紅千樹繁開奪艷霞月明寒食雨春老上陽花輦路迷游躅宮詞入夢華東風葵麥浪回首野人家太液曾來鵠髙臺舊影娥美人黃土盡故國白雲多野草荒神籍宮蓮怨櫂歌羌兒洗馬處斜日滿寒波錢惟善六日遊包山福泉平生鹿門趣有意此誅茅地控江分越山因人姓包海鷗飛落日野馬牧荒郊流水花千樹重期載酒肴鳯凰山咸淳臨安志祥符圖經云錢塘舊治正南一十里下瞰大江直望海門山下有鳯凰門有雁池山巔石筍林立最為怪竒舊傳錢武肅王鑿山見怪石排列兩行如從衛拱立趣向因名排衙石及刻詩石上第二峰有白塔塔西有小徑青石崔嵬夾道皆峭壁中穿一洞人可往來名曰石同好事者多題名其間熙寧中郡守祖無擇對排衙石作介亭天風泠然有縹眇慿虛之意山上有聖果院側有梵天院江月松風集山頂有兩峰儼如髻形目曰鳯凰雙髻西湖遊覽志左薄湖滸右掠江濱形若飛鳯山下為吳越國治內附後為州治天峰在左月巖在右中有石同南宋建都兹山東麓環入禁苑張閎華麗委比蓬昆佳氣扶輿萃於一脈萬厯錢塘縣志山有嶺曰萬松越城三里而遙雙峰圓秀如鳯翼軒翥十許小崒貫珠下回西南向而成尊形西為御教場四顧坪排衙石竒石十許箇林立相對以名文陳隨應行宫記杭州治舊錢王宮也紹興因以為行宮皇城九里入和寧門左進奏院玉堂右中堂外庫至北宮門循廊左序巨璫幕次列如魚貫祥曦殿朵殿接修廊為後殿對以御酒庫御藥院慈元殿外庫內侍省內東門司大內都巡檢司御厨天章等閣廊回路轉衆班排列又轉內藏庫對軍器庫又轉便門垂拱殿五門十二架修六丈廣八丈四尺簷屋三間修廣各丈五朵殿四兩廊各二十間殿門三間內龍墀折楹殿後擁舍七間為延和殿右便門通後殿左一殿隨時易名明堂郊祀曰端誠策士唱名曰集英宴對奉使曰崇德武舉及軍班授官曰講武東宮在麗正門內南宮門外本宮㑹議所之側入門垂楊夾道間以芙蓉環朱欄二里至外宮門節堂後為財帛生料二庫環以宮屬直舍轉外窰子入內宮門廊右為贊道春坊直舍左講堂七楹扁新益外為講官直舍正殿向明左聖堂右祠堂後凝華殿瞻篆堂環以竹左寢室右齊安位內人直舍百二十楹左彛齊太子賜號也接繡香堂便門通繹巳堂重簷復屋昔楊太后垂簾於此曰慈明殿前射圃竟百步環修廊右博雅樓十二門左轉數十步雕䦨花甃萬卉中出鞦韆對陽春亭清霽亭前芙蓉後木樨玉質亭梅繞之由繹已堂過錦胭廊百八十楹直通御前廊外即後苑梅花千樹曰梅岡亭曰冰花亭枕小西湖曰水月境界曰澄碧牡丹曰伊洛傳芳芍藥曰冠芳山茶曰鶴丹桂曰天闕清香堂曰本支百世佑聖祠曰慶和泗州曰慈濟鍾呂曰得真橘曰洞庭佳味茅齊曰昭儉木香曰架雪竹曰賞靜松亭曰天陵偃蓋以日本國松木為翠寒堂不施丹雘白如象齒環以古松碧琳堂近之一山崔嵬作觀堂為上焚香祝天之所理宗時吳知古掌焚修每三茅觀鐘鳴觀堂之鐘應之則駕興山背芙蓉閣風帆沙鳥出履舄下山下一溪縈帶通小西湖亭曰清漣怪石夾列獻瑰逞秀三山五湖洞穴深杳豁然平朗翬飛翼拱凌虛樓對瑞慶殿損齊緝熙宗政殿之東為欽先孝思復古紫宸等殿木圍即福寧殿射殿曰選德坤寧殿貴妃昭儀媫妤等位宮人直舍蟻聚焉又東過閣子庫睿思殿儀鸞修內八作翰林諸司是謂東華門徐一䕫吳越國治考吳越國在杭州鳯凰山下其子城南為通越門北曰雙門錢氏納土後二門猶存臨安志載吳越錢氏造而不言在鳯凰山下宋政和二年孫沔守杭蔡襄為沔撰雙門記內云吳越王依山阜以為治而雙門置木石錮金鐵用為敵備沔以為非禮制改作之則錢氏宮室在鳯凰山下無疑髙宗駐驆杭州徙州治於清波門內今州治是也但宋南渡即其地為行都故後人但知有宋故都而不知有錢氏耳初錢氏以强弩射潮築隄捍國而以鐵幢識其射處以今驗之去鳯凰山僅二百許步此足為證錢氏當五季據有兩浙八十餘年亦頗有功德於民詢之故老巳不知建國之處弔古者無從質焉吳越舊有備史今亦不存因修志補其闕略云爾詩姚合杭州官舍即事臨江府署清閒卧復閒行苔蘚疏塵色梧桐出雨聲漸除身外事暗作道家名更喜仙山近庭前藥自生白居易郡亭平旦起視事亭午卧掩關除親簿領外多在琴書前况有虛白堂坐見海門山潮來一慿檻賓至一開筵終朝對雲水有時聽管弦持此聊過日非忙亦非閒山林太寂寞朝闕空喧煩惟兹郡閣內囂靜得中閒虞舜卿吳越國治懷古巾子山前大士來虛疑强弩射潮回素車忍犯鴟夷怒錦樹還依仙姥栽寶剎滿城懸日月大江截地走風雷由來霸氣慿天險漫倚金幢鎮劫灰孫覺介亭真人昔未起奔應駭四方連延天目山兩乳百里長有地跨江海無種生侯王中宵燎穹旻列石表壇場朱旗大梁野英氣通八荒寥寥百年後故物亦已亡所餘彼巉巗峰巒屹相望主人承明老星斗主文章築亭紫霄上坐客蒼林旁攀雲弄明月曉星出扶桑禹山隔波濤簡書永埋藏願逢希夷使水土還故鄉沈遘排衙石盤崕絶巘與天通汗漫烟霞謝世籠聳起浮圖山突兀自然衙石玉青葱古人興廢千年上遊客登臨一嘯中誰為燕然愧班竇孤城霸據亦銘功趙抃中和堂老來重守鳯凰城千里人心豈易平樂職古賢形嘆頌中和終不為虛名趙抃介亭介亭羣石似飛來深插雲根兩兩排占得羣峰最髙地翠姿何處有塵霾蘇軾豫前後守倅杭凡五年夏秋之間蒸熱不可過獨中和堂東南頰下瞰海門洞視萬里三伏常蕭然也紹聖五年六月舟行赴嶺外熱甚忽憶此處而作是詩忠孝王家千柱宫東坡作吏五年中中和堂上東南頰獨有人間萬里風蘇軾登介亭次劉景文韻澤國梅雨餘衰年困蒸溽髙堂磨新磚頗覺利腰足松根百尺井兩綆飛净渌流觴聚兒童一笑為捧腹清風信可馭剛氣在巖麓始知共此世物外無三伏長歌入雲去不待弦管逐西湖真西子烟樹㸃眉目濤江少醖藉髙浪翻飛屋俯仰拊四海百世飛鳥速逺追錢氏餘近弔祖侯躅吾生如寄耳寸晷輕尺玉誰似劉將軍逸韻謝邉幅千言一揮手五車不再讀春巖彩雞舞月峽哀猿哭朝先鶗鴂起暮與寒螿續我老廢吟哦賴君時擊觸從今事逺覽發軔此幽谷清游得三昧至樂謝五欲莫作狂道士氣壓劉師服蘇軾登介亭餞楊傑次公藍輿西出登山門嘉與我友尋仙村丹青明滅風篁嶺環珮空響桃花源前朝欲上已蠟屐黑雲白雨如傾盆今晨積霧卷千里豈畏觸熱生病根在家頭陀無為子久與青山作弟昆孤峯盡處亦何有西湖鏡天江抹坤臨髙揮手謝好住清風萬壑傳其言風回響答君聽取我亦到處隨君軒錢惟善鳯凰雙髻鳯來天目憩東南瓊樹巢空百鳥慚千仭翱翔秋綰髻兩髦􅠄鬢暮棲嵐誰嘲風落烏紗帽自惜山為碧玉篸仙女洗頭休望嶽相期岸幘對虛談王逢鳯凰山登宋故宫遺址金爵觚稜月向低泠泠清磬萬松西五門曙色閒龍尾十日春寒健馬蹄紅霧不收花氣合渌波初漲栁條齊遺民暗憶名都㑹尚繞湖漘唱大堤貫雲石休暑鳯凰山路隔蒼苔卒未通泉花如髮玉濛濛蛟浮海近雲窗濕蛟怯山寒葛帳空髙枕不知秋水上開門忽見暮帆東物華萬態俱忘我北望惟心一寸紅王守仁御教場絶頂秋深荒草平昔人曽此駐傾城干戈消盡名空在日夜無窮潮自生谷口巖雲揚殺氣路邉疏樹列殘兵山僧似與人同興相趂攀蘿認舊營鍾淵映過宋御教場址是纍朝觀潮處作尚憶宸游處嚴城列㑹同觀濤臨曲水馳道擬回中翠蓋朝承露芝旗晚引風言驅七萃士齊試六軍雄將帥咸思奮君王自即戎馮夷朝幕府羅剎蔽艨艟松下秦王輦雲間夏后宮瑞烟浮五色仙樂聽三終白馬來何疾吳兒技最工拔河傳往事超距倐乘空噴薄凌春雪氤氲接彩虹蜃樓從地湧鮫市與天通雜奏魚龍戲仍論校獵功湖山方晏㑹襄漢巳交攻苑走胥臺鹿人悲朔塞鴻驚沙屯鐵騎髙栁掛雕弓潮汐還從北江流不向東御隄塵颯颯蹕路草芃芃漁父留金鏃征人走玉驄平生懷古意悽惻感飄蓬毛先舒南宋宫詞二首花接凝華路逶迤東宮官屬美丰儀春遊博望行聫騎月出西園坐賦詩石筍排衙御教營山頭北眺汴梁城君王無日忘神武月朔登操女子兵月巖咸淳臨安志鳯凰山之上為月巖有亭曰延桂武林梵志聖果寺有通明洞放光石飛龍石飛雲洞上天梯觀溦石許僧泉卧醉石歸雲洞躍雲石竹塢檀欒齊乘鷖閣諸勝循級而上為月巖七修類藁江干鳯凰山有石如片雲拔地數丈有一竅尺餘名曰月巖惟中秋之月穿竅而出餘月則斜聖果寺志羣玉瓣瓣攢立宛然如削壁鐫題咏漶滅過半如髙大光明光影中天本來面目皆蔡襄題石門月巖無影相楊孔思題夕照通明方九思題詩趙師恕月巖眷此巖壑勝領客共登臨危棧臨石側巘途歷崎嶔俯仰極髙低上下窮幽深來登空明山千崖正沉沉下瞰青羅江古木鬱蕭森清風萬里來層雲蕩孤襟有客可共賦有酒可自斟此景豈易得此樂豈易尋吾生今老矣遁迹歸窮岑一櫂下瀟湘此别意難任别後無相忘詩成寄郵音陳天瑞題月巖怪石堆雲矗太空女媧煉出廣寒宮一輪常滿隂晴見萬古無虧晝夜同搗藥聲繁驅白兔漏天孔正透清風光明自照如來境肯學嫦娥西復東沈捷月岩月巖有月竇疑是鬼神鐫髙擎石之秒空洞徑尺圓日月出沒時光彩皆斜穿獨是中秋夜竒景不可箋以月嵌月竇分毫不爽焉老僧指示豫豫初疑浪傳襆被約友人候月勝果巔童僕性狂躁數往驚否然直至夜將半明月當中天月循竇中入地下玉鏡旋人繇竇中視天上合璧懸攜月就心印快覩舊物還太息山下宿勿復疑山川吳農祥月岩月色雲巖好遲回每夜䦨光從牛斗發影落兔輪寒萬里清輝滿三秋早露溥更依危徑立遙入亂峯看蟋蟀吟逾苦蒹葭色未乾空汀浮島嶼宿火照江干古殿摧金谷殘碑陷石壇吾生從夙願同爾問漁竿臣謹案聶心湯邑志載江上之山以上數山而外支𣲖甚多粟山西為焦山觀山白巖山石龍山茱萸尖石灰嶺黃山之支為柏子尖山牛方嶺百丈山焦山之支為馬鞍山黃山阪白巖之支為九里暗山眠牛山青山石龍之支為解頭山鯉魚山旋井山長山茱萸尖之支為瓜藤山神仙石和尚山羅帶山皆屬沿江今俱不録略存梗概於此吳山咸淳臨安志在城中吳人祠子胥江上因名曰胥山名勝志春秋時為吳南界以别於越故名吳山西湖遊覽志天目山翔舞而東結局於鳯凰山其支山左折遂為吳山竒崿危峰澄湖靚壑江介海門回環拱固扶輿淑麗之氣鍾焉萬厯錢塘縣志南山嶐峙女墻亘其上入城蜿蜒二里許曰吳山拾級上百武亭亭闤闠中前俯大江回望浩渺麓有寒泉諸山東南面江蔓衍相屬欲峙欲伏若續若斷屆城而上總曰吳山演繁露潘同浙江論云胥山西北舊皆鑿石以為棧道唐景龍四年沙岸北漲地漸平坦桑麻植焉州司馬李珣始開沙河胥山者今吳山也而俗訛為青山其圖經云沙河塘在城南五里此時河流去胥山未甚逺故李紳詩曰猶瞻伍相青山廟又曰伍相廟前多白浪景龍沙漲之後至於錢氏隨沙移岸漸至鐵幢今新岸去胥山巳逾三里皆為通衢居民甚衆此皆圖經之言至宋紹興間紅亭沙漲其沙又逺在胥山西南矣神州古史考吳山古臨江至今俗稱浪網山山下有漾沙坑洋壩頭今則去江十里西湖志吳山大觀臺每當秋濤初壯東望海門汪洋澎湃直趨冨春然後潮平岸濶風正帆懸一舉目間江山如畫西湖志纂大觀臺為吳山最髙處康熙二十八年聖祖仁皇帝南巡御製登吳山絶頂詩左控長江右控湖萬家烟火接康衢偶來絶頂慿虛望似向雲霄展畫圖三十八年聖祖再幸御製登吳山詩重經層巘暫停鑾天日晴和覽眺寬城市萬家烟火近念茲莫遣有饑寒並恭摹勒石建亭於大觀臺上乾隆十六年三月初二日皇上省方至浙臨幸吳山御製恭依皇祖吳山詩韻詩崇巘襟江復帶湖俯臨萬井樂亨衢百年休養三朝澤繼述豫懷凛永圖又御製吳山大觀歌我遊名山亦巳多吳山大觀今作歌興安大嶺及長白嵩泰臺麓田盤窩諸山未兼江海勝此間曠覽俱遮羅南北髙峯走龍脈蜿蜒入郡成嵯峨琳宮梵宇許居下不許墻宇盤尖螺平列坎石鎮火患風從其俗無煩訶第一峯頭縱遐矚壯哉所見真無加左江右湖互環抱海氣蓊匌含羲娥維水有四三已具故富魚族蛟黿鼉天吳陽侯時出沒列缺豐隆相蕩摩吳顛越躓閲興廢宋遷元代紛誵訛只賸吳山青不磨吳山大觀今作歌二十二年翠華重幸御製乾隆丁丑仲春南巡再依皇祖吳山詩韻詩罕罼重臨明聖湖吳山先此陟雲衢萬家烟火滋繁庶足食足衣慎後圖二十七年皇上三幸江浙御製壬午暮春之初三依皇祖吳山詩韻詩南眺長江西盻湖城中陟巘歷香衢寧因玩景賡前韻曰在觀民有本圖又御製三月朔日登吳山作歌詩一峯婉娫走郡城衆峭攢簇羅大屏若有若無尋棧升造極廣厦原平陵何須勒馬誇豪情惟願衆庶恆安寧西湖下視如急待吾方未暇將觀海詩陳允平登吳山登山一展眺宮樹鬱嵯峨樓閣春風滿東南王氣多青天行日月大地布山河栁色沙堤路時聞響玉珂施樞至日謁廟吳山見日初出曦龍浴海出扶桑雲表輝芒燭萬方史館繽紛書瑞色禁城奕耀鎖祥光從知繡線添紅影獨喜丹心向太陽節裏官閒無一事諦觀易道靜焚香方嶽修胥山路兩山壁立束微行石齒參差半已傾莫等危時扶使穩但逢險處放教平一毫以上諸人力半月之間樂事成安得坦夷三萬里家家門外是鵬程方回次韻夾谷子栝吳山晚眺三首詩眼書胸碧宙寬暮天搖落縱遐觀霜明楓葉紅於染春㸃梅梢玉不寒北望遙迎書雁至南烹屢饜膾魚殘一規明月懸江海幾許人家夜枕安鶻飛欲沒海天寬萬動盈虛靜處觀一畫微陽迎日至九疇休範驗時寒世間劫火灰何恨物外仙碁局未殘好與蒼生司性命五風十雨報平安落木蕭蕭澤國寬偶舒巖嘯縱川觀六鰲海濶征帆逺萬象天低步屧寒旅泊餘生箄食菲宦遊舊味甕虀殘達人不墮牛山淚何待將心與汝安趙孟俯吳山城上髙樓接太霞令嚴鐘鼓寂無譁提疆內向三千里比屋同封百萬家心在江湖存魏闕身隨牛斗泛仙槎舉頭便覺長安近時倚䦨干望日華薩都拉錢塘驛樓望吳山仙居時復與僧鄰簾幕人家紫翠分後嶺樓臺前嶺接上方鐘鼓下方聞市聲到海迷紅霧花氣漲天成綵雲一代繁華如昨日御街燈火月紛紛貢性之咏吳山景鸞翔鳯翥枕江流秀奪江南第一州螺髻巧盤雲外影娥眉深鎖雨中愁舞衣春賜鴛鴦錦歌扇晴翻翡翠樓寶馬香車遊冶子賞心誰不為遲留楊載吳山晚眺山椒翬搆四垂寬上相旌旗曽覽觀傍近江湖天廣大上連星斗地清寒龍宮永鎖函書閟鳯嶺重嗟苑樹殘此際獨無雲蔽日正宜翹首望長安張輿晚遊吳山次韻羅綺連雲幾萬家黃昏樓店尚紛譁珠簾十里卷明月銀燭萬條生紫霞塵帶花香隨去馬街連樹色引歸鴉閉門不作華胥夢卧聽江聲走白沙沈謙吳山曉望歌吳山突兀氣旁礴下瞰錢塘水波惡第一峯頭雞始號羣星未落金盤髙須臾赤熖射江水南北千山忽青紫海門堆雪蛟龍吼小兒看潮今白首嗚呼雪浪空崔嵬吳越興亡誰是非嚴我斯登吳山絶頂放歌鳯凰嶺畔吳山髙鳯凰嶺下飛江濤江雲片片白如練江風八月聲怒號有客攀蘿踞峰頂手弄青霞白石冷嵯峨崇觀連天髙俯瞰鱗鱗千萬井中有道士華陽巾琉璃之盞松花醇拂拭南忩青玉簟殷勤邀我傾千巡回首西湖西子面翠黛明粧光灔灔木蘭雙槳嬌晴波桃花玉勒如飛電須臾黑雲起雷峰吹笙雨腳掛晴空疑是秦王渡海時驅山鞭石形離竒又如萬弩射江潮轟車蹴浪黿鼉驕當筵四顧駭心目淋漓急酒杯中緑尊前狂客呼李謨橫吹玉笛撼山朩笛聲遙遙動江濱吹入江天萬里雲忽然雲端起好月銀樓玉闕何氤氲不見蘇公巳往風流歇處士亭邉芳草沒湖山變幻須臾間何必滄桑人代别我今不飲胡為乎城頭落月空啼烏臣謹案吳山隆峙城中去江稍逺然子胥沒為濤神胥山之名實由此肇且其山自鳯凰左折前臨大江江介海門回環拱固實一郡勝概也故録之艮山西湖勝蹟記自龍山沿江而東環沙河而包括露骨於茅山艮山皆其護沙也詩厲鶚五月二十五日艮山門外晚眺吳天入時凉似水夾衣出城三四里城角逺山青半環分得濃嵐落漁市荒陂繚繞行何求雲影水中凝不收蓬科誰與作都祭隂森大樹堪蔽牛幾家叢薄徑微窄稚髦闖籬窺過客棕櫚散葉覆深井薜荔牽絲護欹壁喜聞田水夜初滿不道瓠花朝更坼半虹忽墮橫一橋恰當髙處風刁騷四天萬緑染未銷峯尖黃鶴如可招畫本髣佛臨山樵深林絶澗藏過雨山中茅屋愁漂搖道旁日暮紛惆悵白荷欲語嬌相向斜倚珠盤踏寒浪菰蒲低處見船行弭櫂無人能一訪我時小極因廢書消憂起病兩有餘但思臨平考古蹟安得湯鎮謀村居朝廷蠲租詔寬大官府勸農意樂胥攜孥亦可號蠶室息影頗愛開蝸廬試歌元豐嵗連稔姓氏何必聞鄉閭海塘録卷七
