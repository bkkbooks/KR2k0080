body:
  text: 欽定四庫全書海塘録卷十九內閣中書翟均廉撰藝文二表國朝魚鱗石塘工成謝表常安海濱城社全藉隄防澤國田廬恆資塘岸惟杭城當江海交會而寧邑尤潮汐頂衝雪浪排山民有沮洳之患銀濤激顙人多陷溺之虞七郡倣徨三吳震恐蒙世宗憲皇帝痌瘝在抱屢事興修我皇上繼述為懷發帑建築特簡大臣以資區算廣選羣吏以效趨蹌擇險搶修隨宜補築既竭一時之碩畫復籌久逺之良圖爰允廷議創建石工築塘六千餘丈計里一百有奇排樁若馬齒之毗連疊石似鱗魚之櫛比根基鞏固儼若長城表裏堅凝真同峭壁大工全竣逺近歡呼巨績告成兵民忭舞此實睿謨廣運聿昭奠定之功聖澤覃敷丕著平成之績從茲閭閻康阜永沐雨露洪仁宜其兆庶歡歌共切高深頌戴深荷一人有慶願祈萬夀無疆石塘工成謝表陳世倕竊惟仁寧鹽平四邑大海汪洋非築塘豈能捍禦長隄綿逺惟壘石庶固根基前蒙世宗憲皇帝念切民生雖萬千帑金不惜恭惟我皇上德隆繼述至八年巨工告成一百里浪擊潮衝盡荷金城之固六千丈蟬聨櫛比皆成鐵塹之堅排樁若馬齒之齊疊石似魚鱗之次大僚持籌運算帑不虛糜執事竭力殫心工多堅實衆夫應募窮黎藉力役以膳其家庶職投工多士共馳驅而勷厥事茲者興歌底定不煩挽弩以射潮快覩成功何用囊沙而壅水萬姓頌安瀾之慶聖德開天千秋懷已溺之恩神功奠定白馬息銀濤之浪黃龍卧錦漲之波世倕等世𨽻編氓永戴皇圖鞏固情殷桑梓倍欣闓澤覃敷狀進海潮賦狀唐盧肇朝散大夫持節歙州諸軍事守歙州刺史柱國賜紫金魚袋臣盧肇謹進上海潮賦一首臣伏聞神農立極先定乾坤軒后統天始治厯象蓋以大聖有作而大法乃眀必自臣子之所為克成君父之至德只如陳韶奏夏允諧聖帝之音而伐鼓鏗鐘元在工人之手業雖成於微賤事乃表於皇王臣今所陳竊用此道伏惟睿文眀聖孝德皇帝陛下德邁伊媯道包覆載垂裳而九有無外執器而萬國來庭日月貞眀天地交泰珍圖瑞物允膺得一之符伯益皋繇共佐十年之聖臣實陋賤亦忝方州而微臣始自知書志在稽古或觀天地之道得於經史之間既察置圭亦聞測管究黃鐘於玉律窺碧落於璿樞伏念司馬遷則書載天官張平子則儀鈞地軸臣仰遵前哲輒揆圓虛偶識海潮深符易象理皆托實事盡揣摩既當鳳紀之朝願陳蠡測之見臣肇誠惶誠恐頓首頓首臣又聞天垂象而六合成道生一而三才具皆由日月運乎隂陽是謂神眀分乎晝夜伏知此道盡在陛下睿鑒之中故不俟微臣因此别白然自古以來莫不以地厚難測日既入而人不見其行海大無涯潮生而人不知其候上古聖人則之於八卦學者演之成六家而有􅊰論未眀根本不究天垂大法假乎微臣獲在聖朝敢彰愚見臣門地衰薄生長江湖志在為儒弱不好弄研求近代寒苦莫甚於斯臣伏念為業之初家空四壁夜無脂燭則爇薪蘇曉恨頑冥亦嘗懸刺在名場則最為孤立於多士則時賢獨知纍竊皇恩遽變白屋臣於會昌三年應進士舉故山南節度使同中書門下平章事王起擢臣為進士狀頭筮仕之初故鄂嶽節度使盧商自中書出鎮辟臣為從事自後故江陵節度使贈太尉裴休故太原節度使贈左僕射盧簡求皆將相重臣知臣苦心謂臣孑立全無親黨不自吹噓悉賞微才奏署門吏臣前年二月蒙恩自漳關防禦判官除祕書省著作郎其年八月又蒙恩除倉部員外郎充集賢院直學士去年五月又蒙恩除歙州刺史臣謹行陛下法令常懼有違理郡周星未有政績被百姓詣闕以臣粗能緝理求欲留臣七月二十二日敕又蒙聖恩賜臣金紫臣素無強近之援不異草澤之人忽荷寵光及此叨忝臣不以生平志業上奏於宸慈實懼犬馬之微忽先於溝壑則臣積年無所闡揚非唯自負片心實亦上辜聖代是敢竊以所撰前件潮賦并圖進上臣為此賦以二十餘年前後詳參實符象數願以潢汚之水輒赴溟渤之流而雕蟲所為刻鵠難肖塵冒天聽罪當鼎鑊今差軍事押衙盧師洎隨狀奉進上黷宸嚴敢期睿覽臣肇無任惶懼戰越屏營之至謹録奏以聞伏俟誅責乞相度開石門河狀宋蘇軾謹按史記秦始皇帝東遊至錢塘臨浙江水波惡乃西百二十里從狹中渡以此知錢塘江天下之險臣昔通守此邦今又忝郡寄二十年間親見覆溺無數自溫台眀越往來者皆由西興徑渡不涉浮山之險時有覆舟然尚稀少自衢睦處婺宣歙饒信及福建路八州往來者皆出入龍山沿泝此江水灘淺必乘潮而行潮自海門東來勢若雷霆而浮山峙於江中與漁浦諸山犬牙錯入以亂潮水洄洑激射其怒自倍沙磧轉移狀如鬼神往往於淵潭中湧出陵阜十數里旦夕之間又復失去雖舟師漁人不能前知其深淺以故公私坐視覆溺能自全者百無一二性命之外公私亡失一嵗凡幾千萬而衢睦等州人衆地狹所産五榖不足於食嵗常漕蘇秀米至桐廬散入諸郡錢塘億萬生齒待上江薪炭而活以浮山之險覆溺留礙之故此數州薪米常貴又衢婺睦歙等州及杭之富陽新城二邑公私所食鹽取足於杭秀諸場以浮山之險覆溺留礙之故官給腳錢甚厚其所亡失與依託風水以侵盜者不可勝數此最其大者其餘公私利害未可以一二遽數臣伏見宣德郎前權知信州軍州事侯臨嘗往來江濱相視地形訪問父老參之舟人反覆講求具得其實建議自浙江上流地名石門並山而東或因斥鹵棄地鑿為運河以達石門新河若出定山之南則地皆斥鹵不壞民田及自新河以北潮水不到灌以河水皆可化為良田然近江土薄萬一數十年後江水轉移河不堅久若自石門並山而東出定山之北則地堅土厚久逺無虞然度壞民田五六千畝又失所謂良田之利體問民田之良者不過畝二千以錢償之亦萬餘緡而已此二者更乞令監司及所差官詳議其利害又引浙江及溪谷諸水凡二十二里有奇以達於江又並江為岸度潮水所向則用石所不向則用竹木凡八里有奇以達於龍山之大慈浦自大慈浦折北抵小嶺下鑿嶺六十五丈以達於嶺東之古河因古河稍加浚治東南行四里有奇以達於今龍山之運河以避浮山之險度用錢十五萬貫用捍江兵及諸郡廂軍三千人二年而成凡福建兩浙士民聞開此河萬口同聲以為莫大無窮之利今建此議不知者必有二難其一不過謂浙江浮山之險經厯古今賢哲多矣若可平治必不至今日此乃巷議臆度不足取信只如龜山新河易長淮為安流近日吕梁之險似聞亦已平治豈可謂古人偶未經意便謂今人不可復作其一不過謂並江作岸為潮衝嚙必不堅久今浙江石岸亦有成規自古本用木岸轉運使張夏始易以石自龍山以東之江水益深石岸立於漲沙之上又潮頭為西陵石磯所射正戰於岸下而四五十年隱然不動今自大慈浦以西江水皆露出石腳而潮頭自龍山轉向西南則岸之易成而難壞非張夏所建東隄之比也書答高起岩論潮書元吳亨夀至元十八年秋八月十有八日足下觀潮浙江亭眀日書以遺豫若疑於逆流之水有可詰者朱子注騷為潮以月加子午之時一日而再至則亦未嘗無説敢為足下誦所聞焉蓋坎本月之體月本水之精月與水一而已矣在天為月在地為水天有隂陽太少而月為太隂地有剛柔太少而水為太柔古人以方諸取水於月其氣類固相感也而況夫子午之位乃隂陽之始於其所始而月加焉則隂與陽感而隂以升隂與隂遇而隂以盛水隂類也當其所加之時湧而逆上從其類也月一晝夜凡一加午故潮一日再生月一日退天十三度十九分度之七故潮日遲於一日所以初三之潮晝遲而入十八之夜十八之潮夜遲而入初三之晝也一月之間生眀生魄潮亦再盛焉生眀之潮則自前月二十六長水謂之起信厯晦朔至月初三謂之大信初四潮勢漸殺謂之落信厯上弦至月十日謂之小信生魄之潮則自十一始長厯望至十八而盛自十九始殺厯下弦二十五而衰其起落大小之信亦如之天下之至信者莫如潮生落盛衰各有時刻故潮得以信言也月於一月之間漸遲而縮一日潮於兩信之內漸遲而縮兩潮秋月最眀秋潮最盛亦其理然也又嘗即易考之坎為月魄離為月魂震生眀也兑上弦也乾望卦也巽生魄也艮下弦也坤晦卦也生眀之盛非無故而盛也坤一索而得長男故盛過兑少而往則衰矣生魄之盛亦非無故而盛也乾一索而得長女故盛過艮少而往則衰矣驗之於月參之於卦潮之理其殆庶幾乎或曰誠如是則陽之盛莫如乾隂之盛莫如坤潮不於是焉大而顧大於震眀巽魄何耶曰茲又先天後天之説也不本諸先天無以見造化之全體不參諸後天無以見造化之妙用先天之卦體也乾坤離坎位於四正震巽艮兑位於四維而月之周天實配之後天之卦用也退乾於西北退坤於西南父母老而不用而長男代父長女代母居東南生長之方天地間萬物萬事咸於此乎權輿故其為氣也莫盛焉而潮之大信實配之月配其體則陽為眀隂為魄而乾坤當望晦之位乃隂陽之極也潮配其用則長為盛少為衰而震巽當大信之候乃隂陽之長也夫如是則其不乾坤而震巽也有由矣或又曰亦何以知其必取於卦耶曰以納甲家啓之納甲者如生眀之月昏出於庚震則納庚生魄之月晨見於辛巽則納辛之類是也隂陽者流用之率驗則月與卦相為用也審矣潮而有取於月也不亦有取於卦乎哉或又日月之説然邪則潮之為候亦宜月半以前有微漸大月半以後有大漸微以象夫三五而盈三五而虧可也今乃與眀魄之生兩盛焉何哉曰眀魄之盛固已如前所云然月一月一周天而一日之內則一加子一加午者也潮於月加子午之時一日再至故亦於月生眀魄之日一月而再盛焉月之一潮之再若不相似而實相感召非深於理者未易以語此或又曰子所論浙江潮也他江亦有潮其遲速不同何與曰潮之生必生於月出之海浙江之去海為近故其至也如時他江所去有逺近故所至有遲速耳或又曰古今言潮者必推浙江亦謂銀山雪屋有頭數丈此為異爾他江之潮第如湧水復與此不同何與曰浙江去潮生處近掀天沃日之勢方盛而不可遏赭山龕山橫鎖江口頓然斂寬就窄其勢必至於衝激奔射也他江去潮生處逺逺則必殺故但湧水而巳又何疑焉覆耆民汪源論設塘長書明任三宅連年修西北二塘責重塘長而空名應役漫不經心以致漸成大患愈難捍禦呈院乞將附塘殷實戶丁報充塘長十二名每名於帶征七分之內取給工食七兩二錢量分塘岸著令巡管遇坍便修如遇風潮叵測縣照例分築而宅以為未盡善也夫北塘之所禦者海也海沙漸漲輒十餘里潮逺不及而塘自不坍往厯數十年可以無議修築逮海潮對塘一衝則沙泥蕩漾而塘即潰壞延袤幾千餘里邇來頻年修築官費其一民費其十度支奚下萬金即今名曰告成方且役民增補嗣今而後不知作何底止倘海沙仍漲而塘果不坍天之賜民之福也雖不設塘長不給工食無害也倘潮又對衝而塘又決天之災民之禍也必非十二名之塘長所能支吾以捍禦也為今之計草二都草三都附塘居民似不當概責以西塘之役以待殷實逺令其専力分管北塘遇有線隙隨即修葺猝遇風潮大患自當通力合築并移山會協濟不可専責管塘人戶也議修築海寧縣海塘書明張次仲衆水皆滙而歸於海海不見其盈海一衝決則大地皆被其害如吾寧邑之海不過大海之一支流耳而潮衝沙齧人民田廬立見湮沒者蓋右承宣歙以下衆流之水左納蘇松外洋諸海之流西則龕赭二山南北對峙夾為海門為海入江之口東又有石墩大小尖山遌立海隅為海入寧之口潮自東起厯乍澉二浦而來厄於近洋八山之內江自浦陽西瀉厯嚴灘至錢江而出巖亹厄於龕赭海門之際其進甚狹勢迫束而相擊其來既逺勢洶湧而必怒夫是以湍激淜湃而有衝決之患也邑治瀕海適當交衝之會城南百武即界為海塘塘起仁和至海鹽相距百里其近城數十里之間以尖山東鎖赭山西鍵拱抱而突出於外邑城在兩山中之北三隅鼎立邪衝注射而城外為海之隩隈且潮奔入巖亹扼於江流之注則激而復北不可遏禦此數十里者三靣受敵故塘之潰壞恆見於此也豫幼嘗閲邑乘宋寧宗嘉定十二年潮衝平野二十餘里蜀山淪於海十五年又城南陷地四十餘里元仁宗延祐元年海溢陷地三十餘里眀成祖永樂六年海決至成化十三年海決前後陷地六七十里心竊異之幅員雖廣而可屢蹙於洪濤之陷割乎及年逾弱冠南望漲沙三十餘里桑麻成林去海逺甚越十年臨海僅百步矣嗣是或漲或決屢屢改觀始歎桑滄遞變亦勢之無可如何者吾謂天下大患有莫可如何者三如邊患河患海患是也自古治之無有上䇿蓋勢處於不可測而患生於不及料惟有來則禦之去則備之先事而隄防者計畫之周耳其計畫之最要者莫先于儲餉餉不預儲一旦變生東支西應補苴無䇿欲待給於朝廷則緩不濟事欲派費於編氓則散而難紀遂欲借支庫銀以濟急需徐用派徵田畝以償那移而朝三暮四中多乾沒而民受其病矣海寧地形踞嘉湖蘇松常鎮六郡之上流寧受海患六郡亦不得安枕無憂也故各郡皆有協濟之銀輸以儲用昔嘉靖時邑尹嚴寬建議嵗儲徭役銀三百兩以此二者存貯不為他用幸邀天祐十年無患可積金萬有數千一旦患作乃不為無備當平居無患時每遇潮汛遣廉幹吏民巡視遇有沙瀨洊浸小隙即領銀窒補以杜其隙千丈之隄敗於蟻穴若九河盈溢非一凷所防宜早為之慮也其次則在制度昔之善於為備者慮海濤之衝激為蕩浪木樁以砥之慮潮勢之剝蝕為疊石斜階以順之故所取之石不必盡大斫木為匱廣長尋丈納石其中則小石可化為大織竹為筏環筏為囤聨絡牽制少亦可化為多此漢武帝伐竹為揵填實土石以塞瓠子河之遺意也繚絙以投海中斥鹵浸漬糾交不解外箝以蕩浪木樁而上鎮以博厚之石如廉司楊瑄之制崇厚以捍其勢斜披以順其流近視之橫亘如虹逺望之崇峙若墉庶可弭災而捍患乎至於酌用民力照十家牌循環更代必人與薪米節其勤苦而惜其寒暑民亦樂為效力矣所慮任事之人惜功愛財茍且而不為長久計故弭患而患日生必殫心萃力使吏不作姦民不偏苛期於實濟而後已如是稍有潰決隨時塗敜亦易事也夫海之決也有內河可開以殺之庶不泛濫而多虞今近北邑城無內河可開而備水土塘可堅築培高以護其內地疏通七里三里陳文馬牧達下河諸支港置閘遞減以殺其橫流此亦因地制宜之法也聞建議者有欲以新樁易舊樁舊樁深固不拔易之則撥其基矣有欲以土石改修舊塘者新加土石不若舊之堅固改則有間可乘矣此説之斷不可行者也築塘以石自吳越王始石必培之以土人貪近便每剝附塘之土加之使高是猶剜肉醫瘡瘡究無補徒增潰爛耳深濬運鹽河亦可殺潮勢然河址與塘址相比深濬則海滷滲入而易潰此皆治塘者所當戒也至於財用多寡視主治之人當巡撫徐栻時海決塘傾始議費三十萬行海料度約十六萬衆議駭譁新尹蘇湖初至廉敏有材四閲月功成止用十萬有奇由是觀之財用多寡豈有定乎視善為謀者酌用之耳夫海患雖多不測人事修足以勝之昔吳越王錢鏐率衆董治潮怒急湍版築不就採山陽之竹以為箭煉剛火之鐵以為鏃命強弩五百人射潮潮乃退雖其德不及成康治不若文景而割據自雄帝制數郡要非高義足以服人何克致此若專恃其強武即用五千人海若其畏之哉此事在省會近而可徵者也若夫神道之説昔人不廢惟在立誠以動之無感不應奉訓大夫杭州路判官張仲儀海寧潮溢田畝廬舍多遭陷沒仲儀憂之以特牲禱於海神曰民非田不食非廬無以居神忍化民為魚鱉宫邪即為魚鱉宫神將何依吾恐神不自寧也禱畢親沉石水中健卒繼之未幾海復為地張真人裔孫與材朝觀歸至寧適潮患大作沙岸百里蝕齧殆盡延及城下與材投鐵符於海中踊躍而出者三雷電晦冥殱一魚首龜身長丈餘者於水靣岸復故常浙省右丞相脫歡因海岸衝決民心甚恐躬詣上天竺祈禜于大士仍請普福法師宏濟建水陸冥陽大會七日夜宏濟冥心觀想取海沙詛祝之率徒衆遍擲其處足迹所及岸不為決此皆寧之已事也要由精誠所格神亦感通理之固然無足異者蓋前事為後事之師弭患當預防其備誠得眀敏無私之人實心經理而迪德省愆以格天心亦何海患之足慮哉國朝與巡撫范承謨論修塘書柴紹炳愚聞天下有三塘河南有防河之塘湖廣有防江之塘浙江兼有防江海之塘此皆大利大害所在也而在浙言浙又於今日之事則海塘為切塘之逺者勿論若圮而重修則唐之開元宋之淳熙元之泰定致和其事徵諸郡乘至眀初及季海變凡六永樂辛已成化甲午𢎞治壬子嘉靖戊子萬厯乙亥崇正已已或溢或決屢費修築可得而紀者乙亥之役為詳焉顧塘在沿海惟鹽官賴之而識者以塘大決裂即嘉湖而下不免波及者何與按志稱海寧於吳為陲於越為首地形最高故境內麻涇落塘長水塘諸水皆從北流一從東北由浙泖趨滬瀆江入海一從正北過吳江趨白茅港入江俗因指吳江塔巔與長安壩址相並則海寧之地高於他郡邑甚眀故海寧之塘一決不止水注彼諸處如建瓴然將松蘇猶恐被殃而嘉湖屬邑其剝膚之災矣然則障海昌者即所以保列郡塘之關於東南利害豈不巨哉乃者仲秋之朔颶風陡作連數晝夜海波由是怒生堤塘橫決沿海土田廬舍沒為巨浸人民失業誠斯土之一厄會也執事憫然念之亟圖修繕以寧邦宇而因詢及芻蕘集思廣益愚本杜門寡聞且未嘗親履其地不能指畫形便聊據往牒揣近事粗陳末議以資博採之萬一可乎一曰集資方今公帑不敷民力更竭故工役估費不可浮縮太過過於浮則為胥吏冒破過於縮則其事難辦茍且完工未幾輒壞必有任其咎者至酌定所須若干奏支官銀外不無量派民間宜倣舊例協濟勸諭蘇松隔屬姑置之嘉湖諸邑於此塘利害相關自當檄令捐資助役大率海寧任十之七諸邑共任十之三可耳二曰聚財蓋修築之用木石為先泥土可隨地而給木石必預購轉運不能猝備也如慮海濤湍激必須蕩浪木樁以砥之其樁宜松不宜杉惟松入水經久也故事采石一塊長五尺二寸高濶各一尺八寸者其工價水腳應照時估給發使匠役樂趨石採於近山木購於上江他物料俱應時取齊則興工無乏矣三曰任人此一大役雖執事躬督其上猶藉廉幹有司相與協理并就佐二胥吏及邑之耆老解事者選擇委之俱以禮敦遣厚畀廩糈其夫匠使什伍相司按籍有考計工給值勿容侵尅總理者約塘若干里每人各認丈尺以難易為多寡查照字號給銀董役刻期齊作以其勤怠堅瑕分别賞罰庶事有責成無築舍道旁之弊也四曰鳩工工有難易不等如水勢方橫決口難塞委以草土辟諸精衛填東海直無何有耳舊用漢楗絙法不就乃斷木為大匱編竹為長絡中實以石引而下之泛濫有定築塘之法外當先植木樁其疊石下則五縱六橫上則一縱二橫石齒鈎連若絙貫然即百計撼之不搖也又恐潮之直薄堤岸則為斜階以順其流而於內復堅築土塘以為護如此則海波雖壯且惡有泛濫而無衝決比於金城之固矣雖然此特遙度言之耳若土著耆舊當有灼知事勢詳悉便利者執事能下車咨訪得其説擇而行之如宋尚書禮采老人之畫徐武功有正依道者之規是役也可以萬全豈不一勞永逸為吾浙世世賴哉與觀察熊雪巖免築備塘書楊雍建年來海波衝決望洋生歎致煩清慮拮據督修厥工告竣迄今民安其居物樂其業者皆老祖臺之深仁也敢忘所自哉近奉台檄於外塘之內興築備水土塘鳩夫集衆人情皇然莫知所措竊謂茲役也固出自愛民無已之心未雨綢繆之計但據今士庶公論合諸故老傳聞海潮洶湧資外塘以捍禦若衝溢過塘區區備堤斷難砥柱是故海水之迅激不關備塘之有無也眀甚今日議築必先將負塘居民廬舍盡行拆毁此與遷徙何異且取土之難塘以外盡屬斥鹵塘河之泥汚濫而不可用將壞桑麻之地以實此塘乎某不知其可也台檄每里出夫百名以通邑計之每日用夫三萬六千餘矣雖有動支站銀三百兩之諭意可不擾民間然備塘工程甚大倍於外塘不識動支錢糧可源源而繼乎不繼則無米之炊也繼則開銷原非易事若以不繼而令民輸力培土日無寧晷似非仁者愛民無已之初意也寧邑疊遭災歉十室九空民力巳竭即連年修築外塘出夫出料尚苦不支此老祖臺所目擊者今以有盡之民力築無益之備塘徒使督工鄉耆乘機射利波濤未至而民命難堪老祖臺必有惻然於中者議者曰六十里塘河所以納怒濤之泛溢而遞減其勢故欲濬塘河以築備塘不知今所恃者還藉外塘堅固邀天之靈海不揚波耳若奔騰澎湃越塘而瀉則塘河必不能容備堤必不可恃與其勞民傷財何如行所無事乎道路之口盡謂有一二姦商欲因公濟私創為此説以誑清聽伏願虛公熟計弗惑於似是之説也小民孰不自愛其身家設使有益自當竭力恐後敢負盛心乃今羣然而以為不必則不妨與民休息矣人情困厄呼天疾痛呼父母通邑士民合詞具懇伏願俯察輿情立諭免築留未盡之民力備外塘之葺補則豐功盛德與海水俱長矣論海潮論宋燕肅觀古今諸家海潮之説亦多矣或謂天河激涌葛洪潮説亦云地機翕張見洞真正一經盧肇以日激水而潮生封演云月周天而潮應挺空入漢山涌而濤隨施師謂僧隱之之言析木大梁月行而水大見竇叔蒙海濤志源殊派異無所適從索隱探微宜伸確論大率元氣噓翕天隨氣而漲斂溟渤往來潮隨天而進退者也以日者重陽之母隂生於陽故潮附之於日也月者太隂之精水乃隂類故潮依之於月也是故隨日而應月依隂而附陽盈於朔望消於朏魄虛於上下弦息於朓朒故潮有小大焉今起月朔夜半子時潮平於地之子位四刻一十六分半月離於日在地之辰次日移三刻七十二分對月到之位以日臨之次潮必應之過月望復東行潮附日而又西應之至後朔子時四刻一十六分半日月潮水俱復會於子位其小盡則月離於日在地之辰次日移三刻七十三分半對月到之位以日臨之次潮必應之至後朔子時四刻一十六分半日月潮水亦俱復會於子位是知潮常附日而右旋以月臨子午潮必平矣月在卯酉汐必盡矣或遲速消息之小異而進退盈虛終不失其期也或曰四海潮平來皆有漸惟浙江潮至則亘如山嶽奮如雷霆冰岸橫飛雪崖旁射澎騰奔激吁可畏也其漲怒之理可得聞乎曰或云夾岸有山南曰龕北曰赭二山相對謂之海門岸狹勢逼涌而為濤耳若言狹逼則東溟自定海吞餘姚奉化二江侔之浙江尤甚狹逼潮來不聞濤有聲也今觀浙江之口起自纂風亭北望嘉興大山水濶二百餘里故海商舶船畏避沙灘不由大江惟泛餘姚小江易舟而浮運河達於杭越矣蓋以下有沙灘南北亘連隔礙洪波蹙遏潮勢夫月離震兑他潮已生惟浙江潮水不同月經乾巽潮來巳半濁浪堆滯後水益來於是溢於沙灘猛怒頓涌聲勢激射故起而為濤耳非江山狹逼使之然也見潮論明楊魁余嘗登海寧城樓見海潮薄岸怒濤數十丈若雪山駕鼇雷奔電激昔人謂龕赭二山峙為海門故激而為濤今觀洶溢之勢却在海門之外非龕赭二山所為眀矣抱朴子曰取物多者其力盛來逺者其勢大潮水從東來地廣道逺乍入窄處陵山觸岸從直赴曲其勢不泄故隆崇涌起而為濤理或如此未登海上不知果爾否也既數日登虞山險山巔眺望則見海在浙東西者兩岸有際水勢洄曲旁多山峙海中亦崒屼星列彼自浩渺之區入於阻隘安得不衝擊而為濤乎即此推之定海松江之裏逶迤曲折兩岸有際元非溟渤望洋無際者實大海之汊入於浙中者爾故觸山薄岸震撼擊撞勢從內溢而無外泄所以來逺勢大愈進愈激未抵海門洶濤已甚矣此理之常無足怪者或曰潮盛於八月十八日者又何也余曰此邵子從月之論可信也日激水而潮生月離水而潮大是也或又曰地浮於水天在水外日入則晚潮激於左日出則早潮出於右日隨天旋水因灼激於月何與也余曰月者水之精也八月金盛於酉水之沐浴也於此而水月從隂其勢盛矣月離水而潮大亦氣使然也或者曰強弩射潮水不近城則又何也余曰此非其精誠之感果能與神抗也余嘗於捕魚者詢之夫水激而上水族從之上者其勢然也捕魚者於潮頭初過不敢投網待大魚三過之後乃網其細者又時至於割網放其不能舉者水族乘潮而上者衆矣水族在海中者多厯年所強食弱肉受精不少則精靈有知逢射知避者物性之靈則然也或又曰宋之末年潮多不振近日浙江亦鮮怒濤則又何也余曰氣有盈怯息於彼則消於此古來由然所以有自南而北自北而南之説杜鵑之鳴洛陽邵子言之矣嗟乎吾浙中文勝而鮮實人繁而物索姦宄盛而正氣消此潮勢之所以不振也操造命之責臨涖斯土者盍反其本以固元氣庶幾其可救乎寧邑海潮論明郭濬寧邑海潮必自東起先厄於近洋八山之內勢已洶涌錢塘江濤必自西來厄於龕赭海門而出相值在寧邑之南百餘里之內勢益湍怒安得無淜騰潰溢之患幸江濤輕淡而剽疾海潮鹹重而沉悍江水朝宗之性終不勝大海怒張之氣由是海潮仍挾江濤過海門更西抵嚴灘而後退故潮汐之大小有常期寧潮自東而西有常道至於江濤之緩急鹹水淡水之相值無常期亦無常處若更挾以颶風之怒號上流之添漲不免駭浪橫飛怒濤旁射吾寧實逼處此不可謂橫過之潮可長恃以無恐也海塘録卷十九
