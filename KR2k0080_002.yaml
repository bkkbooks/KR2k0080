body:
  text: 海塘録巻二内閣中書翟均廉撰疆域浙江夢粱録浙江在杭城東南謂之錢塘江後漢書郡國志㑹稽郡有浙江郭璞山海經注地理志浙江出新安黟縣南蠻中東入海今錢塘浙江是水經漸江北過餘杭東入於海酈道元水經注浙江又東流至錢塘糓水入焉唐六典浙江水有三源一出歙州一出衢州一出婺州歴睦杭越三州界入海虞喜志林今錢塘江口折山正居江中潮水投山下折而曲一云江有反濤水勢折節故云浙江山海經廣注浙江之名前此未有實始於山海經盧肇曰浙江折也葢取其潮出海屈折而倒流也郭子章郡縣釋名浙江又名曲江曲乃折之謂也山海經禹治水至於浙河莊子外物篇制河以東音義曰制諸設反依字應作浙漢書音義音逝河亦江也北人名水皆曰河浙江今在餘杭郡後漢以為吳㑹分界演繁露說文釋浙江云江水東至㑹稽山陰為浙江又漸水出丹陽黟縣東入海皆今錢塘浙江也又莊子有浙河則浙名舊矣桑欽載漸水所逕所入正今浙江而不名為浙若謂浙漸字近而相變如邾鄒之𩔖則浙之得名既見先秦而桑欽更以為漸何耶許氏浙水漸水又復兩出皆不可曉黟歙今徽州也休寧縣有浙溪溪上有浙嶺而婺州亦有浙溪二州水皆㑹桐廬而遂從杭越間入海則本其發源各名為浙未有牴牾第以古語為証則出黟者古也避暑録話桑欽為水經注載天下水甚詳而兩浙獨缺浙江謂之漸江欽北人未嘗至東南但取山海經為證耳今錢塘江乃北江之下流雖自彭澤來葢衆江所㑹不應獨指一水為名予意漸字即浙字欽悞為二名酈道元注引地理志浙江出丹陽黟南蠻中者是也即今自分水縣出桐廬號歙港者與衢婺婺溪合而過富陽以入大江大江自西來此江自東來皆㑹於錢塘然後南趨於海然浙江不見於禹貢以錢塘江為浙江始見於秦紀而衢婺諸水與苕霅溪等不見於水經者甚多豈以小遺之抑不及知耶輟耕録浙江一名錢塘江一名羅刹江所謂羅刹者江心有石即秦望山脚横截波濤中商旅船到此多值風濤所困而傾覆遂呼云杭志三詰三誤辨沿江三折地勢東西相對上折從富春江來一入錢塘界西岸有定山東岸有漁浦其在中渡則錢塘西岸名栁浦蕭山東岸名西陵其在下折洄注處則已在錢塘海寧之界東西岸蕭山有囘浦西北岸海寧有鹽官渡皆夾江而峙此緣江上下數百里由富春以至海寧無不兩岸平地緣江如線者海咸淳臨安志在鹽官縣東南十里明一統志東連海鹽西接浙江潮汐徃來衝激不常浙江通志今在海寧縣南半里漢防海大塘水經注引錢塘記曰在縣東一里許玉海引劉道真錢塘記曰議曹華信家富議立防海塘始開募有致土石一斛與錢一斗塘成一境䝉利縣本名泉亭於是改錢塘百姓懷徳立碑塘所世說劉孝標注引錢塘記曰縣近海為潮漂沒縣諸豪姓歛錢僱人輦土為塘因以為名也以上二說與漢書注及通典所引稍異餘見建築門唐捍海塘咸淳臨安志在鹽官縣南三里濶二丈高一丈唐書地理志杭州鹽官有捍海塘隄長百二十里開元元年重築臣謹案宋史河渠志劉垕稱鹽官縣之南原有捍海古塘二十里今東西兩段並巳衝毁止存中間古塘十餘里豈宋所謂古塘者即唐鹽官捍海塘歟吳越捍江塘咸淳臨安志梁開平四年八月錢武肅王始築捍江塘在候潮通江門之外隄既成乆之乃為城邑聚落今之平陸皆昔時江也餘見建築門海晏塘即唐捍海塘宋名海晏塘太平塘即唐捍海塘元名太平塘鹹塘咸淳臨安志在鹽官縣西南一里與淡塘通明一統志在海寧縣治西南與淡塘相對淡塘咸淳臨安志在縣西嘉定間南海沙坍増築隄防有水自市境西至秧田廟約六七里其河尚存由秧田廟而南轉西泥沙湮塞舟楫不通惟舊橋故道畧可識辨臣謹案鹹塘淡塘今其地未詳何處明一統志云唐鹽官捍海塘即其遺址也宋祥符土塘郡城外江隄也玉海云祥符七年潮直抵郡城守臣戚綸漕臣陳堯佐議實薪土以捍之實録云累木為岸或言非便命發運使李溥按視十月壬戌溥請如錢氏舊制立木積石以捍潮波從之其後踰年隄不成卒用薪土餘見建築門景祐石隄景祐三年知杭州俞獻卿鑿西山石作隄數十里地未詳何處詳見建築門張夏石隄景祐中工部侍郎張夏築自六和塔至東青門葉紹翁四朝聞見錄云杭州江岸多薪土潮水衝激三載輒壞夏令作石隄一十二里杭人徳之詳見建築門龍山隄在龍山下慶厯四年郡守楊偕與轉運使田瑜築長二千二百丈崇五仞廣四丈自龍山距官浦二千丈修舊而成増石五版為三十級自御香亭下創為二百丈宋史田瑜列傳云瑜與民約毎芻十束更輸石一尺率五嵗得石百萬詳見建築門政和隄在湯村巖門白石等處政和五年知杭州李偃乞依六和寺岸用石砌叠詔命劉既濟修治詳見建築門乾道石隄宋乾道年帥臣沈夏修石隄成増石塘九十四丈地無考嘉定土塘在海寧東自袁花塘西至淡塘止宋嘉定十五年浙西提舉劉垕築鹽官去海三十里舊無海患至是潮失故道奔潰北向至縣南四十餘里盡淪為海捍海古隄止存十餘里劉垕請築土塘以捍鹹潮從之嘉熙土塘一在宋東青門外十二里殿司右軍教塲之側一在團圍石塘北宋知臨安府趙與懽築嘉熈戊戌秋潮由海門直𢷬月塘頭已亥六月詔與懽修築與懽奏先於傍近築土塘為救急之術然後於内築石塘因自水陸寺之下江家橋上近江港口築壩一南北長一百五十丈今江家壩橋是也又自團圍頭石塘近江築捺水塘一長六百丈又六和塔以東一帶石隄添新補廢四百餘丈延祐土塘在鹽官北門元延祐間海水壞民田三十餘里省憲議於州後北門添築土塘東西長四十三里然後築石塘尋以沙漲而止方家塘在湯鎮永樂元年重築詳見建築門黄濠塘孫家圍塘在仁和永樂九年修築詳見建築門障海塘在海寧縣城南明成化十三年二月海決僉事錢山採石臨平安吉諸山初用漢楗絙法不就乃斵木為大櫃編竹為長絡引石下之乃成仍作副隄十里以防泄鹵凡七越月而工竣寶船厰隄在寶船厰萬厯三十三年錢塘令聶心湯築其地向無隄塘田土傾陷心湯戧築石隄計費六千餘兩金老鹽倉東魚鱗石塘康熈五十九年建巡撫朱軾題准於浦兒兜至姚家堰等處築大石塘一千三百四十丈用長五尺濶二尺厚一尺之大石毎塘一丈砌作二十層於石之縱鋪側立兩相交接上下鑿成槽筍嵌合聯貫使其互相牽制又於每石合縫處用油灰抿灌鐵鑻嵌口謂之魚鱗石塘工未竣陞任所築止五百丈遶城魚鱗石塘在海寧南門外乾隆元年建大學士嵇曽筠請自西土備塘頭起至東土備塘止長五百五丈二尺於二年六月告竣後九月又建條石坦水五百丈二尺尖山魚鱗石塘乾隆二年建大學士嵇曽筠請自浦兒兜大石工尾起至尖山段塘頭止共長五千九百三十丈二尺浦兒兜魚鱗石塘乾隆四年建初改築尖山石塘時小墳前浦兒兜等處潮水尚激塘身猶藉草盤頭挑溜故其地仍是土塘未行改建迨後水勢南遷沙漲日逺草盤不必加鑲至是年四月巡撫盧焯請于浦兒兜馬牧港戴家石橋秧田廟賣魚橋小墳前鄭九臯户側白牆門念里亭等處草盤頭九座後身一例改建石塘一百六十八丈六尺五年二月増築二丈三尺東塘續魚鱗石塘乾隆五年建九月巡撫盧焯因緩修工内舊塘坍矬六十九丈五尺請一例改建石塘内潘介山屋前舊塘三十九丈五尺洪文舍西舊塘三十丈東塘續魚鱗石塘東塘李富祥門前等處舊係柴塘乾隆五年九月巡撫盧焯請改建石工其逢灣取直節省丈尺共七十二丈九尺二寸陳文港魚鱗石塘乾隆二十五年九月建撫臣莊有恭於緩修石塘内請改築魚鱗石塘十丈四里橋魚鱗石塘乾隆二十七年六月建撫臣莊有恭請於緩修石塘工内改為魚鱗石塘五段長一百四十三丈五尺念里亭魚鱗石塘念里亭汛後小墳前第六十六段西首緩修石塘三十五丈五尺東首緩修石塘十三丈二尺歴年乆逺底樁霉爛乾隆二十八年九月撫臣熊學鵬請改為魚鱗石塘戴家石橋魚鱗石塘汛内第四十七段緩修石塘二十九丈五尺塘身鼓凸二十八年九月撫臣熊學鵬請改為魚鱗石塘老鹽倉西柴塘亦稱草塘康熙六十一年建先是撫臣朱軾請於老鹽倉東自浦兒兜起至姚家堰止宜築石塘一千三百四十丈築至五百丈陞任至是屠沂因奏土浮不能釘樁砌石之處請趕築草塘八百四十丈又自姚家堰西續草塘二百五十丈姚家堰柴塘姚家堰至草菴一帶計長七里向為土隄雍正五年巡撫李衞請改建草塘八百二十六丈四尺沈家埠柴塘雍正十年建時巡撫王國棟請於華家衖草塘止處至仁邑沈家埠迤西之潮神廟接築草塘二千二百二十餘丈石塘東柴塘自石塘東至大盤頭西乾隆二十五年撫臣莊有恭題請折底加鑲二百八十丈韓家池柴塘在寧邑東塘乾隆二十六年撫臣莊有恭題修長二百二十丈觀音堂西柴塘在寧邑觀音堂迤西乾隆二十八年撫臣熊學鵬題請接築長三百丈翁汛柴塘在寧邑西塘觀音堂迤西翁汛内乾隆二十八年撫臣熊學鵬題請接築長一百丈曹殿柴塘在寧邑西塘翁汛内曹殿東乾隆二八年撫臣熊學鵬題請接築長一百丈翁家汛柴塘在寧邑翁家汛迤西乾隆二十八年撫臣熊學鵬題請折築長一百丈臣謹案柴塘之築自康熙六十一年巡撫屠沂於朱軾所請建築石塘之内有土浮不能釘樁砌石之處議築草塘自後凡遇土鬆之地樁石難施隨請建築以資捍禦乾隆二十七年恭逢皇上親閱試以木樁始多扞隔尋復動搖難以改建欽奉諭旨力繕柴塘定嵗修以固塘根増坦水石簍以資擁䕶酌加柴價以裕芻輓厚儲備聖謨廣運至詳至精誠萬年鞏固之基也土備塘雍正十一年内大臣海望奏築自寧邑龜山脚下至仁邑李家村章家菴止共長一萬四千四十八丈五尺塘身㡳寛五丈頂寛二丈四尺内建石閘四座涵洞十七座木橋二十六座詳建築門土塘東自李家村西至接塘頭八仙石止俗稱老土塘疑即宋趙與懽所築土塘也雍正十一年内大臣海望加工四千九百五十六丈内修舊閘四座舊涵洞三座萬花塘即海望所築土備塘地近潮神廟乾隆八年巡撫常安令種桃樹於土備塘以堅塘身俗呼為萬花塘様塘柴塘後有様塘四段計長二十丈海龍洋沈家埠曹殿東老鹽倉各五丈乾隆五年總督徳沛議將寧邑老鹽倉西至仁邑章家菴一帶柴塘共四千二百餘丈改建石工恐土性虚浮難以釘樁甃石先於海龍洋等處險要之地試築様塘二十丈以覘地勢工完奏請下部議准尋因左都御史劉統勲奏請改建石工不必過急事乃寢臣謹案海塘向有東西之分自戴家石橋至尖山為東塘計石塘長八千二百七丈内緩修石塘一千二百七十二丈六尺零魚鱗石塘五千七百八十七丈八尺零遶城石塘五百五丈二尺搶修石塘六百四十一丈三尺零又韓家池柴塘四百六十一丈一尺又尖山脚下舊石塘九十五丈又尖山石壩二百丈自仁邑八仙石起至戴家石橋止為西塘計石塘長一千三百四十五丈七尺内舊建大石塘四百六十丈魚鱗大石塘三百九丈八尺緩修石塘二百五丈九尺搶修石塘三百七十丈又土塘四千七百二十七丈五尺又柴塘四千二百六十九丈五尺尖山石壩在尖塔兩山間其地向有石壩堵塞水道後為修塘人役誤取其石修補塘工雍正十二年海望奏請築壩一百二十丈九月二十二日開工至十二年十一月大學士嵇曽筠奏請停止乾隆四年十月巡撫盧焯以尖山壩未完者止八十丈奏請續築中小亹引河康熈五十七年巡撫朱軾委員開濬五十九年復㑹同總督滿保奏請赭山以北河莊山以南乃江海故道近因淤塞以致江水海潮盡歸北岸囘潮冲刷則土石塘工終難穏固今已僱用民夫挑濬一千九十丈大汛潮水亦可出入其未挑者兼工開浚則江海盡歸故道下部議行需銀三千一百六十兩零開挖未幾又復淤塞六十一年巡撫屠沂以北岸塘脚沙漲塘身穏固奏令停止開濬雍正十一年奉命於中小亹開挖引河以分水勢十二年總督程元章奏稱中小亹難以開挖奉㫖命副都統隆昇總理海塘事開挖引河三月始事五月工竣西自淡水埠起東至鹽滷埠止共長三千七百九十餘丈面寛十二丈底寛二丈深一丈至丈五不等隆昇又奏引河善後事宜請造混江龍鐵箆子等器具並用夫撈淺陸續疏刷八月又請添設海防通判一員駐劄河莊山耑司疏濬事十三年十二月大學士嵇曽筠以引河在中小亹外灘淡水埠安設中如黄山廟一帶界於河莊禪機兩山之間北河頭地視江較高而河尾又在茅家堰全無建瓴之勢潮來流沙漫入河中潮退沙存日就湮塞雖復疏通山水開挖南港一河又當北亹之中反有導之使來之勢奏請停濬部議從之乾隆九年吏部尚書訥親請開中小亹故道至十二年二月工竣挑挖工長一千二百四十七丈五尺面寛三四五六丈底寛二三四丈深六七丈不等南港河在北大亹河莊山東雍正十二年三月副都統隆昇奏云河莊山東舊有南港河一道柴滷船隻不時往來今西首沙淤者僅一十五里挑濬甚易奉㫖允行西自大坍灣起東至分金埭止共長二千七百丈面寛四丈至十丈不等底寛六尺深四五尺至六七尺不等五月工竣備塘河康熙五十七年巡撫朱軾請修築海寧石塘并請開濬備塘河以防泛溢奏言塘内向有備塘河潮汐往來稍稍漫過塘面猶恃河可稍容不致驟溢自明季居民貪利節節築壩遂淤為陸今河形尚存應去壩疏河即以挑河之土培岸下部議行開濬備塘河身長千七百五十六丈四尺建閘一座乾隆四年十二月巡撫盧焯疏稱寧邑土備塘内外從前取土築塘已挖成河形自尖山至天開河計長一萬四千三百七十餘丈即逹仁和之范家木橋又自范家木橋至殊勝橋皆有舊河計長六千五六十丈即達省城若循故道一律開通誠為至便奉㫖允行東塘草盤頭壩雍正七年建凡五座時總督李衞以東塘潮頭自尖山直趨而北勢猛溜急因於陳文港小墳前薛家壩及念里亭等處分築挑水盤頭大草壩五座臣謹案東塘盤頭五座内除白牆門念里亭已先建大者二座并錢家坂添一小座外其餘三座俱係八年春續完并於小墳前之頂大座兩旁増築雁翅使潮水得以兩面順勢埽出不致壅遏西塘草盤頭雍正八年建凡三座時總督李衞以西塘一帶塘身太直以致溜水往來搜刷如故因請照東塘之例於老鹽倉戴家石橋楊家莊三處添築草盤頭大壩三座草菴前盤頭雍正十年建時巡撫王國楨請於草菴前一段建貼以盤頭一座以迎水勢尖山雞嘴浮壩雍正十二年八月副都統隆昇因尖山水口尚未堵塞請於貼接尖山外口由東南而至西北先暫築雞嘴挑水浮壩一道以順攩潮水之入再就尖山西首於文武菴左右由西北至東南亦先暫築浮壩一道以順攩江水之出使兩道浮壩相對於外尖山塔山包羅于中以便尖山脚下施工堵塞計築雞嘴壩一座自雍正十二年九月開工至十二月工竣長一百十九丈土備塘涵洞雍正十一年建凡十七座時内大臣海望修築土備塘因内有備塘外有石塘民居其間雨水無從㵼洩乃於最低積水之處建設涵洞在東塘者掇轉廟二座陳文港車子路尖山運河雙乂港蘓木港各一座在西塘者楊家莊天門河各二座馬牧港翁家埠杭宅壩三角田曹殿壩萬家埠各一座土塘涵洞雍正十一年修建凡三座時内大臣海望修築土塘設涵洞曰陸家跳曰太平曰青龍土備塘石閘雍正十一年建凡四座東塘聞道菴念里亭各一座西塘董石灰橋荆煦廟各一座内大臣海望建塘時所置土塘石閘雍正十一年建凡四座曰雙潭曰萬善曰王家曰潮安鎮海鐵牛雍正八年置凡五座分置老鹽倉前戴家石橋山川壇泥烟墩前潮神廟五處尖山壩鎮海鐵牛乾隆五年尖山壩成鑄鎮海鐵牛四座分置福寧宫前大塔山各一座新築石壩中凡二座海塘録巻二
