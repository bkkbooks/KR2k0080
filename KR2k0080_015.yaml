body:
  text: 海塘録卷十五內閣中書翟均亷撰奏議三工部覆撫臣程元章請修石草塘議雍正十三年浙江巡撫程元章疏稱浙省仁和海寧等縣石草各塘於本年六月初二日夜陡遇颶風大作雨驟潮湧沖潑塘隄石草塘身并附石土塘坍卸甚多兼之沖有缺口臣據報即會同督臣郝玉麟等星夜前赴塘工逐一詳加察勘一面繕摺奏聞一面動支銀兩飛飭在工各員多集人夫撈取舊石上緊搶修堵禦又飛調道府知縣標員及佐雜各員會同旗員分段趕辦柴樁料物上緊搶修晝夜趕辦查仁和海寧二縣共坍草塘三千九百五十一丈零盤頭一百二十四丈東西石塘五千六百五十六丈零又海鹽縣共坍附石土塘二千五百六十丈零沖卸大石塘面并裏外攔水石二百四十八塊土備塘坍卸涵洞一個小坍二十五丈仁錢二縣江塘間有坍卸多寡不等亦隨飭辦料搶修又仁和海寧二縣海塘自雍正十三年正月起至六月初二日陸續坍矬草塘并盤頭鴈翅共二千三百八十八丈零石塘五百六十七丈零潮溝作壩三丈三尺今俱搶築完工但目下正當秋汛防護不容稍懈除現在復又派委佐雜等二十餘相度形勢幫築髙濶加謹保護并多備物料分貯緊要處所以資濟用外所有仁和海寧海鹽等縣石草各塘坍卸段落丈尺情形理合具題查仁和海寧等縣風潮坍卸石草各塘共一萬二千二百九十七丈并雍正十三年正月起至六月初二日以前陸續坍矬草塘等工共二千九百五十八丈五尺該撫既稱搶築完工但目下正當秋汛防護不容稍懈應如所題行令該撫將前項工程飭令在工派委各員上緊幫築并多備物料運貯濟用工完之日造册具題查核可也大學士稽曽筠請建魚鱗石塘及搶修坦水疏雍正十三年臣欽遵恩命總理浙江海塘事務周歷上下各工詳加查勘間於本年九月二十八日接到大學士朱軾寄字內開雍正十三年八月初八日面奉諭旨浙江海塘關係民生最為緊要因隆升與程元章意見不合以致遲誤工程特差爾前往督率之隆升等聽爾節制如何修築之處爾做過浙江巡撫自必諳練但工程浩大需用錢糧斷斷不可吝惜舊塘先需修築完固以資捍禦切不可因塘身臨水那動尺寸那移一步即衝坍一步何時是已至修魚鱗大石塘乃一勞永逸之計不可因塘外沙漲停止修築縱使沙漲數十百里民人居處耕種亦不可恃必需大工完竣方可垂之久逺於地方有益其石料夫工價值照時給發若扣尅留難則利民之事反以病民如有此等情弊務嚴參重處毋得姑容欽此仰見聖謨廣運洞悉機宜伏查海寧東西兩塘延袤一百餘里多係海潮江溜瀠洄衝激搜刷塘根在在險要雍正十一年間仰蒙欽差內大臣海望等赴浙會勘奏請改建大石塘坦永垂利賴而經始維艱尚未舉行本年六月內風大水湧舊塘坍卸雖撫臣督臣等分頭搶築堵禦一時但纍石鑲柴暫為粘補現今塘外坦水工程潑卸歪斜比比皆然塘身卑矮單薄背後盡係漊沆內外空虛實屬可虞杭嘉各府襟海帶江所恃以禦水患者惟一線殘塘若不速為修治恐轉瞬春潮踵至關係匪輕查從前估築魚鱗石塘原議將舊塘坍卸之處逐段改建今海潮直逼塘根往來衝刷萬難拆去舊工開槽改築且臨水做工一日兩潮油灰漿汁無所施用斷不能如式堅固臣再四思維惟有照嵗修之例速將舊塘工程上緊勘估修築以固外面籓籬另於舊塘背後相度基址建築魚鱗石塘方可垂之久逺其新塘未竣以前數年之內全資舊塘抵禦海潮以便施工砌石即新塘既成之後留作重門外障更屬有備無患除建築魚鱗石塘工程容臣詳勘塘基確估工料酌定章程另行條晰奏陳請旨訓示遵行謹將修築舊塘事宜敬為皇上陳之一塘身卑薄宜幫築裏創也查海寧縣迤西浦兒兜至迤東念里亭一帶塘工悉係海潮頂衝必須塘身寬厚方可藉資捍禦雍正十一年奏請加髙附土歷今兩載風雨淋漓漸次塌卸今年又被風潮沖漫現在通身單薄內外受險倘再遇風浪衝擊難免潰決之虞臣請通盤查丈於塘身裏面幫築土創增卑培薄一律髙寬所需幫創土方沿塘現無官地且多係坑漊不能取用應照河工例交與地方官按段確查離塘數十丈外酌量可以取土之處購買民地應用即將所買民地額徴錢糧題請豁免一坦水工程宜修補完整也查海寧塘工多屬活土浮沙潮水搜囓腳根易致空虛從前於塘身外面每嵗補釘排樁修砌石塊二三四五層不等名曰坦水賴以攩浪護塘立法甚善其如年久樁朩損折石塊潑卸近今又乏嵗修猝遇風浪撞擊殘圮殆盡慿何保護塘根臣請購辦粗大樁石將東西兩塘坦水逐段修補完整以資護衛至需用朩石等料移催撫臣多募夫匠船隻公平給價星赴各山産地上緊採運以便儹修一灌砌又無錠鋦鉤聯率用零星碎石逐層堆垜一經雨水淋漓處處滲漏脹裂設遇風潮抽擊必致通身矬塌殊屬危險臣請多方購運條塊大石將現在頂衝首險地方所有坍卸塘工分别段落陸續改砌整齊方保無虞又查石工坍裂之後多於塘身上面用柴鑲築雖層土層柴加鑲鋪墊而鹽簫枝幹粗浮難於壓實容易漏縫且因下有石土未便簽樁全不聯絡結實勢難經久亟須擇險拆修仍用大石塊逐層鋪砌庶為穩固一柴草工程宜加鑲髙厚也查海寧迤西翁家埠一帶塘根沙土虛浮難以釘樁砌石從前修做掃工用柴堵禦綿亘二十餘里隨修隨蟄危險異常現今潮平之時掃工出水僅有一二尺不等設遇伏秋大汛勢必漫掃潰塘甚為可慮臣請購運柴料普例加鑲務與附土塘身一律髙平外用長樁簽釘堅實再於險要處所多貯柴束土方豫備搶修以資保護一南門石工應早為建築也查海寧縣南門外塘工五百餘丈俯臨江海貼近城垣當首險之地受全海之衝工程殘缺難資保障設有疏虞水勢建瓴而下關係甚大現在三冬水減亟宜及時建築臣請上緊購辦料物即貼近舊塘先築魚鱗石塘五百餘丈遴委幹員分段承辦預為指示做法俾令如式甃砌儹築完竣庶可保固城池以上舊塘工程必須乘此水落潮平頂底畢露之時逐段查勘通盤修築以禦來春潮汛勢難再為遲緩致滋貽誤臣相度情形會同在工諸臣詳悉商酌指示機宜現在逐一飭估辦料鳩工次第興修務期帑不虛麋工收實效臣欽承恩命竭力督催倘有朩石柴草船隻不齊并給發夫價虛冒扣尅等弊臣不時查察嚴參斷不敢稍有容隱至動用錢糧容臣會同撫臣等核實確估造册題銷大學士稽曽筠陳海塘事宜疏雍正十三年浙省海塘辦料鳩工從前漫無章程紀律以致因循貽誤上廑天心不但工程辦理不善而習氣錮蔽亦復難除誠如上諭至聖至明臣到工以來仰遵聖訓剔弊釐姦不敢纎毫瞻顧審海潮江溜之勢酌緩急先後之宜核定章程申明紀律務期洗除習氣有裨巨工謹將現在辦理工務敬為皇上陳之一寧邑塘工之患雖在北岸而致患之源則在於南岸長有沙灘綿亘百餘里又有沙嘴挑溜遂至江海水勢全向北趨塘工日加危險是欲治北岸之水患必先治南岸致患之源無如所開引河與地勢不合兩年以來並無裨益臣再三相度惟有借水攻沙之法在於南岸沙洲用鐵器具梳挖陡崖俾沙岸根腳空虛乘冬季西北風多海潮往來使之自為沖刷隨勢坍卸巳有數十里之逺查江湖河海形勢雖殊而東坍西漲理無二致且海灘沙性虛鬆因勢利導費少功多現今自仁和至海寧翁家埠老鹽倉一帶日夕漲沙亦有數十里仰賴皇上福德隆盛水勢巳向南趨北岸漸臻平穩新舊塘隄可以次第施工一塘工需用條石甚多非一山一宕所能採辦足用必須於江浙兩省産石地方廣為開採方能有濟工程而道里逺近不一運費多寡不同從前所定價銀不能斟酌合宜宕戶苦於賠纍以致年來並無一人承應採辦者臣悉心察訪山隂武康二縣距海寧就近蘇州洞庭等處路程較逺所有應給山價水腳分别道里量為增減自七錢三釐至七錢七分三釐不等俱用部頒銅尺一律量收檄飭布政司發帑委員前往各産地方將所需條石上緊辦運其修理坦水所需大塊石多募工匠於就近尖山各宕開採儹運又督令塘兵并雇募人夫將沿塘外灘沖潑石塊儘數揀撈湊用現在一面釘樁一靣補砌可無遲誤一浙省從前辦理樁朩雖經分别等次定價而圍圓不循則例任意髙下易於作弊且姦商蠧胥中飽居竒每至辦運稽遲不能應手濟用臣酌量修理塘身坦水需用樁朩自一尺二寸起至一尺六寸止循照舊例給發價值其查量之處核定於二尺以下圍圓不得髙下其手多委幹員秉公量收臣仍不時查察母許侵漁滋弊咨會撫臣動支帑銀就近發交仁錢二縣於江口內河一帶計照圍圓星速運工又委員賫銀分頭前往産朩之上遊嚴州衢州以及下遊蘇州常州江寧等處廣為購辦可得樁朩二十餘萬株源源接濟現在修理塘坦工程所需料朩可以足用無虞一翁家埠一帶草塘需用加鑲柴束於富陽分水建德桐廬等四縣地方購辦交工向例責成沿塘殷戶經管收支既非經制人役又無額給工食守法者包賠頑詐者舞弊販柴縣胥串同殷戶朋比作姦或任意短少斤兩侵蝕價銀或攙雜嫩幹青枝不適工用種種弊竇不一而足臣抵工之始查閲各塘所貯柴束零星數堆全無儲備隨咨會撫臣動支帑銀飭發各該縣實力辦運所有舊設管柴殷戶盡行革除遴委旗漢幹員分住東西兩塘秉公查收又於沿塘建造板房三十餘間派撥塘兵看管柴厰責令廳營文武員辨典守稽查現今運柴船隻銜尾到塘酌量工程平險分别堆垜鱗次櫛比一望崇墉足以有備無患一塘身幫築裏創一萬三千餘丈需土浩繁舊塘之外遍係坑漊不便就近開挖惟土塘塘河以北壤地平衍但取土較逺小民畚鍤維難臣酌量每方價銀自一錢三分五釐至一錢八分不等定為規則檄調仁和蕭山諸暨海寧等縣印官分段承修業經發帑鳩工上緊儹築務期增卑培薄一律髙堅以資捍禦一尖山採辦磈石應給工價銀兩向緣扣除雜費夫匠人等所領工食不能糊口相繼逃亡各處匠役聞風逺避裹足不前又派撥商竈船戶裝運石料所給腳價不敷舵工水手日用之資兩年以來沿海船戶拖纍難支臣查訪既確嚴飭該管員辨將應給夫匠工價照依庫平紋銀實數支發母許仍前扣尅絲毫所撥商竈船隻公同酌議量添雇值并飭令於海潮大汛聼其載滷燒鹽小汛俱赴各山運石公私兩便小民樂於從事可濟要工一海防經制官兵原為修守塘工而設自應勤加訓飭分派兩塘巡查照管遇有應修工程督令常川力作隨時粘補方為有益乃從前該管道員不能實力整頓積久罷玩相習成風以致備辨不諳修防兵丁不事畚鍤且廳營岐視呼應不靈廢弛已極臣飭令兵備道將兩營塘兵詳加甄别汰其老弱募補壯丁責令該營守備會同海防同知嚴行督率照管料物巡防險工其揀撈石磈滿一百方者賞給銀十兩以示鼓勵其行走懈怠辦事不前者遞行降革以昭懲戒庶不致虛靡俸餉有名無實一修築舊塘身並坦水工程甚為喫緊必須遴委幹員分工搶築庶幾衆擎易舉臣會同撫臣選調本省同知通判知縣等官並移咨江南督撫揀調松江海塘練習工員及浙江本地殷實紳士在工效力者將舊塘身應擇險拆砌之處分委領帑承修更於江南河工內挑選熟諳工務之河官三十員咨調來浙委令監工如式修理至兵備道經管料物錢糧事務殷繁隨調嘉湖道金衢道協同辦理催工又南河學習部郎完顔偉臣看其行走勤力實心學習因隨帶到寧一并委令赴塘催儹工程復咨會撫臣程元章都統隆升分管東西兩塘不時赴工督催臣每日往來指示機宜董率查辦務期協力共濟早竣要工以仰副聖主軫念海塘奠安億兆至意所有應行事宜酌定章程并江海水勢情形條晰具奏大學士稽曽筠請停開挖引河疏雍正十三年開挖引河必須看河頭有吸川之形河尾有建瓴之勢因髙就下一氣貫注方能掣溜成功今浙省所開引河於中小亹外灘淡水埠安設河頭並非頂沖不能吸引江溜中段黃山廟一帶界於河莊襌機兩山之間北河頭地面較髙江水豈能自下而上挽流注海而河尾又在茅草堰地方一派沮洳全無建瓴之勢每日海潮夾帶流沙漫入河頭河尾中髙溜緩潮退沙存日漸湮塞雖復疏通山水開挖南港一河又當北大亹之中挑溜仍歸海寧對面是不能引之使去而乃導之使來有損無益查開挖引河兼陸續疏濬計用過銀五萬五百五十兩隨濬隨淤迄無成效臣由錢塘渡江周歷河道詳細查勘現在三千餘丈間段淤淺江溜不通即使再動帑銀大加挑濬而潮汐往來恐流沙仍復漲滿實係無裨塘工相應請旨將引河工程停止疏濬庶有用之金錢不致靡費於無用之地矣再引河地方原設通判一員經管疏濬事宜今引河既無裨益通判應宜裁汰查仁寧二邑海塘延袤一百餘里向設東西海防同知二員分段管轄工多汛險不無鞭長莫及之虞現今修舊建新二工並舉正在需員辦理請將引河通判調駐海寧查明華家弄以東浦兒兜以西所有柴草塘工分交該通判管理修防以專責成實為有益其調撥引河塘兵四百名應請一并撤回仍歸塘工以供力作大學士稽曽筠請停堵塞尖山水口疏雍正十三年海寧東南尖塔兩山鎮鎖海口相去二百餘丈從前原係接聯嗣後水勢沖開海潮江溜出入其中附近尖山一帶海塘未免當沖受險河工建築挑水大壩每長一丈挑溜十丈今尖山壩工若能照舊堵塞約長二百餘丈計算挑水二千餘丈則依山一二十里之內可望沙漲於就近工程尚為有益或言堵築尖山通工沙漲不用修塘者固屬虛張之語或言因尖山既堵致令海塘受纍者亦非持平之論惟是口門溜緊必須多備料物堆貯現成誠如世宗憲皇帝諭旨一舉而就方能合龍收效查該工自上年九月迄今一載有餘雖經築完一百餘丈而未堵之處尚寬七十餘丈潮汐往來溜勢日加湍激合龍甚是艱難零星拋擲磈石隨波漂淌所積者少所坍者多曠日持久告竣無期現在修築舊塘坦水所用磈石又須於尖山各宕內就近分撥運用以濟急需採辦石料不能兩工兼顧緣坦水工程必當乘此冬季水落潮平底灘畢露之時上緊修築稍有遲延春潮一長底灘俱在水中難以措手施工則百里危塘無所捍衛關係甚大况尖山水口一時不堵猶可留為後圖臣悉心相度情形酌量緩急請將尖山採辦堵壩之磈石擇其大者儘數運赴東西兩塘儹修坦水俟坦水工竣之後再為廣貯石料預備齊全另行設法堵截尖山務期一舉合龍庶塘壩工程先後得宜兩無貽誤臣因坦水工程緊要除移行在工諸臣撥運尖山大塊石上緊修砌外謹將尖山壩工暫緩緣由繕摺奏明大學士稽曽筠題報塘工疏乾隆元年臣欽奉恩命總理浙江海塘相度機宜前築坦水後幫土創並將塘身擇險興修當令庀材鳩工趂此水落潮平并日儹築以便抵禦春汛業經恭疏奏明惟是時屆嚴冬誠恐海濱風雪易致水凍則物料夫匠濡滯不前荷蒙皇上德敷宇宙仁政流行海澨山陬陽和廣被自興工迄今經歷隆冬天氣晴和今萬餘丈之坦水已築七分計於二月初告竣其通塘土創以及擇險重修之塘身晝夜催趲期於三月內一律完工庶伏秋大汛得資保護其應需嵗修保固之處亦預為籌畫儲備總之舊塘工程如營室之第一層門戶必得髙其閈閎厚其垣牆以為外禦斷不可畏難茍簡臣惟有恪遵聖諭督率工員愈加勉勵勤事修防務期補偏救弊先將塘工首險工程趕築完竣然後將次險各工逐漸修整舊塘固而新塘方可創建統容次第辦理所有現在江海水勢工程平穩情形理合具題工部覆大學士稽曽筠奏明修築土創坦水議乾隆元年大學士稽曽筠疏稱仁和海寧二縣東西兩塘捍禦海潮江溜保護七郡民生攸關緊要臣抵浙後目擊塘身坦水傾矬潑卸卑矮殘缺在在受險查舊塘工程逼臨江海風浪易於衝擊必得髙寬堅厚以為外禦臣即董率文武員辨鳩工購料分段搶築指示做法上緊儹辦本年五六月間黴雨連綿上遊山水驟漲海潮洶湧舊塘一律髙厚足資捍衛除應築魚鱗大石塘容臣保固秋汛後詳審水勢通盤酌估次第興舉外所有修築舊塘土石各工應用工料銀兩幫築沿塘土創共長一萬三千九百九丈計用土方掃料銀八萬七千三百六十兩三錢七分三釐零修補坦水共長八千四百四十四丈二尺計用工料銀七萬一千五百二兩一錢七分六釐零擇險搶築石塘共長一千一十二丈三尺五寸計用工料銀五萬七千八百四十六兩五錢九釐零通共工料銀二十一萬六千七百九兩六分零內塘坦各工塊石一項需用繁多採自各山路途逺近不等運腳多寡不一統俟報銷時查明數目分别報造至於加幫土創需用土方酌量宜於取土之處購買民田應用仍將所買民田額徴錢糧照例查明題豁再查沿塘民舍緊貼塘身其有占礙加幫土創之處照例給銀移建所用錢糧與購買民田價值一并確核題銷除寧邑南門外貼近城垣之石塘五百餘丈并翁家埠一帶加鑲柴草工程需用物料銀兩現在另行確估詳報外再查東西石塘內擇險搶築外凡尚可支撑之處一時不能全行甃砌伏秋大汛屆臨督飭東西兩塘同知暨在工文武人員分段防護遇有樁朽石矬處所查勘明白彚入嵗搶案內相機修守隨時粘補以禦汛水應如所奏行令該督將前項應修應築各工照數動支銀兩發給承修各員上緊辦料修築務期如式堅固工完將用過銀兩照例造册題銷至所需磈石應於題銷册內將路途逺近運腳多寡詳晰聲注以慿查核其加幫土創需用土方應令該督酌量於取土之處購買民田應用其所買民田應徴錢糧照例題請豁免至於沿塘民舍有礙加幫土創處所照例給與銀兩令其遷移其給過銀兩數目及購買民田價值一併入於題銷册內據實核銷其東西石塘內凡可支撑之處該督飭令東西兩塘同知并在工文武人員速行分段防護遇有樁朽石矬之處立即查勘明確相機修守隨時粘補以禦汛水仍將修過工程彚入該年嵗搶册內聲明具題所有寧邑南門外石塘并翁家埠一帶加鑲柴草工程需用物料銀兩應俟該督造册題估到日再議可也大學士稽曽筠請築魚鱗石塘疏乾隆元年舊塘坦水及塘身傾圯卑薄之處臣業經勘修堅固又全塘建築土創以為倚靠以資捍禦亦於本年四月間儹築完竣現在伏秋大汛藉以護衛至大魚鱗石塘乃經久保固之工自應於霜降後次第興工以垂永逺臣於上年九月間抵工之始目擊江海形勢奔趨北岸日夜沖刷危險異常實難臨水施工再四思維議於舊塘背後另度基址建築魚鱗石塘業經奏明但查舊塘之後越築大塘需帑浩繁曠日持久如果水勢仍前危險萬不得巳必須擇基另建自不敢惜費因循今春夏以來仰賴我皇上德福隆盛精誠昭格江海形勢漸向南趨海寧東西兩塘日夕漲沙較上年情形巳不啻徑庭之别辦理工程貴在審度形勢因地制宜庶幾帑不虛靡工收實效今水勢既巳條順塘根又漲護沙則所議魚鱗大石塘應即在於舊塘基址清槽釘樁如式甃砌不必於舊塘之後擇基另建更覺費省功倍謹遵世宗憲皇帝不可那移寸步之諭旨以成一勞永逸之巨工實為萬全無弊臣往來仁寧二邑塘工悉心相度衝要之地暨海寧南門外繞城險工共應改建魚鱗大石塘六千餘丈查蘇州紹興各山宕一年內所採條石可供塘工二千餘丈之需每年於伏秋潮大之時購備朩石料物鳩工鏨鑿合式乘冬春水落之際開工儹築通計二千餘丈塘工三年之內可以全竣從此長塘堅厚永資保衛沿海民生永慶平成於億萬斯年矣大學士稽曽筠請造運石海船疏乾隆元年修築塘坦工程所用條磈石料甚多必由海洋轉運需船緊要從前俱係雇調商民船隻撥發應用無如沿海漁船板片卑薄難以撑禦風潮每有漂失之虞各場滷船長年在工運石不能回場載滷多致煎辦稽遲既苦纍民間又貽誤鹽務究於大工石料仍不能應手接濟實無裨益將來修建魚鱗大石塘約用條石五六十萬丈需船更殷與其雇調維艱滋弊誤工不如建造船隻便宜適用且採辦石料原有水腳銀兩如用官船載運則前項水腳即可按數扣存除支給舵水工食并更換篷索修艌船隻等費外餘剩銀兩儘數存公將來塘工告竣仍可撥發各場變價運滷庶帑不虛靡工收實效臣因海塘運石急需船隻檄行五十隻每隻估需工料銀二百六十八兩九錢二分零業經先後報竣動支銀一萬三千四百四十六兩三錢零陸續給發合行題明工部覆大學士稽曽筠請續魚鱗石塘議乾隆二年大學士稽曽筠疏稱浙省海塘自浦兒兜大石工尾起至尖山段塘頭止共應建築魚鱗大石塘五千九百三十丈二尺內自寧邑繞城石塘迤西地勢稍為卑下應估用條石一十七層計砌髙一丈七尺內首險工一千四百二十丈一尺估需工料銀二十五萬三千二百五十三兩九錢七分五釐零次險工九百八十三丈九尺估需工料銀一十七萬五千七百六十兩六釐零自寧邑繞城石塘迤東地勢更為卑下應估用條石一十八層計砌髙一丈八尺內首險工二百九十一丈五尺估需工料銀五萬二千九百六十二兩一錢九分四釐零次險工三千二百三十四丈七尺估需工料銀五十八萬七千七百七兩七錢一分七釐零通核料物夫工總共估用銀一百六萬九千六百八十三兩八錢九分三釐零查估建工程雖經陸續委員承築一時未能普例完竣并未經派委承築各工如伏秋大汛石上鑲柴不無矬墊之處關係緊要隨遴委廳印效力等官三十一員先行分修大石塘二千九百七十四丈一尺其餘應修大石塘二千九百五十六丈一尺容臣次第興舉以垂久逺應如所奏將先修大石塘二千七十四丈一尺上緊儹修其餘應修大石塘二千九百五十六丈一尺陸續次第興舉可也大學士稽曽筠請建繞城條石坦水疏乾隆二年海寧縣南門外一帶塘隄保護城垣攸關綦重經臣奏請建築魚鱗大石塘五百五丈二尺委員領帑承辦於本年五六月內陸續告竣但繞城石塘捍禦潮汐全賴坦水相為保護查雍正十二年冬底嵗修磈石坦水潮汐往來易於潑卸必須加築條石坦水庶能捍禦海潮兹據布政司張若震等詳估除將坦水舊有條石抵用外共需工料等銀一萬五千三百三十兩三錢零巳飭委原築石塘各員領銀承辦理合具題撫臣盧焯請停止草塘嵗修疏乾隆四年臣自乍浦至杭州相度江海情形原估建石塘五千九百三十餘丈巳完工者一千餘丈未完工者二千八百餘丈未經派築者二千三十餘丈臣親履各工逐細查勘石塘髙寬堅固足以垂諸久逺惟仁和海寧二縣交接地方草塘一帶通共四千二百一十八丈零經大學士稽曽筠移駐通判一員專管草塘工程每年約費嵗搶修銀一二萬兩不等所用夫工銀兩通判支給應需柴薪派定仁和錢塘富陽建德桐廬分水等縣分辦嵗以為常切思水勢之遷徙隨時更易工程之緩急亦隨時變通從前潮水貼塘而來自應築隄攔阻今水勢日南漲沙綿亘數十里刮滷煎鹽已成原野每年猶事嵗修殊屬糜費似應將草塘嵗修暫行停止撫臣盧焯請建草盤頭疏乾隆四年海寧縣濵臨大海向係土塘於潮汐頂沖之處建築柴草盤頭以挑大澑暫為抵禦原非經久之圖而水鹹草朽修補所在不免逮乾隆二年改建石塘以資保障萬年鞏固民慶更生其時潮水尚激塘身猶藉草盤頭挑澑是以水緩之地皆改建石塘其有草盤頭處所仍是土塘未在題估之內今水勢南遷漲沙日逺塘根之外皆成平陸則無澑可挑草盤頭巳屬無用而每年於旱地之上鑲填柴草殊屬無謂臣之愚見草盤頭不必加鑲其後身土塘一律改建石塘不但柴草工程停止節省浮費而東西兩塘大工可以接連愈加堅固可以一勞永逸查草盤頭原設十座除陳文港一座巳於查勘江海等事案內搶築石塘外尚有浦兒兜馬牧港戴家石橋秧田廟賣魚橋小墳前鄭九臯門前白牆門念里亭九座通計塘身共一百六十八丈六尺倘蒙俞允飭令兵備道確估修築則錢糧俱歸實用大工始得一律完竣矣撫臣盧焯請續築尖山未堵工疏乾隆四年尖山壩口為江海出入之處有未竣工程數十丈原因其險不能堵塞故前大學士稽曽筠奏稱請暫行停止第查尖塔兩山之間原有石壩為前人拆壞以致潮浪洶涌直衝東西兩塘今水勢南趨經由父子山外壩口僅通洄溜已化險為平矣但水性何常前之北走者今可南趨則今日南趨者安知不仍北走以今日觀之堵塞尖山在所可緩以善後計之實在所急也大學士稽曽筠請暫停者以溜勢日加湍激合龍甚艱所由磈石兩工不能兼顧儘數運至東西兩塘儹修坦水俟工竣之後另行設法堵截原未嘗以尖山壩工可以竟置不議今湍激之勢巳平坦水工程巳竣一舉合龍似在此時查尖塔兩山相去二百丈已築壩工一百二十丈未竣者僅有八十丈從前原深九丈至一十二三丈不等今現中泓深一丈九尺近壩頭深一丈六尺近塔山深一丈三尺則寬處僅有三分之一深處僅有十分之一遵照原議以磈石裝入竹簍由淺至深可免漂流之患築髙五丈即足以資捍禦臣謹繪圖恭奏撫臣盧焯請開濬備塘河疏乾隆四年浙省魚鱗大石塘現在建築惟是築塘全資石料向由海運直達工所今漲沙一望無垠石船不能攏塘擡運艱難人皆束手不但工費浩繁亦且耽延時日不得不熟籌挽運之法以濟巨工查尖山迤東海鹽縣境內三澗寨髙矮石塘之外海船可以抵塘塘內舊有河形計長一千五百三十六丈可達海寧縣而寧邑之東西土備塘內外從前取土築塘巳挖成河形自尖山以至天開河計長一萬四千三百七十餘丈即達仁和縣之范家朩橋又自范家朩橋至殊勝橋皆有舊河計長六千五百六十丈即達省城若循故道一律深通舟楫往來風濤無阻不特到工石料可免沙地扛擡一應柴草朩植皆可由內河轉運誠屬至便且在工官辨夫匠人等需用米糧食物甚多水路易行可以聚集商賈四野田連阡陌宣泄有地灌溉有資可以利益田疇附近許村西路等場柴滷鹽艘遄行不滯可以有禆鹽務除東塘段內各工員捐濬一千七百一十三丈又現在深通二千七百四十五丈西塘段內有原任大學士臣稽曽筠動用塘工餘平銀兩巳經開濬二千八百六十七丈外通計仁寧海三縣共應開一萬五千一百四十丈築壩車戽挑濬夫工需銀九千四百一十五兩零議撥乾隆二年咨報節存鹽務引費一項原係留充海塘工用此河乃海塘所必需實為緊要工用隨即派委辨員乘農隙之候分股開濬遴選大員督催儹竣將見大工物料挽運便益商竈兵民永資利賴矣撫臣盧焯請築仁錢等縣江海塘埭疏乾隆四年仁錢山蕭等縣江海塘埭均為民生捍衛今仁寧二縣海塘水勢南趨漲沙日逺北塘一帶巳如磐石之安現在嚴督催趕以竣巨工但海沙北漲潮汐南趨以致仁錢等縣江海塘工在在險要惟在先事圖維以期有備無患業將飭行確估分别緩急次第修築緣由具摺奏明欽奉硃批先事預防正當及早圖維者也欽此又經飭行勘估仁和縣自總管廟起至化支廟等處江塘七段共長七十六丈錢塘縣自流芳嶺起至獅子口張介凡等門首江塘二十一段共長九百二十丈坍矬脹裂俱係險工共估需工料銀五萬九千七百六十六兩九錢九分五釐零又山隂縣大林村之大璉樹新城村等四段湊長石塘六百一十五丈小石橋等十六段湊長土塘一千四百七十六丈會稽縣蟶浦等五段湊長石塘三百九十六丈宋家漊等六段湊長一千四十八丈蕭山縣了義塘等三段湊長石塘二百九十四丈上虞縣潭村吕家埠等十段湊長土塘一千四百三十九丈又貼建防風掃工二段計長一百四十一丈又蕭山山隂二縣所轄之麻溪壩一座矬裂坍卸有關啓閉俱屬險工共估需工料銀七萬三十兩七錢四分八釐零亟應乘時上緊興築請於撥存乾隆四年地丁等欵內動支陸續給發各員辦料趕築完固以禦潮汛海塘録卷十五
