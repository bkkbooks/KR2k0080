body:
  text: 海塘録卷八內閣中書翟均亷撰名勝二赭山咸淳臨安志舊圖志云在仁和舊治東北六十五里濱海産鹽有鹽場成化杭州府志去海寧西南四十五里髙七十五丈周三里二百步西南界仁和與紹興龕山南北對峙是為海門海寧縣志海潮至此與江流相值東不得溢益激怒作勢曹漢炎赭山詩江流曲似陽氷篆山色丹如葛令砂是也康熙十一年時有牧馬之役奉憲令紹興寺暨戎府閲視形便知府稽宗孟曰赭山瀕海外窪內湫其民撡牢盆者輸鹽租治桑麻者任土貢非有水草地以張周阹牧馬未便力持之議遂寢杭志三詰浙江當尾閭盤沍東注入海之際乃又忽作一回折其在錢塘西岸則有折山後名赭山赭折字音之誤虞喜志林注錢塘江口折山正居江中潮水投山下折而曲一至江口有反濤水勢所歸故云浙江詩錢肇修和張中丞赭山望海四首賦海雄才並子虛英髦執簡侍襜輿風生瀛島環宸極氣作胥濤衛比閭南服鯨鯢從此靜北門鎖鑰自端居文章功業誰能匹赭岸重鐫越絶書微茫皓氣涵清虛輶軒俯覽窮皇輿天綱西被星宿海地軸北注醫巫閭一線才通島夷貢千尋已奠支神居請磨蒼崖紀新咏他日價重􅒖嶁書一泓水鑑本來虛薄海安瀾慶得輿潮信未曽過冨渚谷王亦似式商閭春風百貨連雲集夜月千艘比屋居明信如公真不忝試看域外盡同書百谷風生衆竅虛海門添設塹神輿飢烏廢壘棲勾踐玉虎金函鎮闔閭槖鑰陽波縈勝地回旋斗曜拱宸居稽山古自陳王會願上南巡封禪書王錫奉和大中丞張運青先生赭山望海雄才作賦駕元虛政暇慿髙望岱輿吳越蒼茫迷國邑赭龕突兀闢門閭潮生蚌蛤皆山立日出鯨鯢盡穴居應見測波重譯至東西南朔一車書一望滄溟混紫虛東南淑氣萃扶輿門開鱉子通潮汐市雜鮫人集比閭絶島風清漸聖澤洪波日靜奠民居懷襄幸覩安瀾慶玉字何妨探禹書謾道滄桑變態虛偶因登眺一停輿橫空怪石標羅剎捲地洪濤泄尾閭行覩南交來白雉久嗤東魯祀爰居巨川欲濟慿舟楫遙憶當年説命書秦漢求仙屬子虛汪洋萬頃載方輿浪翻西浙掀浮嶼潮薄東甌撼大閭到眼乾坤都是水回頭民物盡安居始知聖主龍飛日清晏千秋炳史書嵇宗孟閲地即次江城一夜雨欵馬曉衝泥蠶女繅晴雪龎農立夏畦山橫雲嶺斷野曠夕陽低最喜鯨鯢靖海天望不迷秦皇驅不盡虎踞大江濱萬樹桃花雨半竿漁父津方壺看月出勾漏與天鄰寄語杖藜者䑯航聖澤新公輩從龍彥豫慚求牧人風塵虛畫戟阡陌有勞臣聖澤銷兵久良農買犢新車書吳越盛未許賦雲屯臣謹案赭山直北其遙峙者曰皋亭山上有遊龍潭唐白居易禱雨處其下桃花塢沿塢數里桃花最盛曰黃鶴山上有渥窪池以蘇軾賦詩得名山半為黃鶴仙洞二山在南宋時皆稱極盛其平衍者曰桐扣山即晉張華刻桐木為魚扣石鼓處曰臨平山唐邱丹隱居處凡此諸山雖去海稍逺而掩映塘北蜿蜒相望今謹附録梗概於此文堂山成化杭州府志去海寧縣西南四十五里髙三丈一尺周半里海寧縣志明永樂初以沿海扼要徙赭山巡檢司於上在赭山東半里禪機山成化杭州府志去海寧縣西南四十五里髙五丈周五里一百步海寧縣志巔有禪師井赭山西一里雷山成化杭州府志髙七丈周圍一里奔潮蕩激漸徙入海杭州府志在縣治西南四十三里葛嶴山成化杭州府志髙六丈周三里去海寧縣四十三里海寧縣志山有獐獾雉雀之屬杭州府志南八里為赭山盤山成化杭州府志去海寧縣西南四十三里髙七丈周八里海寧縣志去葛嶴東一里河莊山成化杭州府志在海寧縣西南四十里髙七丈周八里杭州府志岩門山西一里則河莊山河莊東不一里為胡家山岩門山成化杭州府志髙九十九丈周五里上有塔去海寧縣西南四十里兩浙鹽法志巍峨峭拔岩岫蟠回號為主山宋時設鹽場於此談鑰催煎廳題名記蜀山西南十餘里有岩門山亭爨相接總曰岩門蜀山鹽場海寧縣志山無佳植獸有獐獾狐兔鳥則文雉鴉雀越山成化杭州府志胡家山舊名黃山又稱越山在海寧縣西南四十里髙十丈周六里二百步海寧縣志圖經云黃山本名越城山其土色黃下有百尺浦詩范驤越城山江蘺半緑越王浦夜月初生伍員潮借得鄰翁半畝地學驅黃犢種春苗蜀山咸淳臨安志去鹽官西南二十七里成化杭州府志髙五丈周圍二里隋書地理志餘杭郡鹽官縣有蜀山宋史河渠志嘉定十二年鹽官海失故道潮衝平野二十餘里蜀山淪入海中神州古史考以蜀國之桐材扣臨平之石鼓此山得名上有蜀山洞潮決淪入海石墩山成化杭州府志髙一十丈周二里在海寧縣東南五十里邑志作去縣東十四里臨安志作石堆山杭志在西南今改正海寧縣志海上要地立巡檢司土城周四十丈營舍俱備舊戍百人今止巡卒五人虗而不守萬厯杭州府志石墩司城在石墩洪武二年設巡檢在硤石鎮十二年徙石墩二十年信國公湯和提督沿海巡司築城周百四十丈為門二環城有池小尖山成化杭州府志在海寧縣東南六十二里髙五十五丈周十里海寧縣志在石墩東一里望之若恤阜然上有烽堠大尖山成化杭州府志去海寧縣東南六十二里邑志去縣東六十四里瀕海髙九十九丈周一十里海寧縣志北距智河嶺山有白鷴文雉山萃嵂崫起亞如金牛南臨大海上有髙峰周一里最為險要建烽堠墩臺於上嘉靖總制胡宗憲閲兵龕赭徐文長渭從之共閲龕山戰地遂賦觀潮詩西湖志纂乾隆二十七年春皇上閲視海塘御製登尖山觀海作七言律詩一首恭紀首卷詩徐渭登尖山萬松滴千山妙翠不可染割取武陵源固是天所遣秦人迹無有雲中呌雞犬夜泊魚舟來下山尋不見塔山海塘通志尖山之西有一小山俗名塔山與尖山鎮鎖海口相去二百餘丈從前山胍聫接後因水勢衝開海潮江溜出入其中附近一帶海塘當沖受險乾隆三年九月興工堵築石壩至五年閏六月工竣鑄鐵牛四座分置福寧宮前一座大塔山一座新築石壩中二座以鎮之乾隆二十七年三月聖駕親臨閲視塘工御製視塔山志事詩一首恭紀首卷黃灣山成化杭州府志去海寧縣東南六十二里舊名盈山髙八十九丈周九里海寧縣志在青陽西一里形勢峭拔林木蓊翳山上立寨下有黃灣浦廟山成化杭州府志在海寧縣東南六十八里髙九十七丈周九里海寧縣志在金牛山北東扺海鹽縣界西為鳯凰山下有烽堠上有蘇皋將軍廟宋敕賜曰寧祐望夫山成化杭州府志去海寧縣東南六十二里髙七十五丈東扺海鹽海界周四里其山即廟山腳在海門海寧縣志在嵩山東一里山形峭拔立烽堠其上山嶺有石盤盤側立石常棠澉水志昔日海商失期不返其妻登盤望夫泣隕化而為石因名詩胡奎望夫山山頭日日望郎來山下長江萬里開郎去不如潮有信朝朝暮暮兩畨回設家山成化杭州府志在海寧縣東南七十里髙二十丈周圍三里海寧縣志五代談峭煉藥得道處所著有化書傳澉水志在永安湖西紫雲山之南有髙嶺入海寧縣界乃南塘仙人談峭得道處觀仙鑑所載詩亦竒迹海嶠之證峭字景升有海上詩線作長江扇作天靸鞋拋向海東邉蓬萊元是無多路只在談生拄杖前詩徐元粲經談仙嶺策杖躡危磴木落天氣清雲過少人迹虛聞松柏聲東眺澗水落了了重湖明憩足荒祠下衣冷心魂驚我欲招仙子一豁腷中情仙子去巳久樵牧徒然名回視所來徑紛紛紫翠橫海門咸淳臨安志去仁和縣東北六十里有山曰赭山與龕山對峙潮水由是門入於浙江郭璞地記所謂海門一點巽山小又曰海門筆架峰巒起皆指此海塘通志江海之門户有三省城東南龕赭兩山之間名曰南大亹禪機河莊之間名曰中小亹河莊之北海塘之南名曰北大亹此三門形勢橫江截海實為浙省之觀瀾也鹽官圖經錢塘江有海門潮所起處望之有三山隱隱可見神州古史考赭山與龕山相對是為海門俗稱鱉子門二山者江形以折水而三回山勢列海門而對峙差非鯤穴海水砰訇而上朝亦似龍門浙河奔騰而下注木生張融之思出入是門者歟詩王炎題童夀卿潮出海門圖潮來濺雪欲浮天潮去奔雷又寂然海上兩山元不動更添此意畫圖傳陳造題潮出海門圖二首絶島平岡捲欲空兩崖相對屹穹崇即今畫手兼詩筆更與江山角長雄卷裏波濤快一披蒼山擁起雪山馳浮天沃日無窮意到我春忩病酒時朱純登龕山長江限吳越形勝一何雄島嶼蒼茫外乾坤浩蕩中江連埋日霧汀暗走沙風忽起乘桴嘆滄洲不可窮觀潮樓在江干亦稱大觀樓西湖志康熙四十二年恭逢聖祖仁皇帝巡幸江浙御製錢塘江潮詩一首恭紀首卷四十六年聖駕再巡至浙由江上幸雲棲舟中御製詩一首恭紀首卷皆恭勒穹碑建亭於臨江髙岸復搆層樓奉懸御題恬波利濟四字扁額西湖志纂其地正對海門當潮汐往來之衝為浙右之大觀乾隆十六年春翠華臨幸登樓觀潮御製錢塘觀潮歌恭紀首卷乾隆二十二年皇上再舉省方之典閲視海塘復登斯樓是日春潮暗長波濤不驚御製觀江潮作歌詩一首恭紀首卷三月二十八日禮部奉上諭恭紀首卷以邇年以來海波不揚塘工鞏固瀕海諸邑得慶安瀾利及生民實資神祐敕建海神廟於省城之觀潮樓詳祠祀門六和塔杭州圖經在龍山月輪峰開寶三年智果禪師始建塔因即其地造寺咸淳臨安志即舊壽寧院智覺禪師延壽於錢氏南果園開山建塔以鎮江潮塔髙九級長五十餘丈內藏舍利或時光明煥發大江中舟人瞻見之後廢巳而江潮洶湧石岸沉壞至紹興十二年奉旨重造二十六年僧智曇因故基成之七層而止自後潮為之却人利賴焉武林梵志梁開平五年吳越王於仁王廢院掘地得大錢以為瑞應因建大錢寺設寶幢二座於寺門入宋寺廢智覺乃即南果園建塔七修類藁舊髙九級濶數十圍後為方臘焚毁紹興時重造七層髙大雖減於前亦兩浙之塔無出其右者至元復遭兵火故今光磚巍然四圍損取中木燋痕尚存惟內可盤旋而上也然在下望者精神亦為之恍惚塔內四壁俱鑿佛像有石刻吳道子觀音佑聖之像金剛經三十二分乃北宋富弼賈昌朝等各書一分四十二章經乃南宋湯思退虞允文等各書一章宋名卿筆迹可半矣亦竒物也西湖志佛説四十二章經在六和塔第一段沈該正書第二段湯思退正書第三段陳誠之正書第四段陳康伯正書第五段王綸正書第六段賀允中正書第七段葉義問正書第八段楊椿正書第九段周麟之正書第十段洪遵正書第十一段楊偰正書第十二段沈介正書第十三段趙令詪正書第十四段孫道夫行書第十五段王希亮正書第十六段黃祖舜正書第十七段張孝祥正書第十八段宋棐正書第十九段金安節正書第二十段李洪正書第二十一段董蘋正書第二十二段錢端禮行書第二十三段張宗元正書第二十四段張運行書第二十五段楊朴行書第二十六段莫溕正書第二十七段路彬行書第二十八段張廷實正書第二十九段周操行書第三十段葉謙亨行書第三十一段胡汸行書第三十二段陳俊卿正書第三十三段鮑彪正書第三十四段陳棠正書第三十五段楊邦弼正書第三十六段張洙正書第三十七段黃子淳行書第三十八段楊倓正書第三十九段沈樞正書第四十段韓彥直行書第四十一段虞允文正書第四十二段洪邁正書末題云聖宋紹興乙卯冬十一月西蜀布衣武翊跋都勸緣住持傳慈恩教僧智曇立石右大小諸經拓俱極一時書人之選且字畫完好可玩也萬厯杭州府志明嘉靖十二年開化寺與塔俱毁萬厯間僧祩宏重修西湖志纂國朝雍正十三年奉敕鼎建乾隆十六年三月初五日聖駕巡幸御製開化寺詩恭紀首卷御題寺額曰淨宇江天御書聫句云潮聲自演大乘法塔影常懸無住身三月十二日聖駕又幸御製開化寺再作詩恭紀首卷御製登開化寺六和塔記恭紀首卷復於塔上欽賜御書扁額第一層曰初地堅固第二層曰二諦俱融第三層曰三明淨域第四層曰四天寶網第五層曰五雲扶蓋第六層曰六鼇負戴第七層曰七寶莊嚴御製登六和塔作歌詩恭紀首卷二十二年御製開化寺五律一首恭紀首卷登六和塔五古一首恭紀首卷二十七年御製暮春瞻禮六和塔詩恭紀首卷又御題開化寺詩恭紀首卷文曹勛臨安府重建月輪山夀寧院塔記嘗謂天下之事利害相若惟能因利以除害則利斯得而害乃去錢塘昔號都會既天子建翠鳯之旗為駐蹕之地可謂據東南天設之險而浙江介於吳越一晝一夜濤頭自海而上者再掠堤突岸摧陷莫測甚至捲民廬舍衝壞田畝為臨安之患久矣雖智者逺謀巧者述之莫能禦也錢氏時有僧智覺禪師延壽同僧統贊寧創建斯塔用以為鎮相傳自爾潮習故道邉江石岸無沖墊之失緣堤居民無驚溺之虞聞者德之逮宣和三祀塔與寺為寇盜所爇潮復為患巨浸怒沫頃刻間搗堤壞屋侵附江之陸數十百丈民雖實苦其害然迄無以措手紹興嵗在壬申天子憂之思所以制其害者在廷之臣首以復興斯塔為請詔賜可下有司計度意將官給金幣庀工治材而都下守臣擇可主持斯事得僧智曇戒行精潔道業堅固可任以幹緣乃縷陳磚石土朩方隅廣袤所以復塔之意曇口諾心然願以身任其勞仍不以絲毫出於官請得募民衆畢兹勝事都守即日命往住持是院曇自被命和義郡王楊存中率先衆力出俸資助居士董仲永以家之器用衣物捨以供費先造僧寮庫司水陸堂藏殿安存新衆俾來者有歸以致中堂蓮社聞風樂施雲臻霧集雖逺在他路亦荷擔而來自癸酉仲春鳩工至癸未之春五層告成是年晚嵗則七級就緒巍然揭立成數十尋跨陸俯川闌楯層橑面面開敞寶網鳴鐸光動山海撑空突兀已立於風煙之上外則規制壯麗氣象雄傑日以萬衆觀喜瞻仰得未曽有內則磴道以登環壁刋金剛經列於上下及塑五十三善知識備盡莊嚴至於佛菩薩衆各以次位置凡所以鎮靜山川護持法界者莫不閡而存焉塔興之初土石未及百簣而潮勢雖仍洶湧已不復向來之害以故衣冠緇黃耆艾士民德曇甚深拱手贊嘆是塔也不特鎮伏潮不為害又航於海者寅夕昏晦星月沉象舟人未知攸濟則必向塔之方視塔中之燈光以為指南則海航無迷津之憂矣致富商大舶尤所歸向而喜捨無難色此又塔之利也塔將圓滿寺衆以事之始末求豫文以記其實曇東人也體識深敏早受律儀持教臨壇已踰三紀信心之士往往聫芳咀妙割縛導迷作大方便護於羣生顧豫知曇之戮力乃申利害之所出陳上聖之憂勞紀廷臣之建言道曇之率衆與夫工徒用度之數皆托其實庶知不假聲勢成茲利益備諸難事而盡未來際千百載下僧俗當共謹護以為此邦植福豈不美哉約用工費百萬緡錢二十萬云詩孔平仲遊六和寺同尋六和寺去旁蒼崖行峥嶸石林氣㶁㶁流水鳴見此俗慮減入門心更清盤空到窈窕小憩山前亭天晴修竹外颯有風雨聲僧云金魚池近日秋雨足餘波落清壁散作雪色瀑徐興視其流登髙穿屈曲忽逢白練飛碎點濺珠玉清冷振毛髮瀟灑蕩心腹金魚在何處演漾戲平渌鱗鬛老愈黃點漆作雙目憶為兒童時嘗劇此池旁聞人説金魚已謂百嵗強今踰二十年僧死草朩荒此魚尚無著纎質不改常謂魚非靈物安得擅久長四海波浪髙三江網羅密長鯨失明珠幽暗每向日我疑龍變化就此溪中逸紛綸乾坤爭浩蕩風霆出何如守一泓無得亦無失趙抃次韻趙少師題六和寺壁上方樓殿已幽深更向諸峰勝處尋金擺池魚驚俗眼琴調山溜寫清音紅芝九本初無種翠柏千株自有心衆羡宮師康且壽始知功德積來隂蘇軾六和寺沖師閘山溪為水軒欲放清溪自在流忍教氷雪落砂洲出山定被江潮涴能為山僧更少留蘇軾六和寺送張職方吉甫赴閩漕羡君超然鸞鶴姿江湖欲下還飛去空使吳兒怨不留青山漫漫七閩路門前江水去掀天寺後青池碧玉環君如大江日千里我如此水千山底朱繼芳六和塔三百有餘年潮頭不敢顛孤尖標白浪層級上青天鈴隔山僧唄燈通海客船老來登眺眼不道步難前尹廷髙登六和塔絶頂江分吳越緑漫漫間向浮圖絶頂看目覽錢塘殊覺小身遊玉宇不知寒海連芳草春潮急山擁頽峯古朩蟠遊子舉頭應怪問何人天半拍闌干張翥登六和塔江上浮屠快一登望中煙岸是西興日生滄海橫流外人立青冥最上層潮落逺沙羣下雁樹欹髙壁獨巢鷹百年等是豪華盡怕聽興亡懶問僧錢惟善六和觀月招提髙占月輪峰樓閣清虛十二重秋意天香飄古桂冷凝岩雪落長松池光照夜明金鯽塔影橫江卧玉龍聞道廣寒從此往竹房開處約飛笻鎮海塔杭州府志舊名占鼇明海寧縣知縣郭一輪經始築基知縣陳揚明繼之萬厯四十年壬子正月鳩工告成於九月髙百五十丈廣周九十有六尺回廊翼欄達七級頂董斯役者典史王時朝也海寧縣志塔在邑治巽隅郭一輪以寧邑面大海故起巽峰鎮之築基一級有竒去任陳揚明續蒞茲土議竟舊令之緒會鹺直指張惟任司理孫穀亷得施金所贏畀揚明襄成厥事崇正時邑紳陳之遴之暹重修後復傾圮康熙十五年八月縣令許三禮又修易名曰鎮海都御史陳敱永撰記文陳揚明登占鼇塔記略載登浩劫實創熙時聳玉柱以擎天奠金鼇而駕海延望北極呼吸可達層霄俯眺南溟扶搖直乘萬里挹西山之爽氣迓東泛之曙暉雲近蓬萊鬱鬱霞蒸龍變春深岡阜藹藹梧棲鳯鳴故冝海若效靈地脈永奠卜金甌於皇圖觀玉燭之聖化云時同眺者廣文常君來王季君培薑君尚賓也爰勒貞珉以紀盛事陳敳永重建鎮海塔記寧邑居浙江之表朝潮夕汐由大洋而來南有上虞餘姚逼處於前東有大尖鳯凰諸山角張於左而江流又逆遏於上其回溜湍激彌甚陽侯不戒往往有淪胥之懼自昔形象家言惟建塔鎮鎖則狂瀾可障地脈可固不寧惟是抑文教所由蔚興民生所由殷阜明萬厯中邑侯郭公採用形家之法遂於壬子嵗肇建是塔於海堧實為邑治及學宮之巽峰次年工未訖伯祖昆吾公獲簡庶常嗣此而蕊榜羣登杏園偕宴者未易更僕數戊辰秋颶風大作毁塔相輪是嵗簮紳之士遷謫云亡者十有八人癸酉祝融肆災塔上下欄楣俱燬秋闈遂無一人得售者至丙子家君請於邑侯謝公復捐資拮據躬率匠石以修葺之明年丁丑先伯素菴公幸掄鼎甲而家君亦於丙子秋獲售焉顧自丙子迄今時逾三紀中更兵燹塔摧頽殆盡賢侯許公無日不為茲土興利而深知形家之説非虛也謂民之生聚士之教育皆為地靈所鍾繄惟茲塔是賴且以甲辰之秋洪濤泛濫郭外之㕓如泛宅也民至今惴惴焉為之遐稽史籍嘗見元大定以後頻有海患致和元年遣使禱祀且造浮圖二百一十有六實以七寶珠玉半置海畔半置水中以鎮海災而今更以巍巍貝塔鎮焉其功不更巨乎因與邑之縉紳庶士協力鳩工以興復之而名之曰鎮海將貽海甸永利也工初竣嵗大稔四野三農有滿篝滿車之慶髦士橫經講學亦兆連茹彚征之象是文教之昌隆實由民生之康樂也誰曰非德舉哉余承乏蘭臺遙計梓鄉事宜謂莫尚於此詎意公有同心不費公帑而捐清俸以經治不數月而落成今塗謡巷謳傳公嘉德達於京輦余乃琢樂石勒之以識勿諼且以昭示來􅑤云詩祝以豳登占鼇塔亭亭玉搆接崔嵬躡級慿虛亦快哉天柱近從杯底出滄溟遙向鏡中開百年召杜留恩澤一代文章叶上台員嶠方壺應咫尺何人先掣巨鼇來葛徵磻春日登占鼇塔百尺鼇峰矗上遊慿虛野眺午煙收放窮兩目潮初退拭淨千山翠欲浮響出雲中聞畫角霞開朩末起朱樓間心便逐輕鷗去幾度遙呼一葉舟李因九日登塔和許邑侯原韻約伴登髙遊騎停海天雲淨數峯青十尋古塔驅羅剎幾劫滄桑伏地靈白社相邀多後起詞壇有主繼先型胥濤日夜蛟龍吼縹眇蜃樓出北溟安瀾園在海寧縣拱辰門內前豫告大學士陳元龍之别業也初名隅園明太常與郊建地逺闤闠池周二十餘畝舊有竹堂流香亭月閣紫芝樓金波橋諸勝逮元龍易名遂初園世宗憲皇帝賜陳元龍林泉耆碩四字恭奉園中賜安堂樓乾隆二十七年上已皇上閲視海塘駐蹕於此賜名安瀾園題安瀾園水竹延清二額并對聫一副御製駐陳氏安瀾園即事雜咏五言律詩六首恭紀首卷文王稚登紫芝樓記贈諌議陳公風山之祀於鄉賢也蓋其長子太常君歸田之日久矣初太常與弟憲副君相繼成進士起家博士弟子鄉人父老以贈公祀鄉賢請太常兄弟謝不敢逮太常兄弟仕於朝又請又謝不敢迄今去之幾三十年太常君中吏議免而請如前當道報可始從祀矣明日而芝生於祠之左楹又明日又生三日又生其數七至九其廣六七寸至三四寸其色紫其狀若牡丹其香絪緼若都梁雞舌然邑人觀者無不歎為竒瑞當之者不在太常君兄弟必在其後人太常君兄弟復謝不敢曰微先諫議之德不逮此乃署其樓曰紫芝以永孝思授余記其實余習於太常君而悉贈公為賢豪長者也贈公以文雄於諸生間五試有司不售遂罷去雖老於青襟乎而負意氣重然諾家貧屢空任俠自喜其豫人若棄人豫之若汚韓太史應龍未第日嘗貸百金既第未及償而卒韓夫人償之以帶曰太史遺命也公拒不受里人鬭而衊其處子處子將雉經公憤然白於惠文使者而兩家之獄解爭持牛酒為壽公笑曰吾哀髽者而居間豈望報耶屬嵗旱出粟三百斛賑飢者帥一鄉之人禱雨雨亦獨遍一鄉鄉人語曰天道不偶視陳叟其為德類若此沒而祀於鄉蓋出鄉人父老意博士弟子意非以太常兄弟不者太常君歸第里羅雀其門矣誰為私之而復請之卒令爼豆蒸嘗廟食世之非輿人之公論疇克致然昔稱芝草非一若九莖三秀皆王者之瑞其次則家室子孫正祥故謝太傅以芝蘭玉樹比佳子弟而虞翻又云芝草無根芝或産於土産於石産於澗谷産於階庭産於階庭者竒矣乃若産祠宇産棟楹者竒甚産而連三日其數九其大幾尺其色殷然其氣芬芬然竒又甚贈公當之德之休明黍稷維馨嗇於其身啓佑後人太常君兄弟當之伯兮叔兮鳯凰於飛其翼差池王之羽儀陳氏後人當之佩玉冠裳濟濟鏘鏘勿替引之奕世其昌乎陳之先代自太邱而元方而長文位愈顯而德愈微不若贈公之後公無慚鄉鄉無慚長也芝之為瑞豈偶然哉遂歌曰紫芝英英産於廟楹匪芝也者英維德之馨紫芝叢叢産於廟宮匪芝也者叢維德之隆芝絪緼也子孫振振靡勿有聞也而駟而車大而門也記成請書於樓之壁歌而祀之以代祝史陳元龍遂初園詩序寧邑城西北隅多陂池昔從曽祖明太常公因池為園名隅園嵗久荒廢余就故址為補植竹木重葺館舍翼退休歸老焉而出入中外任巨責重雖年逾大耋不敢自有其身林壑之思徒托諸夢寐間耳癸丑春衰病且篤疏請致政蒙聖主俯俞重以恩禮賜賚稠疊御書堂額以光里第曰林泉耆碩則家中所有一池之水千竿之竹不異鑑湖之賜竊幸初心之獲遂也因名之曰遂初園令家僮掃徑策杖而遊園本近市經曲巷忽見茂林修竹即園門也入門屋三楹曰城隅花墅有長廊曰引勝旁倚修陂皆種梅花循廊而西有一大池望見堂宇在水中央平橋橫亘曰小石梁過橋有古藤水榭臨水回廊繞之中峙一堂曰環碧堂廣庭面沼水色林巒回環左右堂之右曰清映軒階前文石有流觴曲水之致東曰溪槎跨水如舟臨岸多薔薇屏葡萄架西曰澄瀾館西池寬廣水光澄徹池中有一亭曰煙波風月之亭凌空慿眺晴雨皆冝中間有樓五間曰逍遙樓前俯平岡種牡丹數十本北檻倚清流對面梅花滿山麓間樓之西偏渡小橋穿山徑别有院曰靜明書屋南榮北牖軒爽可悅心目自此而西池流益廣景象空明有堂翼然八窗洞達斯堂也實為一園之主敬奉天章以垂不朽而名斯堂曰賜安堂安老於斯永永不忘君賜也堂之右矗以崇岡環以幽麓循級登其巔有亭曰翠微亭以供憑眺下有崎石磯可坐而垂綸岡之南有環橋東西二池交會於此橋之南有山皆種桃杏花開時髣佛武陵溪畔桃山之南桂樹數百株髙下茂密中有亭曰天香塢極小山叢桂之勝旁有小閣曰羣芳閣登閣則梅杏桃李桂花皆在目前從山根折而東曲橋宛轉如長虹可通於環碧堂再折而南有曲澗夾岸石壁松柏交蔭由環碧堂以通於南池中隔髙阜林木鬱蔥儼如峻嶺南池之西有軒曰漾月軒初月澄潭天水一色池南修竹之中有亭曰南澗亭北望林煙山翠如列屏幛迤東有樓四面曲折曰十二樓與城隅花墅相接園之西尚有隙地為魚池為菜圃可供朝夕之需此遂初園之大槩也園無雕繢無粉飾無名花竒石而池水竹木幽雅古朴悠然塵外老人隨意所之遊覽既畢良晨佳夕可以觴咏可以寤歌因各系以詩焉盧軒北園修禊詩序康熙三十一年三月三日東海侍御君修禊北園集者二十一人峩冠長鋏並同臨水之嬉艾髮垂髫齊赴采蘭之會玉峯當户石指鳯凰金谷開尊杯傳鸚鵡分曹角戲隔窗聞落子之聲却坐偷間慿檻試垂綸之手或蹣跚於籬落或俯仰於橋梁禮數無拘興居盡適於時薄雲露日暖靄烘春繡弱草之如茵花霏紅雨映澄潭之似鏡栁結翠煙宛宛流鶯歌同秦女翾翾舞蝶夢返莊生惟人事之多歡覺物華之耐賞侍御君乃酒酣耳熱四望超然心曠神怡片言莞爾出苔箋以細擘拂玳管以徐傳工部麗人行分為韻腳右軍蘭亭序即是詩題羣公既義手而前此客遂撚鬚於後吟成古體句綴五言難希鸞嘯之清若為藏拙欲避蝟毛之罰聊用解嘲詩王稚登隅園小圃臨湍結薜蘿主人日涉趣如何幽花時灌寒猶好小鳥春來雨亦歌雅稱琴尊清晝賞不妨樵牧夕陽過政成京國歸間樂只讓溫公五畝多葛徵竒赴陶社晚眺隅園三月晴不足雨暗花濛濛大澗小澗鳴百道相回通潭魚躍新水竹罅飛流紅林景閟深翳叢樹密生風禽鳥忽變聲乃知天氣融登髙一何極澄覽衆慮空日夕園宇靜歷歷山巃嵸眷懷幽人貞欣賞與世同我行違性命異患干其躬曠莽天地間局促如微蟲元理羣所貴耳目悅且充道上坐垂釣悠然滄浪中盧軒北園修禊上巳古令節肇置洛邑卜一從山隂會良宴難更僕大都詩酒并一洗塵垢宿比來漸寂寥此意誰能復寒食到清明傾城事徴逐棕鞋踏岸草羅裙拂山麓怪來三月三足音絶空谷歸休繡衣郎灑落決邉幅家有陳遵井體空周顗腹城隅得佳地茂林蔭修竹紫蓴出千里名酒置百斛折簡召賓友膝席迎伯叔笑指平階下方池清可掬何妨同袚除臨流解春服今年春事早冷節過百六緑戰並紅酣爛熳罄花木便恐栁綿催韶光肯留目所幸天意美兩日分寒燠風來和以暢氣至清且淑及此不尋芳悔殺唐杜牧把盞盡日飲醉茵眠漸熟聽報山坳月半規照墻屋盧軒賦五絶用逺字二首暮春快觴咏勝事聞近逺雖復後永和不嘆豫生晚鶯啼選樹深花落隨流逺安得繫日繩一留春晼晚仲宏道秋日同杜其芳文學遊陳氏隅園畫閣凌波出幽亭望竹開啓簾鴛自穩闔户蝶還來秋老雲彌淨林髙風欲摧登臨雙屐倦笑語席莓苔陳元龍城隅花墅莫嫌近市少清娛林朩依然有一隅種樹十年隂已茂為山萬仭意成圖還家敢擬鄉名鄭歸卧真堪谷號愚童子候門迎我笑田園猶喜未全蕪陳元龍小石梁隔塵便是白雲鄉笑指溪橋擬石梁行過東西殊縹眇水分南北自汪洋髙梧影直間垂釣雙栁隂濃坐納涼最愛月明風靜處淵魚極樂鳥回翔陳元龍古藤水榭池回岸斗見泱泱水榭空明繞曲廊蘭薄當階清影動古藤垂架緑隂涼風來嶺畔飄林翠月到波心射屋梁簾幕不施貪騁目畫圖一幅似瀟湘陳元龍環碧堂疏簾曲檻水中央風月煙霞萃一堂日暖波光搖素壁晚晴山翠入回廊畫圖凝緑多生趣几硯浮雲自有香隔斷紅塵依碧落蕭間無事對滄浪陳元龍清映軒碧檻回廊抱此軒髙低文石水沄沄激湍時向階前湧過雨微聞澗底喧林樹風多清影動煙波晴漾白雲屯置身畫裏消長晝又見山頭月一䀶陳元龍澄瀾館塍埒盤紆又一池步櫩曲屋俯漣漪幽篁風度鳴千管髙栁晴空織萬絲山愛斜陽回照處水留新月未沉時西來皓氣秋先至一望空明有所思陳元龍溪槎買得吳舲倚岸東髙柯深處百花叢芙渠檻畔迎初日楊栁磯頭漾晚風天上坐時疑縹眇洞房小處更玲瓏人間自有仙源好漫道銀河路可通陳元龍逍遙樓梅杏重重繞一洲背山臨水有髙樓花香縹眇穿雲近樹色參差入幕收夜靜潮聲來枕上風清月影滿牀頭海天空曠間慿眺便擬逍遙物外遊陳元龍煙波風月之亭最愛虛明景象殊凌空小榭儼氷壺天邉風月為吾有江上煙波得似無橫笛飛聲千樹動髙吟寡和一亭孤此身已在塵氛外寧必扁舟下五湖陳元龍靜明書屋林幽境杳似深山靜掩書堂水一灣北牖南榮風日好花香鳥語性情間堆床卷帙空摩眼滿地莓苔欲閉關只有樵青來竹外茶煙一縷聽潺湲陳元龍賜安堂主恩安老賜林泉近水堂開别有天竹樹隂濃飛濕翠山巒環擁漾晴煙八窗風月疑塵外四面芬芳列眼前誰信此中安一叟太平無事獨翛然陳元龍翠微亭山頭亭子白雲間修竹蒼松列翠環野鶴飛從巖下過天香近向月中攀路穿石磴藏三徑橋鎖清池剩半環策杖登臨朝復暮散人今擬號髙間陳元龍崎石磯山阿水澨正涼初坐愛磯頭望太虛便欲遨遊窮碧落可知俯仰在方諸波光搖蕩曾何定雲影浮沉任所如回首乍看新月上手中垂釣巳忘魚陳元龍天香塢四照亭虛倚曲闌山阿叢桂出林端玲瓏碧玉千枝繞燦爛黃金萬蘂攢馥郁不隨風乍散氤氲如與露俱漙秋光留取天香久月皎霜清仔細看陳元龍羣芳閣山頭小閣挹芳華一望山頭總是花千樹寒梅香似雪百層紅杏氣蒸霞平鋪不覺溪流隔俯視無愁月影遮更愛秋香金粟滿西風颯颯見霜葩陳元龍漾月軒晚來間步恣幽探待月東軒倚碧潭明鏡未曽天上挂氷輪先向水中涵搖光直欲通銀漢散彩渾疑浣蔚藍坐賞空明人不寐城頭乍聽鼓聲三陳元龍南澗亭北沼南池一澗通兩崖翠壁亦巃嵸半篙清淺藤蘿裏小艇夷猶水石中山徑雲遮迷牧竪溪頭雨歇卧漁翁尋幽欲到林深處堤斷橋回未可窮陳元龍十二樓池邉結屋愛清幽窈窕湘簾最上頭曲院鶯花人欲醉層軒風月座中收笑無紅袖慿雕檻剩有霜顛倚畫樓浪得嘉名誇十二任他遊客慕風流安國寺鹽官圖經在縣西北六百五十步寺中有悟空塔塔前有古檜存焉咸淳臨安志唐開元元年建名鎮國海昌院五年廢大中四年復置名齊豐祥符元年改今額熙寧七年僧居則建大悲閣文忠公題梁明年為之記藏殿後有唐會昌石經幢二寺門東有咸通石經幢一又在殿下者二無嵗月字畫類唐人有古檜宣和中朱勔移以去成化杭州府志元至正二年重建明洪武二十四年立成叢林有放生池在寺前安國寺志唐咸亨間寺基陸地生蓮有異僧至此因海患招徒衆法昌法昕等祈禱海不揚波始創菴居後因賜額為寺寺外有橋曰大來曰安化曰泊堍説者謂三橋兩寺半千僧秀奪南湖萬頃隂皆實景也明朱淡菴蘇雪溪嘗為安國寺八咏曰髙閣晴雲長廊夕照檜林月色輪藏金聲方廣靈迹悟空遺迹華鯨夜吼蓮沼秋紅海寧縣志永樂三年建三解脫門後甃石為九蓮池為藏經閣凡雨㿩祈禱祝聖有儀皆在於此稱海上名山之冠西湖志纂乾隆二十七年三月聖駕臨幸御題佛殿之額曰法海安禪賜題佛殿柱聫云香水護須彌功德常澄一鏡妙華現優鉢莊嚴合證三輪文釋元昭法界相記略餘杭郡鹽官邑安國寺有唐開元首嵗創建元和末歷齊安禪師闡化於此一時盛集備見前記屬會昌梗塞例為焚除大中祥符初復易今額歷年茲多獨結界之法未聞於前逮天聖中慧雲法師諱子倫者以德業內充力扶遺教首謀締搆未遂而終於今一闕之衆猶居自然宿往髙流常所歎息乃相與籌謀併力經營命毗尼師主法行事凡百軌度率循舊章實元豐三年十二月二十四夜秉燭告就即勒略相垂諸不朽蘇軾大悲閣記羊豕以為羞五味以和之秫稻以為酒麯蘖以作之天下之所同也其材同其水火之齊均其寒暑燥濕之候一也而二人為之則美惡不齊豈其所以美者不可以數取歟然古之為方者未嘗遺數也能者即數以得其妙不能者循數以得其略其出一也有能有不能而精粗見焉人見其二也則求其精於數外而棄迹以逐妙曰我知酒食之所美也而略其分劑捨其度數以為不在是也而一以意造則其不為人之所嘔棄寡矣今吾學者之病亦然天文地理音樂律厯宮廟服器冠婚喪紀之法春秋之所去取禮之所可刑之所禁歷代所之所廢興在其人之賢不肖此學者之所宜盡力也曰是皆不足學學其不可傳於書而載於口者子夏曰日知其所亡月無忘其所能可謂好學也巳古之學者其所亡與其所能皆可以一二數而日月見也如今世之學者所亡者果何物而所能者果何事耶孔子曰吾嘗終日不食終夜不寢以思無益不如學也由是觀之廢學而徒思者孔子之所禁而今世之所尚也豈惟吾學者至於為佛者亦然齋戒持律講誦其書而崇飾塔廟此佛之所以日夜教人者也而其徒或者以為齋戒持律不如無心講誦其書不如無言崇飾塔廟不如無為其中無心其口無言其身無為則飽食遊嬉而已矣是為大言以欺佛者也杭州鹽官安國寺僧居則自九嵗出家十年而得惡疾垂死自誓於佛願持律終身且造千手眼觀世音像而誦其名千萬聲病巳而力不給則縮衣節口三十餘年銖積寸纍以迄於成其髙九仭為大屋四重以居之而求文以為記余嘗以斯語告東南之士矣蓋僅有從者獨喜則之勤苦從事於有為篤志守節老而不衰異夫為大言以欺佛者故為之記且以風吾黨之士云詩蘇軾鹽官北寺悟空塔巳將世界等微塵空裏浮花夢裏身豈為龍顔更分别只應天眼識天人蘇軾塔前古檜當年雙檜是雙童相對無言老更恭庭雪到腰埋不死如今化作兩蒼龍釋贊寧悟空塔浮圖蕭瑟入虛空一聚全身罔象中傳馬祖心開佛印識龍潛主示神通毫光委墜江樓月道氣馨香海岸風此地化緣才始盡更於何處動魔宮釋智潤登安國寺南樓半生雲水恣遨遊覽勝重登百尺樓疊嶂逺排晴漢出寒潮猶帶夕陽流鐘聲隱約聞吳越簾影依稀拂斗牛喚起悲秋懷古恨斷鴻嘹嚦滿滄洲張昱安國問牛軒為訥無言賦犀牛不逐扇俱破奈有人來問此軒資福無端添注腳石霜何事未忘言大千無迹身俱化一點通明角尚存拈起家風隨手應莫言無可付兒孫胡奎大悲閣寶閣凌空十丈髙倚欄東望際鯨濤天花散處皆金地海月生時見白毫夜氣澄清龍在窟秋聲蕭爽鶴鳴臯丹梯咫尺諸天近香霧霏霏濕苧袍尹士良大悲閣巍巍髙閣壯華彛妙智名存八尺碑金剎龍飛滄海近碧梧鳯宿彩雲垂蘇家文字傳三代釋氏圓明了二儀萬法一歸何處是本來面目未生時朱禋檜林月色雙檜亭亭立化城夜深相對不勝清半窗偃蹇疑龍化滿地槎牙亂月明涼沁金波分黛色瞑和風鐸振秋聲一從艮嶽移根去野鶴山猿夢亦驚蘇平蓮沼秋紅一鏡方塘玉井通露華無數倚秋風日臨滄海雲霞爛月落寒潭色相空亂影欲迷匡阜路清香疑在若耶中風流不減陶元亮結社於今有逺公海塘録卷八
