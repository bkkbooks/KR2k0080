body:
  text: 海塘録卷二十五內閣中書翟均廉撰藝文八五言排律樟亭觀潮唐宋昱濤來勢轉雄獵獵駕長風雷震雲霓裏山飛霜雪中激流髙失岸吹潦上侵空翕闢乾坤異盈虛日月同艅艎從陸起洲浦隔阡通跳沫噴巖翠翻波帶景紅怒湍初抵北却浪復歸東寂聽堪增勇晴看自發䝉伍生傳或謬枚叟說難工來信應無已申威亦匪窮衝騰如决勝回合似相攻委質任平視誰能測始終越江秋曙唐蕭穎士扁舟東路遠曉月下江濆瀲灔信潮上蒼茫孤嶼分林聲寒動葉水氣曙連雲暾日浪中出榜歌天際聞伯鸞常去國安道惜離羣延首剡溪近詠言懷數君東樓南望八韻唐白居易不厭東南望江樓對海門風濤生有信天水合無痕鷁帶雲帆動鷗和雪浪翻魚鹽聚為市煙火起成村日腳金波碎峯頭鈿㸃繁送秋千里雁報暝一聲猿已豁煩襟悶仍開病眼昏郡中登眺處無勝此東軒渡西陵十六韻并序唐李紳七年冬十有三日早渡浙江寒雨方霖軍吏悉在江次越人年穀未成霪雨不止田畝浸溢水不及穗者數寸余至驛命押衙裴行宗先齎祝辭東望拜大禹廟且以百姓請命雨收雲息日朗者三旬有五日刈穫皆畢有以見神之不欺也雨送奔濤逺風收駭浪平截流張斾影分岸走鼙聲獸逐銜波湧龜艨噴棹輕海門凝霧暗江渚濕雲橫雁翼看舟子魚鱗辨水營騎交遮戍合戈簇擁沙明謬履千夫長將詢百吏情下車占黍稷冬雨害粢盛望禱依前聖垂休冀厚生半江猶慘淡全野已澄清愛景三辰朗祥農萬庾盈浦程通曲嶼海色媚重城弓日鞬櫜動旗風虎豹爭及郊揮白羽入里卷紅旌愷悌思陳力端莊冀表誠臨人與安俗非止奉師貞杭州觀潮唐姚合樓有樟亭號濤來自古今勢連滄海濶色比白雲深怒雪驅寒氣狂雷散大音浪髙風更起波急石難沈鳥懼多遙過龍驚不敢吟坳如開玉穴危似走瓊岑但禠千人魄那知伍相心岸摧連古道洲漲踣叢林跳沫山皆濕當江日半隂天然與禹鑿此理遣誰尋和運使舍人觀潮次韻宋范仲淹何處潮偏盛錢塘無與儔誰能問天意獨此見濤頭海浦吞來盡江城打欲浮勢雄驅島嶼聲怒戰貔貅萬叠雲才起千尋練不收長風方破浪一氣自橫秋髙岸驚先裂羣源怯倒流騰凌大鵾化浩蕩六鰲遊北客觀猶愳吳貌弄弗憂子胥忠義者無覆巨川舟把酒問東溟潮從何代生寧非天吐納長逐月虧盈暴怒中秋勢雄豪半夜聲堂堂雲陳合屹屹雪中行海靣雷霆聚江心瀑布橫巨防連地震羣楫望風迎踊若蛟龍鬭奔如雨雹驚來知千古信回見百川平破浪功難敵驅山力可并伍胥神不泯憑此發威名國朝錢塘晚渡王錫兩岸芙蓉醉秋江入畫圖風多歸鳥亂日落片帆孤漁子波心釣舟人渡口呼荻花飛雪盡楊栁著霜枯雲物方辭越關津忽到吳水寒烟不起山遠樹全無緑綺琴猶在紅亭酒用沽名心輕早歲世味識窮途異國疏狂客鄉鄰笑豎儒還家莫惆悵蘿月弄西湖五言截句初下浙江舟中口號唐孟浩然八月觀潮罷三江越海潯回瞻魏闕路空復子牟心杭州祝濤頭二首唐徐凝不道沙隄盡猶欺石棧頑寄言能白雪休厺打青山送薛二十三郎中赴婺州唐姚合我住浙江西君厺浙江東日日心來往不畏浙江風别杭州唐姚合醉與江濤别江濤惜我逰他年婚嫁了終老此江頭晚望宋度宗鷗鷺歸烟渚秋江挾晚晴老漁閒檥艇坐待月華生宴玉津園江樓宋任希夷風靜潮痕減江空夕照多星星波上艇隱隱岸邊莎風光連北闕景物傍西湖禁籞濤江上兹樓天下無虛齊留御榻小徑近層崖再拜觀奎畫渾疑侍玉階參天宫柏翠布地禁花紅臺沼如文囿規摹有汴風江上宋釋永頤江頭雲閣雨栁色與春深船發春風阻誰知客子心秋江曉渡圖元楊維禎船泊大江口行人與馬爭不如漁艇子高卧待潮平東歸次錢塘先寄弟元范欽月落天將曙風高浪欲層夜來春草夢先已度西陵春夜錢塘江行元吳宗儒小艇發江干入夜東風起帶雨掛輕帆西行三百里潮元孫承宗休嫁弄潮兒潮今已失信乘我油璧車厺向錢塘問江村法聚殘陽在木末逺鳥沒孤嶼漁舟歸未歸吹笛芙蓉渚國朝浙江秋濤張丹萬里西風吹洪濤撼江閣掛帆白塔下瞥眼富春郭閒亭候潮張丹極目秋江濶空亭獨倚攔早潮猶未上落月如金盤浙江秋濤諸壬發倐忽大風發羣龍若昻首青天無片雲夾岸雷霆走閒亭候潮諸壬發近水白平野逺山紅入天早潮倐已至江路亂流煙偕李孝亷入閩初發江干朱彛尊清江自西來海水逆流合我帆掛東風遙指富春塔初發江干查慎行江路羊腸回江風羊角合漸近漁浦潭忽失六和塔錢塘江行雜詩曹溶春水浴文石諸花夾相送行窮兩岸山未覺輕舟動采緑人何在霜林數十家屋前看越嶺終日漾清沙月愛回溪暖叢篁十月新臨流時濯足驚起踏歌人六言截句浙江元吳師道兩山噴雪眩轉三道奔波渺漫白塔故宫高殿行人來倚闌干江邊元李孝光江邊孤樹猶碧天際白雲自流七十二灘浩蕩夕陽照見歸舟國朝江行雜詩查慎行人家泥浦漁浦驛路樟亭赤亭黃犢鳴邊草緑畫眉啼處峯青船頭載餘杭酒枕上看富春圖老伴不離鵝鴨浮踪又落江湖雨中江上厲鶚樹外雨隨風至塘邊水入田流帆底廟子沙口人語龍山渡頭橘蠧化雙飛蝶桑芽飼再熟蠶隔岸雲屯黑白近城岫洗青藍村娃向井提瓮田父衝烟曳柴老我三家竹墅宜人一緉棕鞋梅候不便北客波官多賽南朝江平觀漲小艇雨歇迎神洞簫七言截句渡浙江問舟中人唐孟浩然潮落江平未有風扁舟共濟與君同時時引領望天末何處青山是越中送陶十赴杭州攝掾唐劉長卿莫嗟江城一掾卑滄州未是阻心期浙中山色千萬狀門外潮聲朝暮時渡浙江唐盧綸前船後船未相及五兩頭平北風急飛沙卷地日色昏一半征帆浪花濕答微之泊西陵驛見寄唐白居易烟波靜處一㸃白應是西陵古驛臺知在臺邊望不見暮潮空送渡江回潮唐白居易早潮才落晚潮來一月周流十六回不獨光隂朝復暮杭州老去被潮催浪淘沙詞唐白居易一泊沙來一泊去一重浪滅一重生相攪相淘無歇日㑹教山海一時平白浪茫茫與海連平沙浩浩四無邊朝來暮去淘不住遂令東海變桑田青草湖中萬里程黃梅雨裏一人行愁見灘頭夜泊處風翻暗浪打船聲借問江潮與海水何似君情與妾心相恨不如潮有信相思始覺海非深海底飛塵終有日山頭化石豈無時誰道小郎拋少婦船頭一去沒回期隨波逐浪到天涯遷客生還有幾家却到帝鄉重富貴請君莫忘浪淘沙應舉題錢塘公館唐陳去疾萬里茫茫天塹遙秦皇底事不安橋錢塘江口無錢過又阻西陵兩信潮觀潮唐劉禹錫八月濤聲吼地來頭高數丈觸山回須臾却入海門去卷起沙堆似雪堆觀浙江濤唐徐凝浙江悠悠海西緑驚濤日夜兩翻覆錢塘郭裏看潮人直至白頭看不足觀海宋趙抃巨海澄瀾勢自平停車冉冉看潮生豈同八月吳江㑹共駭潮頭萬鼓鳴海船宋朱名世輕裝方解盡無遺風挾雙篷水靣飛却被沙頭漁父笑滿船空載月明歸海味宋朱名世海味新來數得餐梢人收拾日登盤錢塘江上親曽見賣得風流别一般海鷗宋朱名世羣飛獨宿水中央逐浪隨波羽半傷莫去西湖花裏睡芰荷翻雨打鴛鴦海魚宋朱名世劍鬛如山海靣浮巨腮噓浪勢吞舟丁寧大客尋竿餌稚子敲針作釣鈎憶錢塘江宋李覯當年乘醉舉歸帆隱隱前山日半銜好是滿天涵返照水仙齊著淡紅衫十七日觀潮宋陳師道潮頭初出海門山千里平沙轉靣間猶有江神憐北客欲將竒觀破衰顔江水悠悠自在流向人無恨一作限不應愁相逢不覺渾相似誰使清波早白頭十八日觀潮宋陳師道一年壯潮盡今朝水伯何知故晚潮海浪肯隨山俯仰風帆常共客飄飄八月十五日看潮宋蘇軾定知玉兔十分圓已作霜風九月寒寄語重門休上鑰夜潮留向月中看萬人鼓噪懾吳儂猶似浮江老阿童欲識潮頭高幾許越山渾在浪花中江邊身世兩悠悠久與滄波共白頭造物亦知人易老故教江水向西流吳兒生長狎濤淵冒利輕生不自憐東海若知明主意應教斥鹵變桑田江神河伯兩醯雞海若東來氣吐霓安得夫差水犀手三午强弩射潮低自注王嘗以弓弩射潮頭與神戰自爾水不近城題潮出海門圖宋陳造絶島平岡捲欲空兩崖相對穹崇即今畫手兼詩筆更與江山角長雄卷裏波濤快一披蒼山擁起雪山馳浮天沃日無窮意到我春窗病酒時錢塘江宋陳淵潮頭駕月衝殘夢水色浮空送峭寒十幅輕蒲連夜發不知身到海門山六曹長二觀潮豫以入直不預晡時大雷雨走筆戲蔡子平宋周必大雷轟萬鼓勒潮回無復庭前雪作堆應為尚書慳且澀盲風怪雨一時來浙江小磯春日宋范成大客裏無人共一杯故園桃李為誰開春潮不管天涯恨更捲西興暮雨來晚潮宋范成大東風吹雨晚潮生叠鼓催船鏡裏行底事今年春漲小去年曽與畫橋平次韻寶應叔觀海宋王十朋戴地浮天浩莫窮氣營樓閣聳虛空道人妙得觀瀾術萬里滄溟碧眼中題童夀卿潮出海門圖宋王炎潮來濺雪欲浮天潮去奔雷又寂然海上兩山原不動更添此意畫圖傳題俞槿畫浙江觀潮册宋曹勛吳越山髙紫翠重浙江東下竦雙峯峯前忽湧東西白飛舞潮頭萬玉龍渡浙江宋葉適晚霞鋪畫月明鈎萬里無風一水浮長怕舟師深擊楫自今洄洑起中流大雪趙振文寄詩言乘月泛舟清甚次韻宋樓鑰舊聞老具擅詩聲夜泛錢塘向鳯城今日清逰更豪逸雪花和月帶潮生法具字圓復紹興初詩僧也有月夜逰錢塘江詩云小舟為我載明月白沙翠竹光相射自從李白下金陵四百年無此豪逸還自錢塘道中宋潘柳江上青山落照邊江頭歸客木蘭船春鷗自共潮回去一㸃飛來是栁綿錢塘晚望宋謝翺錢塘江上夜潮過秋靜寒烟白露多吳越青山明月裏舟人齊唱異鄉歌錢塘渡宋蘇泂百年鬢髮春風晚十二欄干落照微多事錢塘江水上送人離别送人歸夜宿浙江亭宋曹既明夜半潮聲撼客牀卧聽柔櫓閙空江驚回倦枕鄉關夢海日烘山上曉窗重到錢塘宋鮑輗惟有寒潮不世情朝朝暮暮過空城百年車馬閶門外獨見春風草又生泛浙江宋方回海門山到富春山礙石衝沙水幾灣不是此江故盤屈雪濤何得記吳巒觀潮宋王琮中旗綵斜飛一命輕舟人却立萬舟迎不應當日將軍事猶到如今氣未平江頭宋俞桂漁浦山邊白鷺飛西興渡口夕陽微等閒更上層樓望貪看江潮不肯歸江上宋俞桂小雨才收日漸斜酒旗插處兩三家江頭粧㸃秋來景半是蘆花半蓼花秋江宋釋道潛赤葉楓林落酒旗白沙洲渚夕陽微數聲柔櫓蒼茫外何處江村人夜歸江上秋夜宋釋道潛雨暗蒼江晚未晴井梧翻葉動秋聲樓頭夜半風吹斷月在浮雲淺處明月夜遊錢塘江宋釋德興小舟為我載月色白沙翠竹光相射自從李白下金陵四百年無此豪逸弄潮詩宋錢塘軍人弄罷江潮曉入城紅旗颭颭白旗輕不因㑹喫翻頭浪爭得天街鼓樂迎觀浙江沙漲十里有感元張志道重到錢塘異昔時潮頭東擊逺洲移人間莫住三千歲滄海桑田幾許悲江村元黃庚極目江天一望賖寒烟漠漠日西斜十分秋色無人管半屬蘆花半蓼花江村即事元黃庚江村暝色漸凄迷數㸃殘鴉雜雁飛雁宿蘆花鴉宿樹各分一半夕陽歸題江干初雪圖元戴表元斷樹寒雲古岸隈漁翁初撥小船開看渠風雪忙如許還有魚兒上釣來夏夜江上元吳師道繞屋青江竹萬竿水風蕭瑟竹光寒夜深月上門不掩卧聽釣歸船過灘錢塘懷友元黃清老舟泊楓林一雁聲白蘋紅蓼共思君月明江水多於海雨後秋山碧似雲題春江小景圖元黃清老小艇無人載緑隂白鷗門外笋成林不知多少山中雨染得一江春水深題趙千里夜潮圖元偰哲篤風濤洶湧千堆雪拍岸翻空倒銀闕雁聲驚起一江秋萬里無雲掛明月懷馬教授水生白石渡頭灣念子攜書共往還今日相思不相見越南殘照海門山泛海元張可大到處啼鶯倚棹歌客懷偏向布帆多黃雲飛盡天如洗鰲背山前萬頃波杭州歌明張以寧西陵渡口潮水平十十五五放舟行樓中燕子慣見客不怕渡頭津鼓聲越水圖明沈周記别錢塘二十年夕陽山色曉潮邊隔江千里美人逺夢落西興舊渡船自新安江至錢塘舟行明李流芳富春天豁一江明江上青山縱復橫早晚隨潮下三折六橋寒樹逺含情徐村遇潮明李流芳千帆影裏練光開白玉城摧動地雷故傍淺沙鞭馬去却驚飛沫濺衣回晚發錢塘明顧文淵潮平小櫂發錢塘俄頃帆飛過富陽兩岸好山看不盡數聲漁笛起滄浪江上夜泊明朱國祚江上扁舟一葉輕夜深燈火滅還明枕函未作寒山夢卧聽潮聲帶雨生江潮十首録四明趙應元橫空白浪駕邱山颷逐嚴灘未肯還共說鴟夷千古憤至今遺怒滿人間風潮殘星的歷曙光微水長平沙失釣磯瀑布橫舟冲霧起浪花迎楫帶霞飛早潮滄茫萬里此停舟潮到山城勢欲浮如許風波且休息雨微烟暝正宜秋晚潮平平沙濶未潮生理楫楊帆共欲迎自是往來存大信莫疑翻覆似人情候潮浙江詞明田藝衡秋風捲入海門關白浪高于龕赭山直向富春祠下過寒流常帶月明還海上天吳駕六鰲祖龍鞭石不成橋沙中鐡箭三千尺聞說錢王曾射潮素車白馬送潮來伍子山前起怒雷幾度停樽歌七發千年枚叔總竒才國朝江樓送别張遂辰片帆才掛海門秋落木寒山黯對愁莫惜殘樽人遽别夕陽猶喜半江樓渡錢塘朱彜尊渡口乘潮漾北風輕舟如馬溯江東明朝又是山隂道身在千巖萬壑中江行朱彛尊潮落江平宿富陽船頭新月下微霜曉看烏臼紅千樹樹杪半山鴨腳黃絶壁苔紋鼠尾灘光晝靜白鎔銀分明江上孤篷客黃鶴山樵畫裏人環溪亭下水流東野碓飛輪到靣風返景松巖紅未斂隔江人語漆林中歸舟雜咏查慎行青山漸逺漸糢糊散入雲烟淡欲無畫手稀逢黃子久詩家别寫富春圖滚滚秋濤浩浩風烟茫茫處雨濛濛不知誰割東西界半幅江山展越中贈戴山人毛竒齡錢塘髙士剡中才日暮銜杯江上臺萬叠寒濤通夜白依然雪後見君來送季偉歸錢塘尤侗楚尾吳頭路幾遙蟬鳴堤栁影蕭蕭君歸湖上西泠口已過錢塘八月潮歸去南屏自結廬不須長盼楚江書青莎碧荇蓴絲菜紫蟹紅蝦篛葉魚弄潮詞王錫狂瀾乍湧海門高嵂崒銀山駕六鼇七發應嗤枚叔陋詭觀但說廣陵濤吳兒重利每輕生踏浪爭持採幟行技勇若能驅敵愾應教萬里破龍城綿亘錦幕照江潯那管神洲已陸沉眼底水嬉雖百變憎兒可抱濟川心朱旗畫傘閙江干騰跳迎潮萬姓歡童子善泅多似織懸知百倍吕梁觀傾城士女集如雲羅剎江邊演水軍家給民原知自愛不煩作戒弄潮文繡胸文脛競沿洄金鼓連天震似雷海若縱橫誰砥柱直須萬弩射潮回錢塘觀濤劉廷璣滚滚長江去復回蛟龍飛處響如雷萬千人盡回頭望一片銀山駕海來越遊雜詩金志章潮落樟亭漾淺沙晴江渺渺片帆斜臨流欲喚西陵渡一笑先登觳􅑌車一艇橫江信午風青山兩岸列西東井西圖畫何人㑹暖翠浮嵐在眼中江漲口號金志章皎皎雨晴明月光一夜水添三尺强朝來大艑忽鱗集不是魚船是米艎勘中小亹髙斌葛嶴山前江溜行中亹直下候潮迎南崖賴有文堂峙喜慶錢塘奏績成江溜由葛嶴山前中小亹直下通潮入海北亹舊江潮退流停更可喜者南崖偏西大堂山桃溜入中亹其南亹安穩無虞全塘永慶成功矣龕山北望赭山紅遍地桑麻樂永豐舊日南亹三十里幸今無礙海潮攻赭山以南三十里乃舊時南大亹今已成樂土幸無妨礙次錢塘詩沈仕千里江流十日行凄風急雨鬭江聲到來掛席紅雲上笑指扶桑海日生笑指扶桑海日生望中佳氣擁春城鶯花萬户珊瑚色烟水六橋歌吹聲海上戴敏萬頃鯨波朝日赤滄洲四望無窮極海山何處是蓬萊遍問漁翁都不識詞憶江南杭州唐白居易江南憶最憶是杭州山寺月中尋桂子郡亭枕上看潮頭何日更重逰漁父歌唐李珣棹警鷗飛水濺袍影侵潭靣栁垂條終日醉絶塵勞曽見錢塘八月潮望海潮宋栁永東南形勝三吳都㑹錢塘自古繁華烟栁畫橋風簾翠幕參差十萬人家雲樹繞隄沙怒濤捲霜雪天塹無涯市列珠璣户盈羅綺競豪奢重湖叠巘清佳有三秋桂子十里荷花羌笛弄晴菱歌泛夜嬉嬉釣叟蓮娃千騎擁髙牙乘醉聼歌鼓吟賞烟霞異日圖將好景歸去鳯池誇河滿子陪杭守泛潮夜歸宋張先溪女送花隨處沙鷗避樂分行逰舸已如圖障裏小屏猶畫瀟湘人靣新生酒艷日痕更欲春長衣上交枝鬭色叉頭比翼相雙片段落霞明水底風紋時動粧光賓從夜歸無月千燈萬丈湖塘瑞鷓鴣觀濤宋蘇軾碧紗影裏小紅旗儂是江南踏雪兒拍手欲嘲山簡醉齊聲爭唱浪婆詞西興渡口帆初落漁浦山頭日未移儂欲送潮歌底曲樽前還唱使君詩江神子錢塘江上宋蘇軾鳯凰山下雨初晴水風清晚霞明一朵芙蓉開遍尚盈盈何處飛來雙白鷺如有意慕娉婷忽聞江上弄哀箏苦含情遣誰聽烟斂雲收依約是湘靈欲待曲終尋問取人不見數峯青南歌子錢塘晚眺宋蘇軾山雨蕭蕭過溪橋瀏瀏清小園幽榭枕蘋汀門外月華如水綵舟橫苕岸霜花盡江潮雪陳平兩山遙指海門青回首水雲何處覔孤城摸漁兒觀潮上葉丞相宋辛棄疾望飛來半空鷗鷺須臾動地鼙鼓截江組練驅山去鏖戰未收貔虎朝又暮悄慣得吳兒不怕蛟龍怒風波平步看紅斾驚飛跳魚直上蹙踏浪花舞憑誰問萬里長鯨吞吐人間兒戲千弩滔天力倦知何事白馬素車東去堪恨處人道是屬鏤怨憤足千古功名自誤謾教得陶朱五湖西子一舸弄烟雨念奴嬌觀潮宋陸凝之逺山一帶遡晴空極目天涯浮白楓落鴉翻談笑處不覺雲濤橫席酒病方蘇睡魔猶殢一掃無留迹吳帆越調恍然飛上空碧長記草賦梁園凌雲筆勢倒三江秋色對此驚心空悵望老作紅塵閒客别浦烟平小樓人散回首烟波寂西風掃露為君重噴霜笛酹江月浙江亭觀濤應制宋吳琚玉虹遙掛望青山隱隱細如一抹忽覺天風吹海立好似春霆始發白馬凌空瓊鼇駕水日夜朝天闕飛龍舞鳯鬱葱環拱吳越此景天下應無東南形勝偉觀真竒絶好是吳兒飛綵幟蹴起一江秋雪黃屋天臨水崖雲擁看擊中流楫晚來波靜海門飛上明月水龍吟錢塘作宋陳以莊晚來江濶潮平越舷吳榜催人去稽山滴翠胥濤濺恨一襟離緒訪栁章臺問桃仙浦物華如故向秋娘渡口泰娘橋畔依稀是相逢處窈窕青門紫陌蒨羅新衣翻金縷舊音恍記輕擺慢撚哀絃老柱金屋難成阿嬌已逺不堪春暮聽一聲杜宇紅殷緑老雨花風絮謁金門吳山觀濤宋周密天水碧染就一江秋色鼇戴雪山龍起蟄快風吹海立數㸃烟鬟青滴一幅霞綃紅濕白鳥明邊帆影直隔江聞夜笛虞美人浙江舟中作元趙孟俯潮生潮落何時了斷送行人老消沈萬古意無窮盡在長空淡淡鳥飛中海門幾㸃青山小望極烟波渺何當駕我以長風便欲乘槎浮到日華東國朝滿江紅錢塘觀潮曹溶浪湧蓬萊高飛撼宋家宫闕誰蕩激靈胥一怒惹冠衝髮㸃㸃征帆都卸了海門急鼓聲初發似萬羣風馬驟銀鞍爭超越江妃哭堆成雪鮫人舞圓如月正危樓湍轉晚來愁絶城上吳山遮不住亂濤穿到嚴灘歇是英雄未死報讎心秋時節滿江紅錢塘觀潮和曹侍郎韻朱彛尊曹侍郎錢塘觀潮一闋最為崛竒今見雕本改竄可惜康熙丙子秋涉江追和其韻并附原詞於後不作三舍退避者欲存其真也羅剎江空設險有海門雙闕日未午樟亭一望樹多於髮乍見雲濤銀屋湧俄驚地軸轟雷發算隂陽呼吸本天然分吳越遺廟古餘霜雪殘碑在無年月訝揚波重水後先竒絶齊向屬鏤鋒下死英魂毅魄難消歇趁高秋白馬素車來同弭節蝶戀花錢塘觀潮朱彛尊楓浦客來煙未散許渾如許如言羅隱漸落分行雁李嶼解道澄江淨如練李白風翻白浪花千片白居易細雨濕衣看不見劉長卿浩汗連綿張希浚地濶平沙岸杜甫信宿漁人還泛泛杜甫富陽山底樟亭畔白居易一半兒浙江朱彛尊鯉魚風起鳯山根白鷺潮來鱉子門黃雀雨晴魚浦村亂帆分一半兒夭斜一半兒穩海塘録卷二十五
