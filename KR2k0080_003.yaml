body:
  text: 海塘録卷三內閣中書翟均亷撰建築一漢郡議曹華信立防海塘後漢書朱雋傳注錢塘記云昔郡議曹華信議立此塘後防水始開募有能致土石一斛者與錢一千旬日之間來者雲集塘未成而譎不復取皆遂棄土石而去塘以之成臣謹案水經注及太平寰宇記元和郡縣志皆云錢塘因華信築塘得名通典引郡縣志其説亦同考史記秦始皇二十五年置會稽郡為縣二十六斯時已有錢塘豈待華信而後名哉又潛説友謂唐字本不從土舊志引詩中唐有甓釋云唐途也至唐時始加土字則錢塘以華信得名之説未可信特舊志皆載存以備考唐開元元年重築鹽官捍海塘唐書地理志長百二十四里咸淳臨安志在縣南三里濶二丈髙一丈臣謹案唐書地理志鹽官之下注云武德七年省入錢塘貞觀四年復置有鹽官有捍海塘隄長百二十四里開元元年重築竊謂四年復置云者言鹽官縣自省入錢塘後至此復置也有鹽官云者鹽官如鐡官銅官之類正與漢書地理志武原鄉有鹽官之文相似有捍海塘云云者始言及塘也浙江通志引唐書云長二百二十四里詳閲新舊唐書並無此文實誤百二十四里為二百二十四里也海塘通志兩引唐書以二百二十四里為開元重築以一百二十四里為貞觀復置而又指舊志以築塘始開元者為非繹其致悮之由乃以貞觀四年復置鹽官縣為復置捍海塘其實貞觀未嘗築塘止開元元年一役耳至潛説友臨安志載開元九年築塘而不載元年成化以後郡縣志皆從之此又訛元年為九年之謬也今據唐書只載開元元年重築一役而貞觀四年開元九年刪置不録顧唐書既言重築知不始于開元第其始建無考耳梁開平四年秋八月吳越王錢鏐築捍海塘咸淳臨安志江挾海潮為杭人患其來巳久白樂天剌郡日嘗為文禱于江神然人力未及施也至梁開平四年八月錢武肅王始築捍江塘在候潮通江門之外隄岸既成久之乃為城邑聚落凡今之平陸皆昔時江也吳越備史王將築捍海塘因江濤衝激命強弩以射濤頭遂定復建候潮通江等城門又親祝胥山祠為詩一章函鑰于海門既而濤頭遂趨西陵王乃命運巨石盛以竹籠植巨材捍之塘基始定其重濠壘塹通衢廣陌亦由是而成焉江塘志略錢氏時為石隄外又植大材十餘行名曰滉柱蓋以折水之勢不與水爭力故隄得無患也寶元康定間有人獻議取滉柱者謂可得良材數十萬杭帥然之朩出皆不可用而隄為濤激寖就摧決矣宋大中祥符五年轉運副使陳堯佐議修錢塘江隄宋史河渠志五年杭州上言浙江潮激西北岸益壞稍逼州城民居危之即遣使者同知杭州戚綸轉運使陳堯佐畫防捍之䇿綸等因率兵力藉梢楗以護其衝乾道臨安志正月甲戍綸與轉運使陳堯佐言浙江岸壞漸逼州城望遣使自京師部掃匠壕寨赴州工役詔從之令馳驛而往命轉運使更互檢校遂以掃岸易柱石之制雖免水患而衆頗非其變法咸淳臨安志初錢塘江隄以竹籠石而潮囓之不數嵗輒壞轉運使陳堯佐曰隄以捍患而反病民乃與知杭州戚綸議易以薪土有害其政者言于朝以為不便參知政事丁謂主言者絀堯佐爭不已謂既徙綸揚州癸已又徙堯佐京西路發運使李溥請復籠石為隄數歲功不就民力大困卒用堯佐議隄乃成七年發運使李溥修築江塘用竹籠樁朩以捍潮勢宋史河渠志綸等既罷去發運使李溥內供奉官盧守勤經度以為非便請復用錢氏舊法實石于竹籠倚疊為岸固以樁朩環亘可七里斬材役工凡數萬踰年乃成而鈎末壁立以捍潮勢雖湍激數丈不能為害九年知杭州馬亮修江岸成乾道臨安志九月丁卯詔杭州葺江岸卒執役水中苦足疾宜令知州馬亮拯療之十月已卯加集賢院學士先是江濤大溢調兵築隄而工未就詔問亮所以捍江之䇿亮至禱於伍員祠下明日潮為之却又出橫沙數里隄遂以成臣謹案宋史天禧四年六月浙江潮溢壞隄千餘丈事聞于朝使祭告江神而獨不及修築之事故自九年後至天聖四年始載天聖四年侍御史方謹請修錢塘江岸玉海四年二月辛未方謹言請修江岸二斗門景祐三年四月知杭州俞獻卿築隄數十里奉詔褒諭宋史俞獻卿傳獻卿以諫議大夫集賢殿學士知杭州一日暴風江潮溢決隄大發卒鑿西山作隄數十里民以為便玉海作長十里工部侍郎張夏作石隄一十二里自六和塔至東青門衆賴以安宋史河渠志景祐中以浙江石塘積久不治人患墊溺工部侍郎張夏出使因置捍江兵士五指揮専採石修塘隨損隨治衆賴以安邦人為之立祠朝廷嘉功封寧江侯四朝聞見録杭州江岸率多薪土潮水衝激不過三嵗輒壞張夏令作石隄一十二里以防江潮既成杭人德之慶歷中立廟隄上臣謹案宋史五行志景祐四年六月乙亥杭州大風雨江潮溢岸髙六尺壞隄千餘丈而修築隄防未見史志慶厯四年夏六月郡守楊偕轉運使田瑜築隄二千二百丈咸淳臨安志潮侵江岸土石囓去殆半偕與運使田瑜急督人徒負土以置斷防卒免墊溺遂相與議全築條上方略約工四十萬計及籍吏之可使者以驛聞詔以隄事付之兼命通判等分董其役發江淮南二浙福建之兵調十縣丁壯合五千人輦石畚土持鍤執杵之役相屬于數十里之外方苦盛寒無告勞者十二月新隄成宋史田瑜傳瑜徙兩浙轉運按察使杭州龍山隄嵗決水冒民居輒賦芻塞之瑜與民約每芻十束更輸石一尺率五嵗得石百萬為石隄隄固而嵗不調民六年漕臣杜杞築錢塘隄見玉海政和二年兵部尚書張閣請修江塘從之宋史河渠志政和二年七月兵部尚書張閣言臣昨守杭州聞錢塘江自元豐六年泛溢之後潮汛往來卒無寧嵗而比年水勢稍改自海門過赭山即回薄巖門白石一帶北岸壞民田及鹽亭監地東西三十餘里南北二十餘里江東距仁和監止及三里北趨赤岸􅝕口二十里運河正出臨平下塘西入蘇秀若失障禦恐他日數十里膏腴平陸皆潰于江下塘田廬莫能自保運河中絶有害漕運詔亟修築之五年知杭州李偃請築湯村等岸詔命劉既濟修治宋史河渠志六年閏正月李偃言湯村巖門白石等處並錢塘江通大海日受兩潮漸至侵囓乞依六和寺岸用石砌疊乃命劉既濟修治臣謹案乾道臨安志李偃于政和五年八月甲辰以徽猷閣待制知杭州十二月癸亥徙為河南尹奏請築隄當在五年史志云六年者殆至是始命既濟耳宣和四年十月以鐡符十道鎮鹽官縣海塘泊宅編政和丙申嵗杭州湯村海溢壞居民田廬凡數十里朝廷降鐡符十道以鎮之壬寅嵗鹽官縣亦溢縣南至海四十里而水之所囓去邑聚才數里邑人甚恐十一月鐡符又至其數如湯村每一符重百斤正面鐡神符及御書咒貯以青朩匣府遣曹官同都道正管押下縣縣建道場設醮投之海中紹興十年招填捍江軍額咸淳臨安志十年以兩浙轉運副使張滙之請招填捍江軍額十四年臨安府修錢塘江岸二十年修石隄見玉海二十二年置修江司遂修六和塔玉海二十二年十一月二十五日吏部尚書林大鼐建言潮為吳患其來已久捍禦之䇿見于浙江亭碑自江流失道潮與洲鬬怒號激烈千霆萬鼓民以不寧宜專置一司究利病而後興工咸淳臨安志大鼐且言羅剎江濵舊傳有三浮圖唐末神僧創以鎮潮脈名六和塔積年不修又吳山英烈王廟燼于回祿乞靈無地乞付有司營葺從之自是百餘年間屢修屢壞紹興末轉運使及臨安府修錢塘石岸宋史河渠志紹興末以錢塘石岸毁裂潮水漂漲民不安居令轉運使同臨安府修築乾道七年帥臣沈夏復增修石隄玉海十一月十八日沈夏修石隄成增石塘九十四丈九年詔臨安府增築江塘宋史河渠志乾道九年錢塘廟子灣一帶石岸復毁于怒潮詔令臨安府築填江岸增砌石塘淳熙元年命有司治江岸宋史五行志淳熙元年七月壬寅癸卯錢塘大風濤決臨安府江隄一千六百六十餘丈漂居民六百三十餘家仁和縣瀕江二鄉壞田圃宋史河渠志淳熙改元復令有司自江岸衝損以乾道修治為法四年築鹽官海塘宋史五行志五月已亥夜錢塘江潮大溢敗臨安府隄八十餘丈庚子又敗隄百餘丈九月丁酉戊戍大風雨駕海濤敗錢塘縣隄三百餘丈海寧縣志先是海潮壞隄至是命築之嘉定十二年鹽官海漲浙西諸司條具築捺之䇿宋史五行志嘉定十二年鹽官縣海失故道潮衝平野二十餘里至是侵縣治蘆洲港瀆及上下管黃灣黃岡等鹽場皆圮蜀山淪入海中聚落田疇失其半壞四郡田後六年始平宋史河渠志臣僚言鹽官去海三十餘里舊無海患縣以鹽竈頗盛課利易登去嵗海水泛漲湍激橫衝沙岸每一潰裂常數十丈日復一日浸入滷地蘆洲港瀆蕩為一壑今聞潮勢深入逼近居民萬一春水驟漲怒濤奔湧海風佐之則呼吸蕩出百里之民寧不俱葬魚腹况京畿赤縣密邇都城內有二十五里塘直逼長安閘上徹臨平下接崇德漕運往來客船絡繹兩岸田畝無非決壞若海水徑入于塘不惟民田有鹹水淹浸之患而裏河堤岸亦將有潰裂之憂乞下浙西諸司條具築捺之䇿務使捍堤堅壯土脈充實不為怒潮所衝從之十五年命浙西提舉劉垕築鹽官土塘宋史河渠志都省言鹽官縣海塘衝決命浙西提舉劉垕專任其事既而垕上言鹽官東接海鹽西距仁和北抵崇德德清境連平江嘉興湖州南瀕大海原與縣治相去四十餘里數年以來水失故道早晚兩潮奔衝向北遂至縣南四十餘里盡淪為海近縣之南原有捍海古塘亘二十里今東西兩段並已衝毁侵入縣之兩旁又各三四里止存中間古塘十餘里萬一水勢衝激不已不惟鹽官一縣不可復存而向北地勢卑下所慮鹹流入蘇秀湖三州等處田畝皆不可種其為害非獨一邑也詳今日之患大概有二一曰平地陸沉一曰鹹潮泛溢陸沉者固無力可施其泛溢者乃因捍海塘衝損每遇大潮必盤越流注北向今亟宜築土塘以捍鹹潮其所築塘基南北各有兩處在縣東近南則為六十里鹹塘近北則為袁花塘在縣西近南亦曰鹹塘近北則為淡塘嘗驗兩處土色虛實則袁花塘淡塘差勝鹹塘且各近裏未至與海潮為敵勢當東就袁花塘西就淡塘修築庶可以禦縣東鹹潮泛溢之患其縣西一帶淡塘連縣治左右共五十餘里合先修築兼縣南去海一里餘幸而古塘尚存縣治民居盡在其中未可棄之度外今將見管樁石就古塘加工築疊一里許為防護縣治之計其縣東民户日築六十里鹹塘萬一又為海潮衝損則盡棄前工當計用朩石修築袁花塘以捍之上以為然慶元中浙江塘壞捍江指揮使任班率兵修築嘉熙二年知臨安府趙與歡築江港口壩一道近江築捺水塘六百丈咸淳臨安志嘉熙戊戍秋潮由海門搗月塘頭日侵月削民廬僧舍坍四十里已亥六月詔趙與歡除端明殿學士知臨安府任責修築與歡奏先于傍近築土塘為救急之術然後于內築石塘又奏日役殿步司官兵五千五百餘人并募夫工及修江司軍三千餘人已貼立石倉夾樁笆板朩晝夜運土填築自水陸寺之下江家橋之上近江港口築壩一南北長一百五十丈自團圍頭石塘近江築捺水塘一長六百丈自六和塔以東一帶石隄添新補廢四百餘丈閲三月畢工水復其故寶祐二年十二月監察御史陳大方請修築江塘宋史河渠志監察御史兼崇政殿説書陳大方言江潮侵囓隄岸乞戒飭殿步兩司帥臣同本府守臣措置修築留心任責或有潰決咎有攸歸三年十一月監察御史李衢請稽捍江兵額令隨時修補江塘宋史河渠志監察御史兼崇政殿説書李衢言國家駐蹕錢塘今踰十紀惟是浙江東接海門胥濤澎湃稍越故道則衝囓隄岸蕩析民居前後不知其幾慶厯中置捍江五指揮兵士每指揮以四百人為額今所管才三百人乞下臨安府枸收不許占破及從本府收買樁石沿江置場樁管不得移易他用仍選武臣一人習于修江者隨其資格或以副將或以路分鈐轄繫銜専一鈐束修江軍兵值有摧損隨即修補或不勝任以致江潮衝損隄岸即與責罰景定二年浙江隄成元大德三年禮部郎中遊中順來視虛沙元史河渠志鹽官州去海岸三十里舊有捍海塘二後又添築鹹塘在宋時亦常傾陷大德三年塘岸壞都省委禮部郎中遊中順洎本省官相視虛沙復漲難于施力延祐七年議築鹽官北門土塘元史河渠志延祐已未庚申間海汛失度纍壞民居陷地三十餘里時省憲官共議宜于州後北門添築土塘然後築石塘東西長四十三里後以潮汐沙漲而止泰定元年十二月鹽官州海水溢有司請築石塘不許元史泰定紀十二月癸亥鹽官州海水溢屢壞隄障侵城郭遣使祀海神仍與有司視形勢所便還請疊石為塘詔曰築塘是重勞吾民也其增石囤捍禦庶天其相之又五行志有司以石囤朩匱捍之不能止三年八月海溢鹽官隄徙居民避之元史泰定紀鹽官州大風海溢壞隄防三十餘里遣使祭海神不止徙居民千二百五十家四年二月杭州路請修鹽官鹹塘元史五行志正月海潮大溢捍海塘壞二千餘步又河渠志二月間風潮大作衝捍海小塘壞州郭四里杭州路言與都水庸田司議欲于北地築塘四十餘里而工費浩大莫若先修鹹塘增其髙濶填塞溝港且濬深近北備塘濠塹用樁密釘庶可護禦江浙省凖下本路修治都水庸田司又言宜速差丁夫當水入衝堵閉其不敷工役于仁和錢塘及嘉興附近州縣諸邑人户內斟酌差倩工部議海岸摧壞宜發文江浙行省督催庸田使司鹽運司及有司發丁夫修治毋致侵犯城郭貽害民居四月海溢鹽官州命都水少監張仲仁塞之元史泰定紀四月癸未海水溢侵地十九里命都水少監張仲仁及行省官發工匠二萬餘人以竹落木柵實石塞之不止又地理志仲仁往治沿海三十餘里下石囤四十四萬三千三百有竒又木匱四百七十有竒工役萬人五月海益溢命張嗣成禳之元史河渠志五月五日平章圖們岱爾與察納史參政等奏江浙省四月內潮水衝破鹽官州海岸令庸田司官徴夫修堵又臣等集議世祖時海岸嘗壞遣使命天師祈祀潮即退今可令直省舍人巴延奉御香令天師依前例祈祀制曰可又泰定紀癸卯命天師張嗣成修醮禳之六月發義倉粟賑鹽官州民見泰定紀十月江浙行省左丞托歡達喇罕平章政事髙昉議築石塘元史泰定紀是月癸丑江浙行省左丞托歡達喇罕平章政事髙昉以海溢病民請解職不允又河渠志既而杭州路又言八月以來秋潮洶湧水勢愈大見築沙地塘岸東西八十餘步造朩匱石囤以塞其要處本省左丞相托歡等議安置石囤四千九百六十抵禦鎪囓以救其急擬比浙江立石塘可為久逺計工物用鈔七十九萬四千餘錠糧四萬六千三百餘石接續興修致和元年三月命户部尚書李嘉努議修鹽官海岸元史泰定紀甲申遣户部尚書李嘉努往鹽官祀海神仍集議修海岸又河渠志三月省臣奏江浙省并庸田司官修築海塘作竹籧篨內實以石鱗次壘壘以禦潮勢今又淪陷入海見圖修治今差户部尚書李嘉努工部尚書李家賔樞密院屬指揮青山副使洪灝宣政僉院納木喀巴勒與行省左丞相托歡及行臺行宣政院庸田使司諸臣會議修治之方合用軍夫除戍守州縣關津外酌量差撥從便添支口糧合役丁力附近有田之民及僧道伊囉勒昆與達實密等户內點倩凡工役之時諸人毋或阻壞違者罪之合行事務提調官移文稟奏施行有旨從之復命僧厭海溢元史泰定紀丙戌記帝師命僧修佛事于鹽官州仍造浮屠二百一十六以厭海溢又五行志三月鹽官隄溢遣使禱祀造浮圖用西僧法壓之四月海益溢發軍民塞之四月户部尚書李嘉努作石囤以捍海元史泰定記壬寅李嘉努以作囤捍海議聞又河渠志二十八日朝廷所委官洎行省臺院及庸田司等官議大德延祐欲建石塘未就泰定四年春潮水異常增築土塘不能抵禦議置板塘以水湧難施工遂作籧篨朩匱間有漂沉欲踵前議疊石塘以圖久逺為地脈虛浮比定海江浙海鹽地形水勢不同由是造石囤于其壞處疊之以救目前之急已置石囤二十九里餘不曽傾陷略見成效庸田司與各路官同議東西接疊石囤十里其六十里塘下舊河就取土築塘鑿東山之石以備損壞天厯元年海潮平詔改鹽官州為海寧州元史河渠志天厯元年十一月都水庸田司言八月十日至十九日正當大汛潮勢不髙風平水穩十四日祈請天妃入廟自本州嶽廟東海北護岸鱗鱗相接十五日至十九日海岸沙漲東西長七里餘南北廣或三十步或數十百步潮見南北相接西至石囤已及五都修築捍海塘與鹹塘相連直抵巖門障禦石囤東至十一都六十里塘東至東大尖山嘉興平湖三路所修處海口自八月一日至二日探海二丈五尺至十九日二十日探之先二丈者今一丈五尺先一丈五尺者今一丈西自六都仁和縣界赭山雷山為首添漲沙塗已過五都四都鹽官州廊東西二都沙土流行水勢俱淺二十日復巡視自東至西岸腳漲沙比之八月十七日漸增髙濶二十七日至九月四日大汛本州嶽廟東西水勢俱淺漲沙東過錢家橋海岸原下石囤朩匱並無頽圯水息民安于是改鹽官州曰海寧州明洪武十一年秋七月左布政使安然築石隄成化杭州府志洪武十一年秋海潮囓江岸安然躬率民夫伐石砌築隄成民獲安業臣謹案海塘通志訛十一年為十年今從成化志作十一年二十五年左布政使王鈍修築江岸成化杭州府志時江岸潮汐為害鈍率民伐石捍江民免墊溺永樂元年冬十月修築江岸明實録八月癸亥浙江風潮決江塘萬四百餘步壞田四十餘頃湯鎮方家塘江隄為風浪衝決淪于江者四百餘步溺民居及田四千頃冬十月修築江岸是嵗户部尚書夏原吉奉命來治水五年令右通政趙居任築江岸明實録五年夏六月浙江布政司言杭州府沿江隄岸復圯于江遣官督民修築六年發軍民修築仁和海寧江海塘海寧縣志海寧海決陷沒赭山巡檢司請發軍民修築從之仍命户部遣官巡恤被災之家九年秋九月修仁和海寧塘岸十月塘岸成明實録九年工部言浙江潮水衝決仁和縣黃濠塘三百餘丈孫家圍塘岸二十餘里請發軍民修築從之冬十一月修浙江仁和海寧及海鹽縣土石塘岸萬一千一百八十五丈十一年夏五月遣使監築江塘萬歷杭州府志永樂十一年五月江潮平地水髙尋丈仁和十九都二十都居民陷溺田廬漂沒殆盡守臣申奏朝命工部侍郎張某監築隄岸役及杭嘉湖嚴諸府軍民十餘萬採竹朩為籠匱伐臯亭山磈石納其中疊砌隄岸以禦江潮修築三年費財十萬十六年遣保定侯孟瑛等祭海神明實録朝廷以浙江瀕海諸縣風潮衝激隄岸墊溺居民連年修治迄無成功乃齋戒遣保定侯孟瑛等以太牢祭東海之神既祭水患頓弭十八年春三月命有司修塘岸明實録浙江海寧等縣言潮水淪沒邉海塘岸二千六百六十餘丈延及吳家等壩命有司量起軍民修築之秋九月修築海塘明實録通政司左通政嶽福言浙江仁和海寧二縣今年夏秋霖雨風潮壞長安等壩淪于海者千五百餘丈東岸赭山巖門山蜀山故有海道近皆淤塞故西岸潮勢愈猛為患滋大乞以軍民修築從之宣德五年巡撫成均築捍海隄明從信録宣德五年浙江巡撫侍郎成均築捍海隄成化七年秋九月命工部侍郎李顒築江隄明實録成化七年九月二日風潮決錢塘江岸十餘丈近江居民房室田産皆為淹沒守臣以聞工部尚書王復等奏乞如永樂事例遣大臣往祭海神修江岸上命李顒時潮水衝塌江岸計四百九十餘丈顒議修築工料合用銀七萬三千二百餘兩今官庫收貯十不及五如俟續收贓罰解補恐潮復作前工盡棄欲取布政司存留糧銀支給充用量起杭州府衛人夫修築從之十年築海寧縣隄陳之暹築塘議大潮衝決隄岸用崇德沈丞築法隄始成臣謹按是役止見陳之暹築塘議舊志失載沈丞向逸其名而成化十六年有維揚沈讓涖丞任前此無有也築法不傳十二年修防海塘明實録浙江鎮守巡按及都布按三司奏言杭嘉紹三府所屬海寧海鹽山隂蕭山上虞等縣海塘衝塌數多修築財用不足乞照上年例以杭州城南抽分竹朩存留七分賣銀解部者以備築塞工料庶寬民力工部謂內府造供應器皿并清江衛河造運船皆取給抽分所係亦重宜令各府先以在官物料支用不足則于附近無災府分借倩協濟從之十三年僉事錢山築海寧障海塘成化杭州府志成化十三年二月海寧海決隄逼蕩城邑鎮巡因命採石臨平安吉諸山初用漢楗絙法不就乃斫朩為大匱編竹為長絡引石下之泛溢乃定仍作副隄十里以防泄鹵凡七越月而役竣嘉靖十二年海寧令嚴寬議籌嵗儲備修築海寧縣志十二年海寧縣知縣嚴寬建議準海鹽例嵗儲均徭役銀以備海塘修築之用自後寧邑設海塘夫一百五十名嵗儲役銀三百兩著為令自寬始也臣謹案𢎞治五年海寧縣海溢新隄漸圯嘉靖二年七月三日大風拔木天開河等處海水湧溢衝決塘壩潮水倒流城中水為之鹽八月三日大風海溢衝沒太平門外沙場廬舍百餘所七年海寧縣新隄大圯復至城下九年七月海決逼城皆未見修築之役至是有司始議修治之隆慶六年五月海決有司議築江塘杭州府志颶風大作海嘯塘圯鹹水湧入內沙壞田地八萬餘畝時縣官估計應修塘凡二千三百七十八丈計修築工料銀應五千二百二十有八兩萬厯五年海寧縣令蘇湖修海塘海寧縣志萬歷三年夏五月颶風大作海嘯漂溺民居塘圮鹽水湧入內河壞田地八萬餘畝時縣官估計應修塘凡二千三百七十八丈計修築工料銀應五千二百二十八兩四年九月會知縣蘇湖蒞任巡撫徐栻察其才可任事遂以塘付之湖定議以五年二月十三日興工至四月而役竣計費才一千九百七十六兩時通判張繼芳定議採石一塊長五尺二寸髙濶一尺八寸者給銀四錢七分以三錢給工價一錢給船價七分充扛擡又議以船價六千兩造船三百隻行仁錢二縣五區綱手每十人領銀二十兩造船一隻運石完日即以船給之當其值又萬歷四年邑令蘇湖有亷幹巡撫徐公栻檄令分築海鹽塘塘成郡縣官遷賚有差載董公份碑記其法倣宋王荆公鄞縣塘又參酌副使楊公瑄坡陀塘式堅石料砌磊碎石于內支之以殺潮勢後效僉事黃光升一縱一橫之法臣謹案先是二年萬厯乙亥六月朔夜大風震濤衝激錢塘江岸圯數十餘丈而郡邑志乘修築莫考三十三年錢塘縣令聶心湯築錢塘寶船厰塘隄萬厯錢塘縣志錢塘寶船厰一帶舊無隄塘田土傾坍邑令聶心湯鳩工核實樁石堅巨為久逺計費六千餘金崇禎三年春二月同知劉元瀚修海寧捍海塘寧邑備考崇禎元年七月二十三日午前風日清朗才過午狂颶卒發雷雨如注申酉間忽報海嘯登城望之見潮頭直架樹杪廬舍蕩拆夜半風濤稍殺厥明縣官出勘城東西被災者凡四千餘户事聞于朝議修築海塘時縣令謝紹芳屬衙官張瑞傑董其役張第以修河塘法從事未幾潮囓之旋築旋圯于是三臺畢臨相議工費撫按會題預徵糧銀每畝一分合計之得九千餘金道府捐助各有差命郡丞劉元潮董其役仍用石囤朩樁之法工稍就緒海塘録卷三
